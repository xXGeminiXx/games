<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Open Outcry</title>
<style>
:root{
  --slate:#2b332e;--slateDeep:#1d231f;--slateLit:#38403a;--floor:#242a26;--floorFar:#1c211e;
  --chalk:#f0efe6;--chalkDim:#b5b3a6;--ghost:#6d726a;--dust:#8b8f85;
  --timber:#6b5638;--timberLit:#8f7550;--timberDark:#463726;--red:#e08a6a;--redDim:#a6614a;
  --beam:#dcdacd;--panel:#252c27;--rule:#5b615a;
  --sans:Candara,"Gill Sans MT","Gill Sans","Trebuchet MS",Ubuntu,"Nimbus Sans","Liberation Sans",system-ui,sans-serif;
  --panelW:334px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--slateDeep)}
body{
  font:15px/1.45 var(--sans);color:var(--chalk);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  overscroll-behavior:none;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
button,input,select,textarea{font:inherit;font-variant-numeric:tabular-nums;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* --- the chalk box: a rectangle drawn on the wall ----------------------- */
.chalkbox{
  border:1.5px solid var(--ghost);border-radius:2px;background:rgba(0,0,0,.16);
  box-shadow:inset 0 0 0 1px rgba(240,239,230,.04);
}

/* --- the quote, written on the slate ------------------------------------ */
#stage{position:fixed;inset:0;pointer-events:none}
#quote{
  position:absolute;left:0;right:var(--panelW);display:flex;gap:12px;justify-content:center;
  align-items:flex-end;flex-wrap:wrap;pointer-events:none;padding:0 14px;
}
#quote>*{pointer-events:auto}
.qbox{
  border:1.5px solid var(--ghost);border-radius:2px;background:rgba(0,0,0,.22);
  padding:5px 8px 7px;min-width:118px;text-align:center;
}
.qbox.mine{border-color:var(--redDim)}
.qlabel{display:block;font-size:11.5px;letter-spacing:.02em;color:var(--chalkDim);margin-bottom:2px}
.qrow{display:flex;align-items:center;gap:4px;justify-content:center}
.qbox input{
  width:70px;min-height:36px;background:transparent;border:0;text-align:center;
  font-size:24px;font-weight:600;padding:0;color:var(--red);
}
.qbox.plain input{color:var(--chalk)}
.qbox input::-webkit-outer-spin-button,.qbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qbox input[type=number]{-moz-appearance:textfield}
.qstep{
  min-width:30px;min-height:36px;border:1px solid var(--ghost);border-radius:2px;
  background:transparent;color:var(--chalkDim);font-size:17px;line-height:1;padding:0;
}
.qstep:hover,.qstep:focus-visible{color:var(--chalk);border-color:var(--chalkDim)}
.qacts{display:flex;gap:8px;align-items:stretch}
.qacts button{
  min-height:48px;min-width:64px;padding:0 14px;border:1.5px solid var(--ghost);border-radius:2px;
  background:rgba(0,0,0,.22);color:var(--chalk);
}
.qacts button.key{border-color:var(--redDim);color:var(--red)}
.qacts button:hover,.qacts button:focus-visible{border-color:var(--chalk)}
.qacts button[disabled]{opacity:.4;cursor:default}

/* --- clerk tickets, pinned along the rail -------------------------------- */
#rail{position:absolute;left:14px;right:calc(var(--panelW) + 14px);display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.ticket{
  pointer-events:auto;border:1.5px solid var(--ghost);border-radius:2px;background:rgba(0,0,0,.34);
  padding:4px 9px;font-size:12px;color:var(--chalkDim);max-width:260px;
}
.ticket b{display:block;color:var(--chalk);font-weight:600;font-size:12.5px}
.ticket.fired{border-color:var(--redDim);color:var(--chalk)}
.ticket.off{opacity:.5}

/* --- the panel ----------------------------------------------------------- */
#panel{
  position:fixed;top:0;right:0;bottom:0;width:var(--panelW);
  background:linear-gradient(180deg,var(--panel),var(--slateDeep));
  border-left:1px solid var(--rule);
  overflow-y:auto;overscroll-behavior:contain;padding:12px 14px 40px;
}
#panel.folded{display:none}
#panel h2{
  font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--chalkDim);
  margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--rule);
}
#panel section:first-of-type h2{margin-top:2px}
#panel section[hidden]{display:none}
#panel p{margin:5px 0;font-size:13px;color:var(--chalkDim)}
#pittabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tab{
  min-height:34px;padding:0 11px;border:1.5px solid var(--ghost);border-radius:2px;
  background:transparent;color:var(--chalkDim);font-size:13px;
}
.tab.on{border-color:var(--red);color:var(--chalk)}
.tab[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:7px 0}
.row .grow{flex:1 1 auto;min-width:0}
.buy{
  min-height:38px;min-width:44px;padding:0 10px;border:1.5px solid var(--ghost);border-radius:2px;
  background:transparent;color:var(--chalk);font-size:13px;
}
.buy:hover:not([disabled]),.buy:focus-visible{border-color:var(--red)}
.buy[disabled]{opacity:.35;cursor:default}
.buy.lit{border-color:var(--red)}
.what{font-size:13.5px;color:var(--chalk)}
.note{font-size:12px;color:var(--chalkDim)}
.big{font-size:19px;color:var(--chalk)}
.mine{color:var(--red)}
#log{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--chalkDim);max-height:230px;overflow-y:auto}
#log li{padding:2px 0;border-bottom:1px solid rgba(91,97,90,.28)}
#log li:first-child{color:var(--chalk)}
.meter{height:7px;background:rgba(0,0,0,.38);border:1px solid var(--rule);border-radius:2px;overflow:hidden;margin:4px 0}
.meter>i{display:block;height:100%;background:var(--redDim);width:0}
textarea{
  width:100%;min-height:74px;background:rgba(0,0,0,.3);border:1px solid var(--rule);
  border-radius:2px;color:var(--chalkDim);font-size:11.5px;padding:6px;resize:vertical;
}

/* --- the clerk composer (structure comes from src/rules-ui.js) ----------- */
.rules{margin-top:4px}
.rules-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rules-bar button{min-height:34px;padding:0 10px;border:1.5px solid var(--ghost);border-radius:2px;background:transparent;color:var(--chalk);font-size:12.5px}
.rules-fires-label{display:none}
.rule-list{display:flex;flex-direction:column;gap:8px}
.rule-list[hidden]{display:none}
.rule-card{border:1.5px solid var(--ghost);border-radius:2px;background:rgba(0,0,0,.26);padding:7px 8px;font-size:12.5px}
.rule-head{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.rule-head input[type=text]{flex:1 1 auto;min-width:0;min-height:30px;background:transparent;border:0;border-bottom:1px solid var(--rule);color:var(--chalk)}
.rule-when,.rule-then,.rule-limits{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:4px 0}
.rule-cond{display:flex;gap:4px;flex-wrap:wrap;align-items:center;width:100%}
.rule-card select,.rule-card input[type=number]{
  min-height:32px;background:rgba(0,0,0,.3);border:1px solid var(--rule);border-radius:2px;
  color:var(--chalk);padding:2px 5px;font-size:12.5px;max-width:132px;
}
.rule-card input[type=checkbox]{width:24px;height:24px;accent-color:var(--redDim)}
.rule-card label{display:inline-flex;align-items:center;gap:5px;min-height:32px}
.rule-card button{min-height:32px;min-width:32px;border:1px solid var(--rule);border-radius:2px;background:transparent;color:var(--chalkDim);font-size:12.5px;padding:0 7px}
.rule-why{color:var(--chalkDim);font-size:11.5px;margin-top:5px}
.rule-stats{color:var(--ghost);font-size:11px}
.rule-io{display:block}
.rule-io[hidden]{display:none}
.rule-io-errors{margin:5px 0 0;padding-left:16px;font-size:11.5px;color:var(--red)}
.rule-card.rule-quarantined{border-color:var(--redDim)}

/* --- overlays ------------------------------------------------------------ */
.sheet{
  position:fixed;inset:0;display:grid;place-items:center;background:rgba(12,15,13,.72);z-index:20;padding:18px;
}
.sheet[hidden]{display:none}
.sheet>div{
  max-width:520px;width:100%;background:var(--panel);border:1.5px solid var(--ghost);border-radius:2px;
  padding:20px 22px;max-height:86vh;overflow-y:auto;
}
.sheet h1{font-size:21px;margin:0 0 10px;font-weight:600}
.sheet p{font-size:14px;color:var(--chalkDim);margin:0 0 14px}
.sheet button{min-height:46px;padding:0 18px;border:1.5px solid var(--red);border-radius:2px;background:transparent;color:var(--chalk)}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px;margin:0}
.sheet dt{color:var(--red)}
.sheet dd{margin:0;color:var(--chalkDim)}
#foldbtn{
  position:fixed;right:10px;top:10px;z-index:12;min-height:34px;min-width:44px;
  border:1.5px solid var(--ghost);border-radius:2px;background:rgba(0,0,0,.4);color:var(--chalkDim);font-size:12px;
}
#hint{
  position:fixed;left:14px;bottom:4px;font-size:11.5px;color:var(--ghost);pointer-events:none;
}

@media (max-width:820px){
  :root{--panelW:0px}
  /* The page itself is the scroller here, so it must be allowed to grow past
     the window. Leaving height:100% on makes the panel unreachable: every
     control below the fold is genuinely off the end of the page rather than
     one flick away, and nothing on screen says so. */
  html,body{height:auto;min-height:100%;overflow:visible}
  #c{position:fixed;top:0;left:0;right:0;height:46vh;width:100%}
  /* The board is a band across the top and everything else is under it. The
     quote boxes come OUT of the picture here: a phone board is 390 by 380 and
     four boxes laid over it bury the figures they are meant to sit beside. */
  #stage{position:static;height:auto;margin-top:46vh;pointer-events:auto}
  #quote{
    position:static;left:auto;right:auto;bottom:auto;justify-content:flex-start;
    padding:10px 12px;background:var(--panel);border-top:1px solid var(--rule);
  }
  #rail{position:static;left:auto;right:auto;top:auto;padding:0 12px 10px;background:var(--panel)}
  #panel{position:static;width:100%;height:auto;margin-top:0;border-left:0;border-top:1px solid var(--rule);overflow:visible;padding-bottom:60px}
  #hint,#foldbtn{display:none}
  .qbox{min-width:104px}
  .qbox input{width:60px;font-size:21px}
}
/* Every control is a thumb target on a touch screen. */
@media (pointer: coarse){
  button,select,[role=button],input{min-height:36px;min-width:36px}
  input[type=checkbox]{width:28px;height:28px;min-height:28px;min-width:28px}
  .qstep{min-width:44px;min-height:44px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
<!-- plays:start -->
<script>
(function () {
  // Counts one play, once, and then stays quiet. See games-plays/README.md for
  // what is stored on the other end, which is a total and nothing else.
  var END = 'https://games-plays.xxgeminixx.workers.dev', GAME = 'open-outcry';
  if (!END || !window.fetch) return;

  // A build being served off this machine is a build being worked on. Counting
  // it would mean the numbers are mostly whoever made the game.
  var h = location.hostname;
  if (!h || h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || location.protocol === 'file:') return;
  if (location.search.indexOf('nocount') >= 0) return;

  // Without storage there is no way to tell a first play from a fifth, and a
  // counter that cannot tell would count every reload. Undercounting by the
  // browsers that block storage is a wrong number; counting every reload is a
  // meaningless one, so this browser is simply not counted.
  var KEY = '__plays', all;
  try {
    all = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (!all || typeof all !== 'object') all = {};
    localStorage.setItem(KEY, JSON.stringify(all));
  } catch (e) { return; }

  var me = all[GAME] || (all[GAME] = {});
  var day = new Date().toISOString().slice(0, 10);
  var carried = Number(me.owed) || 0;   // seconds played on earlier visits, never reported
  var played = 0;                       // seconds this page has been watched
  var touched = false;                  // somebody has actually done something
  var sending = false;

  var HOLD = 10;        // seconds of real attention before a play is a play
  var RETRY = 60;       // and how long to wait before asking again if that failed
  var TOPUP = 120;      // seconds worth carrying home at the end of a visit
  var HOUR = 3600000;

  // Every game on this site shares one key, and a game can be open in two tabs
  // at once - an idle game is meant to be left open. A page that writes the
  // whole object back writes what it read when it loaded, which erases what
  // another tab recorded in the meantime. Erasing a game's record makes its
  // next play look like a new player, so the headline number is the one that
  // inflates. Take the freshest record for this game, and never move it back.
  function sync() {
    var now;
    try { now = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { now = null; }
    if (!now || typeof now !== 'object') now = {};
    var kept = now[GAME] || {};
    if (kept.day && (!me.day || kept.day > me.day)) me.day = kept.day;
    if (kept.back) me.back = 1;
    if (kept.top && (!me.top || kept.top > me.top)) me.top = kept.top;
    now[GAME] = me;
    all = now;
    return now;
  }

  function save() {
    try { var now = sync(); me.owed = carried + played; localStorage.setItem(KEY, JSON.stringify(now)); } catch (e) {}
  }

  function post(body, beacon) {
    var text = JSON.stringify(body);
    // text/plain is a content type the browser is allowed to send without
    // asking the server for permission first, so one request does the job.
    if (beacon && navigator.sendBeacon) {
      try { return navigator.sendBeacon(END + '/api/play', new Blob([text], { type: 'text/plain' })); } catch (e) { return false; }
    }
    return fetch(END + '/api/play', {
      method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: text, keepalive: true
    });
  }

  // The play itself: sent once per day, carrying whatever time was never
  // reported before it.
  function report() {
    sync();                                // another tab may have already done it
    if (sending || me.day === day) return;
    sending = true;
    var owed = carried + played;
    var body = {
      game: GAME,
      session: true,
      first: !me.day,                                 // this browser has never played it
      returning: Boolean(me.day && !me.back),         // played before, and this is the first day back
      seconds: owed
    };
    post(body).then(function (r) {
      sending = false;
      if (!r || !r.ok) return;                        // try again on the next visit
      if (body.returning) me.back = 1;
      me.day = day;
      carried -= owed;                                // exactly what was reported, no more
      save();
    }).catch(function () { sending = false; });
  }

  // Time played after the day's report, handed over when the page goes away.
  // The clock is cleared before the request rather than after, because this
  // one cannot be confirmed: losing a few minutes is a smaller lie than
  // counting them twice.
  function topup() {
    sync();
    var owed = carried + played;
    if (owed < TOPUP || me.day !== day) return;
    if (me.top && Date.now() - me.top < HOUR) return;
    me.top = Date.now();
    carried -= owed;
    save();
    post({ game: GAME, session: false, first: false, returning: false, seconds: owed }, true);
  }

  var mark = 0;
  setInterval(function () {
    if (document.hidden) return;
    played++;
    // A report that failed is worth trying again, but not every second: a
    // counter must never turn one unreachable server into a request per
    // second per open tab.
    if (touched && played >= HOLD && (played - HOLD) % RETRY === 0) report();
    if (++mark >= 15) { mark = 0; save(); }
  }, 1000);

  var note = function () { touched = true; };
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (t) {
    addEventListener(t, note, { once: true, passive: true, capture: true });
  });
  addEventListener('pagehide', topup);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { save(); topup(); } });
})();
</script>
<!-- plays:end -->
<!-- build-watch:start -->
<meta name="build" content="d2d412f1ac4a">
<script>
(function () {
  var meta = document.querySelector('meta[name="build"]');
  var mine = meta && meta.getAttribute('content');
  if (!mine || !window.fetch) return;
  var every = 300000;          // re-ask every five minutes while the tab is open
  var checking = false;

  function reload(to) {
    // A plain reload can be answered from cache, so the new build is asked for
    // by a URL the cache has not seen. Whatever the player already had on the
    // address bar is kept; only a previous build stamp is replaced.
    var q = new URLSearchParams(location.search);
    q.set('b', to);
    location.replace(location.pathname + '?' + q.toString() + location.hash);
  }

  function check() {
    if (checking || document.hidden) return;
    checking = true;
    fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        checking = false;
        if (!j || !j.build || j.build === mine) return;
        // One reload per build. If the page comes back still stamped with the
        // old id the files were not really replaced, and reloading again would
        // only spin.
        try {
          if (sessionStorage.getItem('build-watch') === j.build) return;
          sessionStorage.setItem('build-watch', j.build);
        } catch (e) { /* private mode: fall through and reload once */ }
        reload(j.build);
      })
      .catch(function () { checking = false; });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, every);
  setTimeout(check, 15000);
})();
</script>
<!-- build-watch:end -->
</head>
<body>
<canvas id="c" aria-label="The pit: a slate board over a floor of traders"></canvas>

<div id="stage">
  <div id="quote">
    <div class="qbox mine" id="bidbox">
      <span class="qlabel" data-t="labels.bid"></span>
      <div class="qrow">
        <button class="qstep" data-step="bid:-1" aria-label="lower the bid">-</button>
        <input id="bid" type="number" step="1" min="1" aria-label="your bid">
        <button class="qstep" data-step="bid:1" aria-label="raise the bid">+</button>
      </div>
    </div>
    <div class="qbox plain" id="sizebox">
      <span class="qlabel" data-t="labels.size"></span>
      <div class="qrow">
        <button class="qstep" data-step="size:-1" aria-label="smaller size">-</button>
        <input id="size" type="number" step="1" min="1" aria-label="your size">
        <button class="qstep" data-step="size:1" aria-label="bigger size">+</button>
      </div>
    </div>
    <div class="qbox mine" id="askbox">
      <span class="qlabel" data-t="labels.offer"></span>
      <div class="qrow">
        <button class="qstep" data-step="ask:-1" aria-label="lower the offer">-</button>
        <input id="ask" type="number" step="1" min="1" aria-label="your offer">
        <button class="qstep" data-step="ask:1" aria-label="raise the offer">+</button>
      </div>
    </div>
    <div class="qbox plain" id="spreadbox" hidden>
      <span class="qlabel" data-t="labels.spread"></span>
      <div class="qrow">
        <button class="qstep" data-step="spread:-1" aria-label="narrow the spread">-</button>
        <input id="spread" type="number" step="1" min="2" aria-label="your spread">
        <button class="qstep" data-step="spread:1" aria-label="widen the spread">+</button>
      </div>
    </div>
    <div class="qacts">
      <button id="requote" class="key" data-t="labels.requote" data-title="labels.requoteHint"></button>
      <button id="flatten" data-t="labels.flatten" data-title="labels.flattenHint"></button>
      <button id="pullq" data-t="labels.pull" data-title="labels.pullHint"></button>
    </div>
  </div>
  <div id="rail"></div>
</div>

<button id="foldbtn" data-t="labels.fold"></button>
<div id="hint"></div>

<aside id="panel">
  <div id="pittabs"></div>

  <section id="sec-ladder" hidden>
    <h2 data-t="sections.ladder"></h2>
    <div id="ladder-size"></div>
  </section>

  <section id="sec-clerks" hidden>
    <h2 data-t="sections.clerks"></h2>
    <div id="ladder-clerk"></div>
    <p class="note" id="clerk-count"></p>
    <div id="composer"></div>
  </section>

  <section id="sec-seat" hidden>
    <h2 data-t="sections.seat"></h2>
    <p class="note" id="seat-now"></p>
    <div id="ladder-seat"></div>
    <p class="note" id="seat-paid"></p>
  </section>

  <section id="sec-runners" hidden>
    <h2 data-t="sections.runners"></h2>
    <p class="note" id="runner-now"></p>
    <div id="ladder-runner"></div>
  </section>

  <section id="sec-pits" hidden>
    <h2 data-t="sections.pits"></h2>
    <div id="pit-offers"></div>
  </section>

  <section id="sec-corner" hidden>
    <h2 data-t="sections.corner"></h2>
    <div class="meter"><i id="corner-bar"></i></div>
    <p class="note" id="corner-need"></p>
    <p class="note" id="corner-pays"></p>
    <div class="row"><button class="buy grow" id="corner-call" data-t="labels.cornerCall"></button></div>
  </section>

  <section id="sec-city" hidden>
    <h2 data-t="sections.city"></h2>
    <p class="note" id="city-rep"></p>
    <div id="city-spend"></div>
    <div class="row"><button class="buy grow" id="city-go"></button></div>
  </section>

  <section id="sec-log">
    <h2 data-t="sections.log"></h2>
    <ul id="log"></ul>
  </section>

  <section id="sec-save">
    <h2 data-t="sections.save"></h2>
    <div class="row">
      <button class="buy" id="do-export" data-t="labels.exportSave"></button>
      <button class="buy" id="do-reset" data-t="labels.reset"></button>
      <button class="buy" id="do-keys" data-t="labels.keys"></button>
