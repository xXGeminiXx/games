<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Open Outcry</title>
<style>
:root{
  --slate:#2b332e;--slateDeep:#1d231f;--slateLit:#38403a;--floor:#242a26;--floorFar:#1c211e;
  --chalk:#f0efe6;--chalkDim:#b5b3a6;--ghost:#6d726a;--dust:#8b8f85;
  --timber:#6b5638;--timberLit:#8f7550;--timberDark:#463726;--red:#e08a6a;--redDim:#a6614a;
  --beam:#dcdacd;--panel:#252c27;--rule:#5b615a;
  --sans:Candara,"Gill Sans MT","Gill Sans","Trebuchet MS",Ubuntu,"Nimbus Sans","Liberation Sans",system-ui,sans-serif;
  --panelW:340px;
  --railTop:52%;
  --railBottom:55.6%;
  --floorBottom:81.5%;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--slateDeep)}
body{
  font:16px/1.45 var(--sans);color:var(--chalk);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  overscroll-behavior:none;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
button,input,select,textarea{font:inherit;font-variant-numeric:tabular-nums;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* --- what the slate says, set in type so it can be read ------------------ */
/* The board carries the FIGURES, written in chalk strokes. Sentences are set
   here instead: a stroke alphabet at fourteen pixels is mud, and every line
   the game uses to teach itself is a sentence. */
#stage{position:fixed;inset:0;pointer-events:none}
#stage>*{pointer-events:auto}
.says{position:absolute;pointer-events:none;text-shadow:0 1px 3px rgba(12,15,13,.75)}
#holding{left:22px;top:calc(var(--railTop) * 0.265);font-size:16px;color:var(--chalkDim)}
#holding.carrying{color:var(--red)}
#crowd{right:calc(var(--panelW) + 22px);top:14px;font-size:15px;color:var(--chalkDim)}
#middle{
  left:0;right:var(--panelW);top:calc(var(--railTop) * 0.355);
  text-align:center;padding:0 16px;
}
#why,#news{margin:0}
#why{font-size:16.5px;color:var(--chalkDim)}
#news{font-size:16.5px;color:var(--red);min-height:1.4em}

/* --- the controls, on the slate just above the rail ---------------------- */
/* The desk across the front of the room. Everything a hand touches is here,
   with nothing drawn behind it, so no control ever sits on the price line. */
#controls{
  position:absolute;left:0;right:var(--panelW);top:var(--floorBottom);bottom:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:8px 16px;
}
#deskrow{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  width:100%;max-width:760px;
}
#fresh{
  display:flex;align-items:center;gap:10px;font-size:15px;color:var(--chalkDim);
  min-height:22px;margin:0;
}
/* A control that wraps to two lines changes height and shoves the row about.
   The desk is a fixed band; nothing on it reflows. */
.minor button,#wipe{white-space:nowrap}
#fresh .bar{width:120px;height:6px;background:rgba(0,0,0,.45);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
#fresh .bar>i{display:block;height:100%;width:0;background:var(--redDim);transition:width .12s linear}
#fresh.warn{color:var(--chalk)}
#fresh.stale{color:var(--red)}
#fresh.stale .bar>i{background:var(--red)}
.hands{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.dial{
  border:1.5px solid var(--ghost);border-radius:2px;background:rgba(0,0,0,.30);
  padding:4px 8px 6px;text-align:center;min-width:132px;
}
.dial .name{display:block;font-size:13px;letter-spacing:.02em;color:var(--chalkDim);margin-bottom:1px}
.dial .row{display:flex;align-items:center;justify-content:center;gap:6px}
.dial .val{font-size:24px;font-weight:600;min-width:42px;color:var(--chalk)}
.step{
  min-width:34px;min-height:34px;border:1px solid var(--ghost);border-radius:2px;
  background:transparent;color:var(--chalkDim);font-size:19px;line-height:1;padding:0;
}
.step:hover:not([disabled]),.step:focus-visible{color:var(--chalk);border-color:var(--chalk)}
.step[disabled]{opacity:.3;cursor:default}
#wipe{
  min-height:56px;padding:0 22px;border:2px solid var(--red);border-radius:2px;
  background:rgba(0,0,0,.30);color:var(--chalk);font-size:17px;
}
#wipe:hover,#wipe:focus-visible{background:rgba(224,138,106,.16)}
#wipe.stale{background:rgba(224,138,106,.13);border-color:var(--red);color:var(--red)}
.minor{display:flex;gap:8px}
.minor button{
  min-height:36px;padding:0 13px;border:1.5px solid var(--ghost);border-radius:2px;
  background:rgba(0,0,0,.26);color:var(--chalkDim);font-size:14px;
}
.minor button:hover:not([disabled]),.minor button:focus-visible{color:var(--chalk);border-color:var(--chalkDim)}
.minor button[disabled]{opacity:.35;cursor:default}

/* --- clerk tickets, pinned along the rail -------------------------------- */
#rail{
  position:absolute;left:14px;right:calc(var(--panelW) + 14px);
  top:calc(var(--railBottom) + 8px);
  display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;
}
.ticket{
  pointer-events:auto;border:1.5px solid var(--ghost);border-radius:2px;background:rgba(12,15,13,.62);
  padding:4px 9px;font-size:13px;color:var(--chalkDim);max-width:280px;
}
.ticket b{color:var(--chalk);font-weight:600}
.ticket.fired{border-color:var(--red);color:var(--chalk)}
.ticket.off{opacity:.5}

/* --- the panel ----------------------------------------------------------- */
#panel{
  position:fixed;top:0;right:0;bottom:0;width:var(--panelW);
  background:linear-gradient(180deg,var(--panel),var(--slateDeep));
  border-left:1px solid var(--rule);
  overflow-y:auto;overscroll-behavior:contain;padding:12px 14px 40px;
}
#panel.folded{display:none}
#panel h2{
  font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--chalkDim);
  margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--rule);
}
#panel section[hidden]{display:none}
#pittabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.tab{
  min-height:36px;padding:0 12px;border:1.5px solid var(--ghost);border-radius:2px;
  background:transparent;color:var(--chalkDim);font-size:14px;
}
.tab.on{border-color:var(--red);color:var(--chalk)}

/* The one line that says what to do next. It is the first thing in the panel
   and it is never empty. */
#next{
  border-left:3px solid var(--redDim);padding:7px 0 7px 10px;margin:4px 0 2px;
  font-size:15px;color:var(--chalk);
}

/* A thing you can buy: what it is, what it does, and the buttons. */
.item{padding:9px 0;border-bottom:1px solid rgba(91,97,90,.30)}
.item:last-child{border-bottom:0}
.item .head{display:flex;gap:8px;align-items:baseline}
.item .title{flex:1 1 auto;font-size:15px;color:var(--chalk)}
.item .have{font-size:13px;color:var(--ghost)}
.item .what{font-size:13.5px;color:var(--chalkDim);margin:2px 0 6px}
.item .acts{display:flex;gap:7px;flex-wrap:wrap}
.buy{
  min-height:38px;padding:0 12px;border:1.5px solid var(--ghost);border-radius:2px;
  background:transparent;color:var(--chalk);font-size:14px;
}
.buy:hover:not([disabled]),.buy:focus-visible{border-color:var(--red)}
.buy[disabled]{opacity:.4;cursor:default;color:var(--chalkDim)}
.buy.lit{border-color:var(--red)}
.buy.wide{width:100%}
.note{font-size:13.5px;color:var(--chalkDim);margin:5px 0}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0}

/* A clerk is a person with a name and one job. */
.clerk{border:1.5px solid var(--ghost);border-radius:2px;background:rgba(0,0,0,.22);padding:7px 9px;margin:7px 0}
.clerk .who{font-size:15px;color:var(--chalk)}
.clerk .job{font-size:13.5px;color:var(--chalkDim)}
.clerk.idle{opacity:.6}
#composer-toggle{
  min-height:34px;padding:0 11px;border:1px solid var(--rule);border-radius:2px;
  background:transparent;color:var(--chalkDim);font-size:13px;margin-top:6px;
}
#composer[hidden]{display:none}

#log{list-style:none;margin:0;padding:0;font-size:13.5px;color:var(--chalkDim);max-height:250px;overflow-y:auto}
#log li{padding:3px 0;border-bottom:1px solid rgba(91,97,90,.24)}
#log li:first-child{color:var(--chalk)}
.meter{height:8px;background:rgba(0,0,0,.38);border:1px solid var(--rule);border-radius:2px;overflow:hidden;margin:6px 0}
.meter>i{display:block;height:100%;background:var(--redDim);width:0}
textarea{
  width:100%;min-height:70px;background:rgba(0,0,0,.3);border:1px solid var(--rule);
  border-radius:2px;color:var(--chalkDim);font-size:12px;padding:6px;resize:vertical;
}

/* --- the clerk composer (structure comes from src/rules-ui.js) ----------- */
.rules{margin-top:4px}
.rules-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rules-bar button{min-height:34px;padding:0 10px;border:1.5px solid var(--ghost);border-radius:2px;background:transparent;color:var(--chalk);font-size:13px}
.rules-fires-label{display:none}
.rule-list{display:flex;flex-direction:column;gap:8px}
.rule-list[hidden]{display:none}
.rule-card{border:1.5px solid var(--ghost);border-radius:2px;background:rgba(0,0,0,.26);padding:7px 8px;font-size:13px}
.rule-head{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.rule-head input[type=text]{flex:1 1 auto;min-width:0;min-height:30px;background:transparent;border:0;border-bottom:1px solid var(--rule);color:var(--chalk)}
.rule-when,.rule-then,.rule-limits{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:4px 0}
.rule-cond{display:flex;gap:4px;flex-wrap:wrap;align-items:center;width:100%}
.rule-card select,.rule-card input[type=number]{
  min-height:32px;background:rgba(0,0,0,.3);border:1px solid var(--rule);border-radius:2px;
  color:var(--chalk);padding:2px 5px;font-size:13px;max-width:150px;
}
.rule-card input[type=checkbox]{width:24px;height:24px;accent-color:var(--redDim)}
.rule-card label{display:inline-flex;align-items:center;gap:5px;min-height:32px}
.rule-card button{min-height:32px;min-width:32px;border:1px solid var(--rule);border-radius:2px;background:transparent;color:var(--chalkDim);font-size:13px;padding:0 7px}
.rule-why{color:var(--chalkDim);font-size:12.5px;margin-top:5px}
.rule-stats{color:var(--ghost);font-size:11.5px}
.rule-io{display:block}
.rule-io[hidden]{display:none}
.rule-io-errors{margin:5px 0 0;padding-left:16px;font-size:12.5px;color:var(--red)}
.rule-card.rule-quarantined{border-color:var(--redDim)}

/* --- overlays ------------------------------------------------------------ */
.sheet{
  position:fixed;inset:0;display:grid;place-items:center;background:rgba(12,15,13,.78);z-index:20;padding:18px;
}
.sheet[hidden]{display:none}
.sheet>div{
  max-width:540px;width:100%;background:var(--panel);border:1.5px solid var(--ghost);border-radius:2px;
  padding:22px 24px;max-height:88vh;overflow-y:auto;
}
.sheet h1{font-size:23px;margin:0 0 12px;font-weight:600}
.sheet p{font-size:16px;color:var(--chalkDim);margin:0 0 12px}
.sheet ol{margin:0 0 18px;padding-left:22px;font-size:16px;color:var(--chalk)}
.sheet ol li{margin:0 0 9px}
.sheet button{min-height:48px;padding:0 20px;border:2px solid var(--red);border-radius:2px;background:transparent;color:var(--chalk);font-size:16px}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px;margin:0 0 16px}
.sheet dt{color:var(--red)}
.sheet dd{margin:0;color:var(--chalkDim)}
#foldbtn{
  position:fixed;right:10px;top:10px;z-index:12;min-height:34px;min-width:46px;
  border:1.5px solid var(--ghost);border-radius:2px;background:rgba(0,0,0,.45);color:var(--chalkDim);font-size:13px;
}
#hint{color:var(--ghost);font-size:13px}

@media (max-width:820px){
  :root{--panelW:0px}
  /* The page itself is the scroller here, so it must be allowed to grow past
     the window. Leaving height:100% on makes the panel unreachable: every
     control below the fold is genuinely off the end of the page rather than
     one flick away, and nothing on screen says so. */
  html,body{height:auto;min-height:100%;overflow:visible}
  #c{position:fixed;top:0;left:0;right:0;height:44vh;width:100%}
  #stage{position:static;height:auto;margin-top:44vh;pointer-events:auto}
  /* The sentences come off the picture on a phone: a board 390 wide has no
     room for a line of type beside a figure. They stack under it in one block
     with the picture, tight, so they read as a caption and not as a list. */
  .says{position:static;text-align:left;padding:0 14px;margin:0}
  #middle{position:static;right:auto;padding:0 14px;text-align:left}
  #stage>.says:first-of-type{padding-top:10px}
  #holding,#crowd{font-size:15px;line-height:1.5}
  #why,#news{font-size:15px;line-height:1.5}
  #news:empty{display:none}
  #controls{
    position:static;left:auto;right:auto;bottom:auto;top:auto;align-items:stretch;
    padding:12px 14px;background:var(--panel);border-top:1px solid var(--rule);margin-top:8px;
  }
  #deskrow{flex-direction:column;align-items:stretch;gap:10px;max-width:none}
  #fresh{justify-content:flex-start}
  .hands{justify-content:flex-start}
  #wipe{width:100%}
  #rail{position:static;left:auto;right:auto;top:auto;padding:0 14px 10px}
  #panel{position:static;width:100%;height:auto;border-left:0;border-top:1px solid var(--rule);overflow:visible;padding-bottom:60px}
  #foldbtn{display:none}
}
/* Every control is a thumb target on a touch screen. */
@media (pointer: coarse){
  button,select,[role=button],input{min-height:38px;min-width:38px}
  input[type=checkbox]{width:28px;height:28px;min-height:28px;min-width:28px}
  .step{min-width:46px;min-height:46px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
<!-- plays:start -->
<script>
(function () {
  // Counts one play, once, and then stays quiet. See games-plays/README.md for
  // what is stored on the other end, which is a total and nothing else.
  var END = 'https://games-plays.xxgeminixx.workers.dev', GAME = 'open-outcry';
  if (!END || !window.fetch) return;

  // A build being served off this machine is a build being worked on. Counting
  // it would mean the numbers are mostly whoever made the game.
  var h = location.hostname;
  if (!h || h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || location.protocol === 'file:') return;
  if (location.search.indexOf('nocount') >= 0) return;

  // Without storage there is no way to tell a first play from a fifth, and a
  // counter that cannot tell would count every reload. Undercounting by the
  // browsers that block storage is a wrong number; counting every reload is a
  // meaningless one, so this browser is simply not counted.
  var KEY = '__plays', all;
  try {
    all = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (!all || typeof all !== 'object') all = {};
    localStorage.setItem(KEY, JSON.stringify(all));
  } catch (e) { return; }

  var me = all[GAME] || (all[GAME] = {});
  var day = new Date().toISOString().slice(0, 10);
  var carried = Number(me.owed) || 0;   // seconds played on earlier visits, never reported
  var played = 0;                       // seconds this page has been watched
  var touched = false;                  // somebody has actually done something
  var sending = false;

  var HOLD = 10;        // seconds of real attention before a play is a play
  var RETRY = 60;       // and how long to wait before asking again if that failed
  var TOPUP = 120;      // seconds worth carrying home at the end of a visit
  var HOUR = 3600000;

  // Every game on this site shares one key, and a game can be open in two tabs
  // at once - an idle game is meant to be left open. A page that writes the
  // whole object back writes what it read when it loaded, which erases what
  // another tab recorded in the meantime. Erasing a game's record makes its
  // next play look like a new player, so the headline number is the one that
  // inflates. Take the freshest record for this game, and never move it back.
  function sync() {
    var now;
    try { now = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { now = null; }
    if (!now || typeof now !== 'object') now = {};
    var kept = now[GAME] || {};
    if (kept.day && (!me.day || kept.day > me.day)) me.day = kept.day;
    if (kept.back) me.back = 1;
    if (kept.top && (!me.top || kept.top > me.top)) me.top = kept.top;
    now[GAME] = me;
    all = now;
    return now;
  }

  function save() {
    try { var now = sync(); me.owed = carried + played; localStorage.setItem(KEY, JSON.stringify(now)); } catch (e) {}
  }

  function post(body, beacon) {
    var text = JSON.stringify(body);
    // text/plain is a content type the browser is allowed to send without
    // asking the server for permission first, so one request does the job.
    if (beacon && navigator.sendBeacon) {
      try { return navigator.sendBeacon(END + '/api/play', new Blob([text], { type: 'text/plain' })); } catch (e) { return false; }
    }
    return fetch(END + '/api/play', {
      method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: text, keepalive: true
    });
  }

  // The play itself: sent once per day, carrying whatever time was never
  // reported before it.
  function report() {
    sync();                                // another tab may have already done it
    if (sending || me.day === day) return;
    sending = true;
    var owed = carried + played;
    var body = {
      game: GAME,
      session: true,
      first: !me.day,                                 // this browser has never played it
      returning: Boolean(me.day && !me.back),         // played before, and this is the first day back
      seconds: owed
    };
    post(body).then(function (r) {
      sending = false;
      if (!r || !r.ok) return;                        // try again on the next visit
      if (body.returning) me.back = 1;
      me.day = day;
      carried -= owed;                                // exactly what was reported, no more
      save();
    }).catch(function () { sending = false; });
  }

  // Time played after the day's report, handed over when the page goes away.
  // The clock is cleared before the request rather than after, because this
  // one cannot be confirmed: losing a few minutes is a smaller lie than
  // counting them twice.
  function topup() {
    sync();
    var owed = carried + played;
    if (owed < TOPUP || me.day !== day) return;
    if (me.top && Date.now() - me.top < HOUR) return;
    me.top = Date.now();
    carried -= owed;
    save();
    post({ game: GAME, session: false, first: false, returning: false, seconds: owed }, true);
  }

  var mark = 0;
  setInterval(function () {
    if (document.hidden) return;
    played++;
    // A report that failed is worth trying again, but not every second: a
    // counter must never turn one unreachable server into a request per
    // second per open tab.
    if (touched && played >= HOLD && (played - HOLD) % RETRY === 0) report();
    if (++mark >= 15) { mark = 0; save(); }
  }, 1000);

  var note = function () { touched = true; };
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (t) {
    addEventListener(t, note, { once: true, passive: true, capture: true });
  });
  addEventListener('pagehide', topup);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { save(); topup(); } });
})();
</script>
<!-- plays:end -->
<!-- build-watch:start -->
<meta name="build" content="852a286fd8c3">
<script>
(function () {
  var meta = document.querySelector('meta[name="build"]');
  var mine = meta && meta.getAttribute('content');
  if (!mine || !window.fetch) return;
  var every = 300000;          // re-ask every five minutes while the tab is open
  var checking = false;

  function reload(to) {
    // A plain reload can be answered from cache, so the new build is asked for
    // by a URL the cache has not seen. Whatever the player already had on the
    // address bar is kept; only a previous build stamp is replaced.
    var q = new URLSearchParams(location.search);
    q.set('b', to);
    location.replace(location.pathname + '?' + q.toString() + location.hash);
  }

  function check() {
    if (checking || document.hidden) return;
    checking = true;
    fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        checking = false;
        if (!j || !j.build || j.build === mine) return;
        // One reload per build. If the page comes back still stamped with the
        // old id the files were not really replaced, and reloading again would
        // only spin.
        try {
          if (sessionStorage.getItem('build-watch') === j.build) return;
          sessionStorage.setItem('build-watch', j.build);
        } catch (e) { /* private mode: fall through and reload once */ }
        reload(j.build);
      })
      .catch(function () { checking = false; });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, every);
  setTimeout(check, 15000);
})();
</script>
<!-- build-watch:end -->

<body>
<canvas id="c" aria-label="A market hall: a slate board over a floor of traders"></canvas>

<div id="stage">
  <p class="says" id="holding"></p>
  <p class="says" id="crowd"></p>
  <div class="says" id="middle">
    <p id="why"></p>
    <p id="news"></p>
  </div>

  <div id="controls">
    <div class="hands">
      <div class="dial">
        <span class="name" data-t="labels.cut"></span>
        <div class="row">
          <button class="step" id="cut-minus" data-step="cut:-1" aria-label="a smaller cut">-</button>
          <span class="val" id="cut-val">0</span>
          <button class="step" id="cut-plus" data-step="cut:1" aria-label="a bigger cut">+</button>
        </div>
      </div>
      <button id="wipe" data-t="labels.wipe" data-title="labels.wipeHint"></button>
      <div class="dial">
        <span class="name" data-t="labels.atOnce"></span>
        <div class="row">
          <button class="step" id="size-minus" data-step="size:-1" aria-label="fewer sacks at a time">-</button>
          <span class="val" id="size-val">0</span>
          <button class="step" id="size-plus" data-step="size:1" aria-label="more sacks at a time">+</button>
        </div>
      </div>
    </div>
    <div id="deskrow">
      <p id="fresh"><span id="fresh-text"></span><span class="bar"><i id="fresh-bar"></i></span></p>
      <div class="minor">
        <button id="dump" data-t="labels.dump" data-title="labels.dumpHint"></button>
        <button id="stopq" data-t="labels.stop" data-title="labels.stopHint"></button>
      </div>
    </div>
  </div>

  <div id="rail"></div>
</div>

<button id="foldbtn" data-t="labels.fold"></button>

<aside id="panel">
  <div id="pittabs"></div>
  <p id="next"></p>

  <section id="sec-buy" hidden>
    <h2 data-t="sections.buy"></h2>
    <div id="buy-list"></div>
  </section>

  <section id="sec-clerks" hidden>
    <h2 data-t="sections.clerks"></h2>
    <div id="clerk-list"></div>
    <p class="note" id="clerk-count"></p>
    <button id="composer-toggle" type="button">Set their jobs yourself</button>
    <div id="composer" hidden></div>
  </section>

  <section id="sec-markets" hidden>
    <h2 data-t="sections.markets"></h2>
    <p class="note" id="markets-full" hidden></p>
    <div id="market-list"></div>
  </section>

  <section id="sec-corner" hidden>
    <h2 data-t="sections.corner"></h2>
    <div class="meter"><i id="corner-bar"></i></div>
    <p class="note" id="corner-need"></p>
    <p class="note" id="corner-pays"></p>
    <button class="buy wide" id="corner-call" data-t="labels.cornerCall"></button>
  </section>

  <section id="sec-city" hidden>
    <h2 data-t="sections.city"></h2>
    <p class="note" id="city-rep"></p>
    <div id="city-spend"></div>
    <button class="buy wide" id="city-go"></button>
  </section>

  <section id="sec-log">
    <h2 data-t="sections.log"></h2>
    <ul id="log"></ul>
  </section>

  <section id="sec-save">
    <h2 data-t="sections.save"></h2>
    <div class="row">
      <button class="buy" id="do-export" data-t="labels.exportSave"></button>
      <button class="buy" id="do-reset" data-t="labels.reset"></button>
      <button class="buy" id="do-keys" data-t="labels.keys"></button>
    </div>
    <p class="note" id="hint"></p>
    <textarea id="savebox" spellcheck="false" aria-label="the run as a string"></textarea>
    <div class="row"><button class="buy" id="do-import" data-t="labels.importDo"></button><span class="note" id="save-note"></span></div>
  </section>
</aside>

<div class="sheet" id="intro" hidden><div>
  <h1 data-t="intro.title"></h1>
  <p data-t="intro.lead"></p>
  <ol id="intro-steps"></ol>
  <button id="intro-go" data-t="intro.go"></button>
</div></div>

<div class="sheet" id="keys" hidden><div>
  <h1 data-t="sections.keys"></h1>
  <dl id="keys-list"></dl>
  <button id="keys-close" data-t="labels.closeKeys"></button>
</div></div>

<div class="sheet" id="away" hidden><div>
  <h1 id="away-title"></h1>
  <p id="away-body"></p>
  <button id="away-go" data-t="intro.go"></button>
</div></div>

<script type="module">
import { boot } from './src/ui.js?v=4';
boot();
</script>
</body>
</html>
