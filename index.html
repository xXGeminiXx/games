<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090c'/%3E%3Ccircle cx='11' cy='12' r='4' fill='%235ad1ff'/%3E%3Ccircle cx='21' cy='21' r='6' fill='%23e6e9ef'/%3E%3C/svg%3E">
<style>
  :root{
    --void:#08090c; --panel:#0e1016; --rule:#1c2029;
    --ink:#e6e9ef; --dim:#7a828f; --accent:#5ad1ff;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0}
  body{
    background:var(--void); color:var(--ink);
    font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; justify-content:center; padding:40px 20px;
  }
  main{width:100%; max-width:1040px}
  h1{
    font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:.22em;
    color:var(--dim); margin:0;
  }
  /* The filter earns its place once the list outgrows a glance; it is hidden
     below that count rather than sitting there asking to be used. */
  #head{display:flex; align-items:center; gap:16px; margin:0 0 26px}
  #find{
    margin-left:auto; width:150px; padding:5px 9px;
    background:transparent; color:var(--ink);
    border:1px solid var(--rule); border-radius:0;
    font:inherit; font-size:12px;
  }
  #find:focus{outline:none; border-color:var(--accent)}
  #find::placeholder{color:var(--dim)}
  #find[hidden]{display:none}
  #none{color:var(--dim); font-size:13px}

  /* A game added since the reader was last here is worth pointing at, and the
     page knows because the browser remembers what it had already shown. */
  .new{
    display:inline-block; margin-left:8px; vertical-align:middle;
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--void); background:var(--accent); padding:2px 6px;
  }

  /* One column on a phone, two from a tablet up, three on a wide screen. */
  #grid{
    display:grid; gap:16px;
    grid-template-columns:1fr;
  }
  @media (min-width:620px){ #grid{grid-template-columns:repeat(2,1fr)} }
  @media (min-width:1000px){ #grid{grid-template-columns:repeat(3,1fr)} }

  a.tile{
    display:flex; flex-direction:column; text-decoration:none; color:inherit;
    border:1px solid var(--rule); background:var(--panel);
    transition:border-color .14s linear, transform .14s ease-out;
  }
  /* display:flex above beats the hidden attribute's own display:none, so a
     filtered-out tile has to be told again. */
  a.tile[hidden]{display:none}
  a.tile:hover, a.tile:focus-visible{border-color:var(--accent); transform:translateY(-2px)}
  a.tile:focus-visible{outline:1px solid var(--accent); outline-offset:2px}

  /* The shot keeps its shape whatever the column width is, so a row of tiles
     lines up even though the games are different shapes underneath. */
  .shot{
    display:block; width:100%; height:auto; aspect-ratio:16/10; object-fit:cover;
    background:var(--void); border-bottom:1px solid var(--rule);
  }
  .body{padding:14px 16px 16px}
  .tile b{display:block; font-size:19px; font-weight:600; letter-spacing:-.02em}
  a.tile:hover b, a.tile:focus-visible b{color:var(--accent)}
  .tile p{margin:6px 0 0; color:var(--dim); font-size:13px; line-height:1.5}
  .away{
    display:inline-block; margin-top:10px; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--dim);
  }

  footer{margin-top:30px; color:var(--dim); font-size:11px; line-height:1.7}
  footer code{color:var(--ink)}
</style>
<!-- build-watch:start -->
<meta name="build" content="bcb17103b419">
<script>
(function () {
  var meta = document.querySelector('meta[name="build"]');
  var mine = meta && meta.getAttribute('content');
  if (!mine || !window.fetch) return;
  var every = 300000;          // re-ask every five minutes while the tab is open
  var checking = false;

  function reload(to) {
    // A plain reload can be answered from cache, so the new build is asked for
    // by a URL the cache has not seen. Whatever the player already had on the
    // address bar is kept; only a previous build stamp is replaced.
    var q = new URLSearchParams(location.search);
    q.set('b', to);
    location.replace(location.pathname + '?' + q.toString() + location.hash);
  }

  function check() {
    if (checking || document.hidden) return;
    checking = true;
    fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        checking = false;
        if (!j || !j.build || j.build === mine) return;
        // One reload per build. If the page comes back still stamped with the
        // old id the files were not really replaced, and reloading again would
        // only spin.
        try {
          if (sessionStorage.getItem('build-watch') === j.build) return;
          sessionStorage.setItem('build-watch', j.build);
        } catch (e) { /* private mode: fall through and reload once */ }
        reload(j.build);
      })
      .catch(function () { checking = false; });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, every);
  setTimeout(check, 15000);
})();
</script>
<!-- build-watch:end -->
</head>
<body>
<main>
  <div id="head">
    <h1>Games</h1>
    <input id="find" type="search" placeholder="filter" aria-label="Filter the games" autocomplete="off" spellcheck="false">
  </div>
  <div id="grid"></div>
  <p id="none" hidden>Nothing matches that.</p>
  <footer>
    No game here sends anything anywhere, and none of them load an image while you play -
    every one of them draws itself. The pictures on this page are screenshots of them running.
    Saves live in the browser that made them.
  </footer>
</main>

<script>
// Everything the page shows. Add a game by adding a line, and drop a 16:10
// screenshot of it in preview/ under the same name.
const GAMES = [
  {
    dir:  'swarm-breaker',
    name: 'Swarm Breaker',
    shot: 'preview/swarm-breaker.webp',
    line: 'One decision a turn: the angle. A growing swarm of bodies does the rest ' +
          'while blocks descend toward the line you are defending.',
  },
  {
    dir:  'accretion',
    name: 'Accretion',
    shot: 'preview/accretion.webp',
    line: 'A blank field. A click puts something in it. Nothing after that is ' +
          'scripted - what forms, forms because gravity says so.',
  },
  {
    dir:  'barrow',
    name: 'Barrow',
    shot: 'preview/barrow.webp',
    line: 'The dead dig. You keep the books. An idle game: raise a horde that ' +
          'digs down forever, play the market for what it brings up, and seal ' +
          'the barrow when the ground finally beats you.',
  },
  {
    dir:  'foxfire',
    name: 'Foxfire',
    shot: 'preview/foxfire.webp',
    line: 'One spore on a dead log. Then the forest. An idle game: you are a ' +
          'honey fungus, your tips forage on their own, the trees are the ' +
          'market, and when the floor is threaded end to end you go beyond it.',
  },
  {
    dir:  'fall-line',
    name: 'Fall Line',
    shot: 'preview/fall-line.webp',
    line: 'A tower defense where the enemy is a river and the land is your weapon. ' +
          'Raise and cut the ground, the Melt takes the fastest way down, and after ' +
          'every surge it grows a counter to whatever killed it.',
  },
  {
    dir:  'aerie',
    name: 'Aerie',
    shot: 'preview/aerie.webp',
    line: 'A carrier over cold water. Your drones work the land: they stream out to ' +
          'the island in their thousands and bring back what sells, the ground fades ' +
          'where they work, and a market you flood falls until you spread the fleet.',
  },
  {
    // Hosted at its own address since 2025 and left there: a save lives with
    // the address it was made at, so moving the game would throw away every
    // one of them.
    href: 'https://xxgeminixx.github.io/TheIronSpine/',
    name: 'Iron Spine',
    shot: 'preview/iron-spine.webp',
    line: 'Command a modular weapon train. Collect cars, merge matching pairs ' +
          'into heavier ones, and hold out for twenty waves.',
  },
];

const grid = document.getElementById('grid');
const find = document.getElementById('find');
const none = document.getElementById('none');

// A game is "new" to whoever is reading until they have seen it once. The list
// of what they have seen lives in their own browser, so the marker fades by
// itself and means the same thing however long they were away.
let seen = [];
try { seen = JSON.parse(localStorage.getItem('seen') || '[]'); } catch (e) { seen = []; }
const first = seen.length === 0;              // never been here: nothing is new, it is all new
const isNew = (g) => !first && seen.indexOf(g.dir || g.href) < 0;

const tiles = GAMES.map((g) => {
  const a = document.createElement('a');
  a.className = 'tile';
  a.href = g.href || (g.dir + '/');
  if (g.href) a.rel = 'noopener';

  const img = document.createElement('img');
  img.className = 'shot';
  img.src = g.shot;
  img.width = 800; img.height = 500;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.alt = g.name + ' running';

  const body = document.createElement('div');
  body.className = 'body';
  const b = document.createElement('b');
  b.textContent = g.name;
  if (isNew(g)) {
    const tag = document.createElement('span');
    tag.className = 'new';
    tag.textContent = 'new';
    b.appendChild(tag);
  }
  const p = document.createElement('p');
  p.textContent = g.line;
  body.append(b, p);
  if (g.href) {
    const away = document.createElement('span');
    away.className = 'away';
    away.textContent = 'its own address';
    body.appendChild(away);
  }

  a.append(img, body);
  grid.appendChild(a);
  return { el: a, hay: (g.name + ' ' + g.line).toLowerCase() };
});

// Remember what was on the page, so the next visit can mark what was added.
try { localStorage.setItem('seen', JSON.stringify(GAMES.map((g) => g.dir || g.href))); } catch (e) { /* no store, no markers */ }

// The filter appears only once there are enough games that reading them all
// is a chore. Below that it would be furniture.
if (GAMES.length < 8) find.hidden = true;
find.addEventListener('input', () => {
  const q = find.value.trim().toLowerCase();
  let shown = 0;
  for (const t of tiles) {
    const hit = !q || t.hay.indexOf(q) >= 0;
    t.el.hidden = !hit;
    if (hit) shown++;
  }
  none.hidden = shown > 0;
});
</script>
</body>
</html>
