<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fall Line</title>
<style>
  /* Colours arrive from config.js as custom properties; the values here are
     only what the page shows before that file has run. */
  :root{
    --void:#dcd5c2; --paper:#ece6d6; --panel:#f5f0e4; --rule:#c9c0ad; --ink:#2a2620; --dim:#6e6656;
    --quiet:#a69d8a; --ore:#8c5a1c; --hot:#b23a2a; --good:#3d7a4c; --melt:#2c6ca6;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--paper);color:var(--ink)}
  body{
    font:13px/1.4 var(--sans); font-variant-numeric:tabular-nums lining-nums;
    display:flex; flex-direction:column; overflow:hidden;
  }
  h2{
    font:600 11px/1 var(--serif); letter-spacing:.08em; text-transform:uppercase; color:var(--ore);
    margin:0 0 7px;
  }
  button{
    font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--ink);
    padding:3px 10px; cursor:pointer; border-radius:3px; line-height:1.3;
  }
  button:hover:not(:disabled){background:var(--paper)}
  button:disabled{opacity:.4;cursor:default}
  button.on{background:var(--ink);color:var(--panel)}
  button b{font-weight:600}
  button i{font-style:normal;color:var(--dim);margin-left:6px;font-size:11px}
  button.on i{color:var(--rule)}
  button.locked{border-style:dashed;border-color:var(--quiet);color:var(--dim)}
  button.locked i{color:var(--dim)}
  button.poor b{color:var(--dim)}

  /* The title rule across the top. */
  header{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    padding:8px 18px 7px; border-bottom:1px solid var(--rule); flex:0 0 auto; background:var(--paper);
  }
  #brand{display:flex;align-items:baseline;gap:14px}
  #brand b{font:600 20px/1 var(--serif); letter-spacing:.02em; white-space:nowrap}
  #brand span{font:italic 12px/1 var(--serif); color:var(--dim); white-space:nowrap}
  #tools{display:flex;gap:6px}
  #tools button{font-size:11px;padding:2px 9px}

  /* The field takes everything between the title and the tray. The cards sit
     in the corners the diamond leaves empty. */
  #field{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:var(--void)}
  #view{display:block;width:100%;height:100%;cursor:crosshair}
  #hint{
    position:absolute; left:270px; right:270px; top:8px;
    font:italic 13px/1.35 var(--serif); color:var(--ink); text-align:center;
    pointer-events:none;
  }
  .card{
    position:absolute; width:250px; max-height:46%; overflow:auto;
    background:rgba(245,240,228,.93); border:1px solid var(--rule); border-radius:4px;
    padding:9px 12px 10px; font-size:12px;
  }
  .card.tl{left:10px;top:10px}
  .card.tr{right:10px;top:10px}
  .card.bl{left:10px;bottom:10px;max-height:none;width:auto;min-width:250px}
  .card.br{right:10px;bottom:10px}
  .card p{margin:0}

  /* Instruments. */
  #stats{display:flex;gap:16px;margin-bottom:8px}
  #stats .stat b{display:block;font:600 19px/1.1 var(--serif);color:var(--ink)}
  #stats .stat span{font:10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  #stats #ore{color:var(--ore)}
  #stats #hearth.low{color:var(--hot)}
  #stats #hearth.hit{color:var(--hot);transform:translateX(-1px)}
  #build button.lit{border-color:var(--ore);box-shadow:inset 0 0 0 1px var(--ore)}
  #build button.lit b{color:var(--ore)}
  #log .new{color:var(--ink)}
  #log .new::before{content:'';display:inline-block;width:4px;height:4px;margin:0 5px 2px 0;background:var(--ore)}
  @media (prefers-reduced-motion: reduce){
    #stats #hearth.hit{transform:none}
  }
  #clock{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #speed{display:flex;gap:3px}
  #speed button{padding:2px 7px;font-size:11px}
  #call{border-color:var(--melt);color:var(--melt);font-weight:600;min-width:170px;text-align:center}
  #call:disabled{opacity:.55}

  /* Ground and the selected work. */
  .row2{display:flex;gap:6px}
  .row2 button{flex:1 1 0}
  #earthcost{color:var(--dim);margin:6px 0 10px;min-height:14px;font-size:11px}
  #selinfo{color:var(--dim);line-height:1.45;margin-bottom:7px;white-space:pre-line}

  /* What is coming, and the log. */
  #forecast{line-height:1.45;white-space:pre-line}
  #forecast .ink{color:var(--ink)}
  #forecast .trait{color:var(--melt)}
  #forecast .new{color:var(--ore);font-weight:600}
  #forecast .dim{color:var(--dim)}
  #log{font-size:11px;color:var(--dim);line-height:1.5;white-space:pre-line}
  #log .ink{color:var(--ink)}

  /* The tray of works along the bottom. */
  #tray{
    flex:0 0 auto; display:flex; align-items:center; gap:12px;
    padding:8px 18px 9px; border-top:1px solid var(--rule); background:var(--paper);
  }
  #tray h2{margin:0;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px}
  #build{display:flex;gap:8px;flex-wrap:wrap}
  #build button{
    display:flex; flex-direction:column; align-items:center; gap:2px; width:88px; padding:5px 4px 4px;
    text-align:center;
  }
  #build button svg{width:22px;height:22px;display:block}
  #build button b{font:600 12px/1.1 var(--serif)}
  #build button i{margin:0;font-size:10px}
  #build button.on svg *{stroke:var(--panel)}
  #build button svg *{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
  #build button.locked svg *{stroke:var(--quiet)}

  /* Awards live in the help card. */
  #awards{display:flex;flex-direction:column;gap:2px;font-size:12px;margin-top:6px}
  #awards .award{color:var(--dim)}
  #awards .award.won{color:var(--ink)}
  #awards .award i{font-style:normal;color:var(--dim);margin-left:6px;font-size:11px}
  #awards .award.won i{color:var(--dim)}

  .box{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(42,38,32,.45); z-index:5;
  }
  .box[hidden]{display:none!important}
  .box .bcard{
    width:min(600px,92%); max-height:88%; background:var(--panel);
    border:1px solid var(--ink); border-radius:4px; padding:20px 26px 18px;
    display:flex; flex-direction:column;
  }
  .bcard .scroll{overflow:auto;min-height:0;flex:1 1 auto}
  .bcard h3{margin:0 0 10px;font:600 20px/1 var(--serif);flex:0 0 auto}
  .bcard p{margin:0 0 7px;color:var(--dim);line-height:1.5;font-size:13px}
  .bcard p.ink{color:var(--ink)}
  .bcard h2{margin-top:14px}
  .bcard .actions{margin-top:14px;display:flex;gap:8px;flex:0 0 auto}
  .bcard .actions button{padding:6px 16px;font-weight:600}
  #helpaside{display:none;margin-top:14px}
  #helpbox.full #helpaside{display:block}

/* A thumb, not a pointer: on touch devices every control gets a real target
   (WCAG 2.2 asks 24 px; 36 is what a thumb hits without aiming). Layout and
   look are unchanged on a mouse. */
@media (pointer: coarse) {
  button, select, input[type="button"], [role="button"] { min-height: 36px; min-width: 36px; }
  input[type="range"] { min-height: 28px; }
}
</style>
<!-- plays:start -->
<script>
(function () {
  // Counts one play, once, and then stays quiet. See games-plays/README.md for
  // what is stored on the other end, which is a total and nothing else.
  var END = 'https://games-plays.xxgeminixx.workers.dev', GAME = 'fall-line';
  if (!END || !window.fetch) return;

  // A build being served off this machine is a build being worked on. Counting
  // it would mean the numbers are mostly whoever made the game.
  var h = location.hostname;
  if (!h || h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || location.protocol === 'file:') return;
  if (location.search.indexOf('nocount') >= 0) return;

  // Without storage there is no way to tell a first play from a fifth, and a
  // counter that cannot tell would count every reload. Undercounting by the
  // browsers that block storage is a wrong number; counting every reload is a
  // meaningless one, so this browser is simply not counted.
  var KEY = '__plays', all;
  try {
    all = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (!all || typeof all !== 'object') all = {};
    localStorage.setItem(KEY, JSON.stringify(all));
  } catch (e) { return; }

  var me = all[GAME] || (all[GAME] = {});
  var day = new Date().toISOString().slice(0, 10);
  var carried = Number(me.owed) || 0;   // seconds played on earlier visits, never reported
  var played = 0;                       // seconds this page has been watched
  var touched = false;                  // somebody has actually done something
  var sending = false;

  var HOLD = 10;        // seconds of real attention before a play is a play
  var RETRY = 60;       // and how long to wait before asking again if that failed
  var TOPUP = 120;      // seconds worth carrying home at the end of a visit
  var HOUR = 3600000;

  // Every game on this site shares one key, and a game can be open in two tabs
  // at once - an idle game is meant to be left open. A page that writes the
  // whole object back writes what it read when it loaded, which erases what
  // another tab recorded in the meantime. Erasing a game's record makes its
  // next play look like a new player, so the headline number is the one that
  // inflates. Take the freshest record for this game, and never move it back.
  function sync() {
    var now;
    try { now = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { now = null; }
    if (!now || typeof now !== 'object') now = {};
    var kept = now[GAME] || {};
    if (kept.day && (!me.day || kept.day > me.day)) me.day = kept.day;
    if (kept.back) me.back = 1;
    if (kept.top && (!me.top || kept.top > me.top)) me.top = kept.top;
    now[GAME] = me;
    all = now;
    return now;
  }

  function save() {
    try { var now = sync(); me.owed = carried + played; localStorage.setItem(KEY, JSON.stringify(now)); } catch (e) {}
  }

  function post(body, beacon) {
    var text = JSON.stringify(body);
    // text/plain is a content type the browser is allowed to send without
    // asking the server for permission first, so one request does the job.
    if (beacon && navigator.sendBeacon) {
      try { return navigator.sendBeacon(END + '/api/play', new Blob([text], { type: 'text/plain' })); } catch (e) { return false; }
    }
    return fetch(END + '/api/play', {
      method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: text, keepalive: true
    });
  }

  // The play itself: sent once per day, carrying whatever time was never
  // reported before it.
  function report() {
    sync();                                // another tab may have already done it
    if (sending || me.day === day) return;
    sending = true;
    var owed = carried + played;
    var body = {
      game: GAME,
      session: true,
      first: !me.day,                                 // this browser has never played it
      returning: Boolean(me.day && !me.back),         // played before, and this is the first day back
      seconds: owed
    };
    post(body).then(function (r) {
      sending = false;
      if (!r || !r.ok) return;                        // try again on the next visit
      if (body.returning) me.back = 1;
      me.day = day;
      carried -= owed;                                // exactly what was reported, no more
      save();
    }).catch(function () { sending = false; });
  }

  // Time played after the day's report, handed over when the page goes away.
  // The clock is cleared before the request rather than after, because this
  // one cannot be confirmed: losing a few minutes is a smaller lie than
  // counting them twice.
  function topup() {
    sync();
    var owed = carried + played;
    if (owed < TOPUP || me.day !== day) return;
    if (me.top && Date.now() - me.top < HOUR) return;
    me.top = Date.now();
    carried -= owed;
    save();
    post({ game: GAME, session: false, first: false, returning: false, seconds: owed }, true);
  }

  var mark = 0;
  setInterval(function () {
    if (document.hidden) return;
    played++;
    // A report that failed is worth trying again, but not every second: a
    // counter must never turn one unreachable server into a request per
    // second per open tab.
    if (touched && played >= HOLD && (played - HOLD) % RETRY === 0) report();
    if (++mark >= 15) { mark = 0; save(); }
  }, 1000);

  var note = function () { touched = true; };
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (t) {
    addEventListener(t, note, { once: true, passive: true, capture: true });
  });
  addEventListener('pagehide', topup);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { save(); topup(); } });
})();
</script>
<!-- plays:end -->
<!-- build-watch:start -->
<meta name="build" content="c5a5df9e91f4">
<script>
(function () {
  var meta = document.querySelector('meta[name="build"]');
  var mine = meta && meta.getAttribute('content');
  if (!mine || !window.fetch) return;
  var every = 300000;          // re-ask every five minutes while the tab is open
  var checking = false;

  function reload(to) {
    // A plain reload can be answered from cache, so the new build is asked for
    // by a URL the cache has not seen. Whatever the player already had on the
    // address bar is kept; only a previous build stamp is replaced.
    var q = new URLSearchParams(location.search);
    q.set('b', to);
    location.replace(location.pathname + '?' + q.toString() + location.hash);
  }

  function check() {
    if (checking || document.hidden) return;
    checking = true;
    fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        checking = false;
        if (!j || !j.build || j.build === mine) return;
        // One reload per build. If the page comes back still stamped with the
        // old id the files were not really replaced, and reloading again would
        // only spin.
        try {
          if (sessionStorage.getItem('build-watch') === j.build) return;
          sessionStorage.setItem('build-watch', j.build);
        } catch (e) { /* private mode: fall through and reload once */ }
        reload(j.build);
      })
      .catch(function () { checking = false; });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, every);
  setTimeout(check, 15000);
})();
</script>
<!-- build-watch:end -->
</head>
<body>
<header>
  <div id="brand"><b id="title">Fall Line</b><span id="tagline"></span></div>
  <div id="tools">
    <button id="help">Help</button>
    <button id="newrun">New run</button>
    <button id="export">Copy save</button>
    <button id="import">Paste save</button>
  </div>
</header>

<div id="field">
  <canvas id="view"></canvas>
  <div id="hint"></div>

  <aside id="logcard" class="card tl">
    <h2 id="p-log">Log</h2>
    <div id="log"></div>
  </aside>

  <aside id="meltcard" class="card tr">
    <h2 id="p-melt">Next wave</h2>
    <div id="forecast"></div>
  </aside>

  <aside id="inst" class="card bl">
    <div id="stats">
      <div class="stat"><b id="ore">0</b><span id="lbl-ore">Ore</span></div>
      <div class="stat"><b id="hearth">0</b><span id="lbl-hearth">Fire</span></div>
      <div class="stat"><b id="surge">0</b><span id="lbl-surge">Wave</span></div>
      <div class="stat"><b id="best">0</b><span id="lbl-best">Best wave</span></div>
    </div>
    <div id="clock">
      <div id="speed"></div>
      <button id="pause">Pause</button>
      <button id="call">Call the wave</button>
    </div>
  </aside>

  <aside id="groundcard" class="card br">
    <h2 id="p-earth">The ground</h2>
    <div class="row2"><button id="raise">Raise</button><button id="cut">Lower</button></div>
    <div id="earthcost"></div>
    <h2 id="p-selected">This tower</h2>
    <div id="selinfo"></div>
    <div class="row2"><button id="upgrade">Upgrade</button><button id="sell">Sell</button></div>
  </aside>

  <div id="helpbox" class="box" hidden>
    <div class="bcard">
      <h3 id="helptitle">Fall Line</h3>
      <div class="scroll">
        <div id="helplines"></div>
        <div id="helpaside">
          <h2 id="p-awards">Awards</h2>
          <div id="awards"></div>
        </div>
      </div>
      <div class="actions"><button id="helpclose">Close</button><button id="helpmore">The rest of the rules</button></div>
    </div>
  </div>
  <div id="overbox" class="box" hidden>
    <div class="bcard">
      <h3 id="overtitle">The fire is out</h3>
      <div class="scroll"><div id="overtext"></div></div>
      <div class="actions"><button id="overnew">New run</button></div>
    </div>
  </div>
</div>

<div id="tray">
  <h2 id="p-build">Build</h2>
  <div id="build"></div>
</div>

<script type="module">
  import { CONFIG, applyIdentity, appliedOverrides } from './config.js?v=11';
  import { createGame } from './src/game.js?v=11';

  applyIdentity(document);
  if (appliedOverrides.length) console.log('config overrides:', appliedOverrides.join(' '));

  const game = createGame({
    doc: document,
    win: window,
    canvas: document.getElementById('view'),
    cfg: CONFIG,
    storage: window.localStorage,
    now: () => performance.now(),
  });
  game.start();
  window.fallLine = game;
</script>
</body>
</html>
