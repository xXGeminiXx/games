<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swarm Breaker</title>
<style>
  :root{
    --bg:#08090c; --panel:#0e1016; --line:#1c2029;
    --ink:#e6e9ef; --dim:#7a828f; --hot:#ff5c46;
    --swarm:#5ad1ff; --block:#2a3040; --pickup:#ffc94a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; flex-direction:column; align-items:center;
    -webkit-user-select:none; user-select:none;
  }
  header{
    width:100%; max-width:520px; display:flex; gap:0;
    border-bottom:1px solid var(--line); padding:10px 12px;
    justify-content:space-between; align-items:baseline;
  }
  .stat{display:flex; flex-direction:column; gap:2px}
  .stat b{
    font-size:19px; font-weight:600; font-variant-numeric:tabular-nums;
    letter-spacing:-0.02em;
  }
  .stat span{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.09em}
  .swarmv{color:var(--swarm)}
  .hotv{color:var(--hot)}
  .goldv{color:var(--pickup)}
  canvas{display:block; touch-action:none}
  footer{
    width:100%; max-width:520px; padding:8px 12px 14px;
    color:var(--dim); font-size:11px; display:flex; justify-content:space-between;
    border-top:1px solid var(--line);
  }
  button{
    font:inherit; background:var(--panel); color:var(--ink);
    border:1px solid var(--line); padding:4px 10px; cursor:pointer;
  }
  button:hover{border-color:var(--swarm)}
  button:disabled{opacity:.35; cursor:default; border-color:var(--line)}
  select{
    font:inherit; font-size:11px; background:var(--panel); color:var(--dim);
    border:1px solid var(--line); padding:3px 6px; max-width:230px; cursor:pointer;
  }
  select:hover{color:var(--ink); border-color:var(--swarm)}
  footer{gap:8px}
  #shop{
    width:100%; max-width:520px; display:none; gap:6px; padding:8px 12px;
    border-top:1px solid var(--line); flex-wrap:wrap;
  }
  #shop.on{display:flex}
  .buy{flex:1 1 150px; text-align:left; line-height:1.3}
  .buy small{display:block; color:var(--dim); font-size:10px}
  #over{
    position:fixed; inset:0; background:rgba(8,9,12,.93); display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  #over.on{display:flex}
  #over h1{font-size:22px; margin:0; font-weight:600; letter-spacing:-0.02em}
  .row{display:flex; gap:8px}

  /* the mode screen */
  #menu{
    position:fixed; inset:0; background:rgba(8,9,12,.96); display:none;
    align-items:center; justify-content:center; padding:20px; overflow:auto;
  }
  #menu.on{display:flex}
  .card{
    width:100%; max-width:460px; display:flex; flex-direction:column; gap:16px;
  }
  .card h1{
    font-size:26px; margin:0; font-weight:600; letter-spacing:-0.03em;
  }
  .card .tag{margin:0; color:var(--dim); font-size:12px}
  .setting{display:flex; align-items:center; gap:10px}
  .setting span{
    font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.09em;
  }
  .setting select{max-width:none; flex:1}
  #modelist{display:flex; flex-direction:column; gap:8px}
  .mode{
    display:block; width:100%; text-align:left; padding:11px 13px;
    border:1px solid var(--line); background:var(--panel); cursor:pointer;
    line-height:1.45;
  }
  .mode:hover{border-color:var(--swarm)}
  .mode .head{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .mode .nm{font-size:16px; font-weight:600; letter-spacing:-0.02em}
  .mode .tell{color:var(--dim); font-size:11px}
  .mode .best{
    color:var(--pickup); font-size:11px; font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .mode .blurb{color:var(--dim); font-size:11px; margin-top:5px}
  .mode.playing{border-color:var(--swarm)}
  .mode.playing .nm{color:var(--swarm)}
  #menufoot{
    display:flex; flex-direction:column; gap:10px; align-items:flex-start;
  }
  #menuhint{color:var(--dim); font-size:10.5px}
  #resume{display:none}
  #resume.on{display:block}
</style>
</head>
<body>

<header>
  <div class="stat"><b id="lvl">1</b><span id="lbl-depth">depth</span></div>
  <div class="stat"><b class="swarmv" id="balls">1</b><span id="lbl-swarm">swarm</span></div>
  <div class="stat"><b class="goldv" id="gold">0</b><span id="lbl-essence">essence</span></div>
  <div class="stat"><b id="rule" style="font-size:15px">drift</b><span id="lbl-pattern">pattern</span></div>
</header>

<canvas id="c" width="520" height="620"></canvas>

<div id="shop"></div>

<footer>
  <span id="hint">drag to aim &middot; release to fire</span>
  <span class="row">
    <button id="modes">modes</button>
    <button id="reset">reset</button>
  </span>
</footer>

<div id="over">
  <h1 id="overtitle">the swarm is overrun</h1>
  <div style="color:var(--dim)"><span id="over-lbl-depth">depth</span> <b id="overdepth">0</b> &middot; <span id="over-lbl-swarm">swarm</span> <b id="overballs">0</b></div>
  <span class="row">
    <button id="again">again</button>
    <button id="overmodes">modes</button>
  </span>
</div>

<div id="menu">
  <div class="card">
    <div>
      <h1 id="menutitle">Swarm Breaker</h1>
      <p class="tag" id="menutag">aim once. the swarm does the work.</p>
    </div>

    <label class="setting">
      <span id="lbl-difficulty">difficulty</span>
      <select id="tier" title="difficulty"></select>
    </label>

    <div id="modelist"></div>

    <div id="menufoot">
      <button id="resume">resume run</button>
      <span id="menuhint"></span>
    </div>
  </div>
</div>

<script type="module">
// ---------------------------------------------------------------------------
// Swarm Breaker - prototype
//
// One decision per turn: pick an angle. Everything after that runs itself.
// The swarm does the work; you only choose where to point it.
//
// Every visual is drawn from primitives. There are no image files and there is
// no audio - all state is legible on screen.
// ---------------------------------------------------------------------------

import { CONFIG, CELL0, TOP, FLOOR, MIN_AIM_Y, latticeAt, leftEdgeAt,
         storageKey, offerCost, applyIdentity } from './config.js';
import { createJuice } from './src/juice.js';
import { createField, modeOf, MODE_IDS, normaliseMode, DEFAULT_MODE } from './src/modes.js';
import { createSave, fieldFingerprint } from './src/save.js';
import { createLeaderboard } from './src/leaderboard.js';
import * as Tiers from './src/tiers.js';
import { createOnboarding } from './src/onboarding.js';
import { createVisual } from './src/visual.js';

// Names, labels, colours and canvas size all arrive from config.js, so the
// markup above never has to be edited to rename or resize anything.
applyIdentity(document);

const C = document.getElementById('c');
const X = C.getContext('2d');
const W = C.width, H = C.height;

// ---------------------------------------------------------------------------
// THE VIEW
//
// The field widens as a run goes on. Rather than move the blocks, the view
// pulls back: a block carries a WORLD column that never changes, and what moves
// is the size of a cell and where world column zero sits on screen.
//
// Both are eased, and easing them TOGETHER is what makes a widening invisible.
// At the moment the lattice changes, the eased pair is still exactly what it
// was, so nothing on screen shifts by a pixel; it then contracts smoothly
// toward the new width over the next second. Snapping either one alone would
// jump the whole field sideways.
// ---------------------------------------------------------------------------
let COLS = CONFIG.board.cols;          // columns filling the screen, target
let CELL = CELL0;                      // eased cell size, pixels
let ORIGIN = 0;                        // eased position of world column zero
let cellT = CELL0, originT = 0;        // where the ease is heading

function retarget(cols){
  COLS = cols;
  cellT = W / cols;
  originT = -leftEdgeAt(cols) * cellT;
}

function easeView(dt){
  // Never while the swarm is in flight. A widening lands at the end of a turn,
  // and moving the field under bodies that are already travelling would change
  // the geometry a shot was aimed at after it was taken.
  if (S && S.firing) return;
  // Exponential settle, framerate independent. Snaps the last fraction of a
  // pixel so the field cannot creep forever.
  const k = 1 - Math.exp(-dt / Math.max(0.05, CONFIG.board.viewEase / 3));
  CELL += (cellT - CELL) * k;
  ORIGIN += (originT - ORIGIN) * k;
  if (Math.abs(cellT - CELL) < 0.01) CELL = cellT;
  if (Math.abs(originT - ORIGIN) < 0.01) ORIGIN = originT;
}
const R = CONFIG.swarm.radius;
const SPEED = CONFIG.swarm.speed;
const SUBSTEPS = CONFIG.swarm.substeps;

// All impact feedback lives here: trails, shatter, damage numbers, shake.
const juice = createJuice({
  width: W, height: H, floorY: FLOOR,
  trailColor: CONFIG.palette.swarm,
  shake: CONFIG.feel.shake,
  particles: CONFIG.feel.particles,
  reducedMotion: CONFIG.feel.reducedMotion === null ? undefined : CONFIG.feel.reducedMotion,
});

// Everything the field looks like. Blocks that touch fuse into architecture,
// health is carried by fracture rather than by hue, and the swarm lights the
// world it sits under.
const look = createVisual({
  width: W, height: H, top: TOP, floorY: FLOOR, cols: COLS, origin: 0,
  reducedMotion: CONFIG.feel.reducedMotion === null ? undefined : CONFIG.feel.reducedMotion,
});

// The first minute is taught by what the field does, not by any text. This
// draws nothing once a player has played.
const teach = createOnboarding({
  width: W, height: H, floorY: FLOOR, topY: TOP, cols: COLS, cell: CELL0, ballRadius: R,
  canAfford: () => OFFERS.some(o => S.gold >= o.cost(S.depth)),
});

let TIER = (() => {
  try { const v = localStorage.getItem(storageKey('tier')); if (v && Tiers.tierOf(v)) return v; } catch (e) {}
  return CONFIG.difficulty.defaultTier;
})();

// Which field a run descends through. A mode changes what descends and nothing
// else - see src/modes.js. The words belong to config.js.
let MODE = (() => {
  try { const v = localStorage.getItem(storageKey('mode')); if (v) return normaliseMode(v); } catch (e) {}
  return DEFAULT_MODE;
})();

let S;
function fresh(){
  S = {
    depth: 1, balls: Tiers.tierOf(TIER).supply.start, gold: 0, tier: TIER,
    rows: [],            // {c, r, hp, max} in grid coords
    drops: [],           // {c, r, kind}
    owed: { ball: 0, gold: 0 },   // markers the field still has to find room for
    live: [], firing: false, queue: 0, fireT: 0,
    origin: W / 2, nextOrigin: null,
    aiming: false, aim: {x: W / 2, y: FLOOR - 120},
    dead: false,
    power: CONFIG.swarm.startingPower,
    gain: CONFIG.swarm.startingGain,   // gain = essence per block destroyed
    seed: 0,
    field: null,
  };
  S.mode = MODE;
  S.seed = (Math.floor(performance.now()) ^ 0x5bf03635) >>> 0;
  S.field = createField(S.mode, S.seed, { cols: CONFIG.board.cols, formation: FORM_OPTS });
  // The formation source is the fractal mode's own; nothing else has one.
  S.form = S.field.key === 'fractal' ? S.field.source : null;
  S.dealt = 0;
  // A field that does not widen sits at the starting width for the whole run.
  retarget(S.field.widens ? latticeAt(0) : CONFIG.board.cols);
  CELL = cellT; ORIGIN = originT;
  juice.clear();
  // seed a couple of rows so the field is never empty on turn one
  addRow(); step(); addRow();
  paintShop();
}

// --- field ------------------------------------------------------------------

function addRow(){
  const d = S.depth;
  if (!Tiers.spawnsRowAt(S.tier, d)) return;

  // The width is known before the row is, which is how the view learns it has
  // to pull back. A field that never widens answers the same number forever,
  // and a field that deals whole figures never changes width part way through
  // one.
  const width = S.field.width();
  if (width !== COLS) retarget(width);
  const lo = leftEdgeAt(width);

  const cells = S.field.nextRow(d);
  S.dealt++;

  // Where a row's health number goes. A field that deals a whole figure puts a
  // varying number of blocks in a row, so the number describes the ROW and is
  // shared among them - see economy.rowBlocks. A field that draws one row at a
  // time gives it to each block, because that is what it was tuned against.
  const n = cells.reduce((k, on) => k + (on ? 1 : 0), 0);
  const share = (S.field.sharesHealth && n > 0)
    ? Math.min(CONFIG.economy.rowShareMax,
        Math.max(CONFIG.economy.rowShareMin, CONFIG.economy.rowBlocks / n))
    : 1;
  const hp = Math.max(1, Math.round(Tiers.healthNumber(S.tier, d) * share));
  cells.forEach((on, j) => { if (on) S.rows.push({ c: lo + j, r: 0, hp, max: hp }); });

  // The resupply line is the difficulty. Starve it and the angle has to choose
  // between damage and collection; keep it full and it never has to.
  if (Tiers.spawnsPickupAt(S.tier, d)) S.owed.ball++;
  if (Tiers.spawnsWindfallAt(S.tier, d)) S.owed.gold++;
  placeDrops(cells, lo, d);
}

// A marker goes in a HOLE in the row, never on top of a block. Both are drawn
// in the same cell, and a ring laid over a health number leaves neither one
// readable. A row can be solid all the way across - a gate row is - so a marker
// that finds no room is owed, and lands in the first row that has some.
function placeDrops(cells, lo, d){
  const open = [];
  cells.forEach((on, j) => { if (!on) open.push(lo + j); });
  if (!open.length) return;
  const take = (kind, k) => {
    const i = ((d * k) % open.length + open.length) % open.length;
    S.drops.push({ c: open.splice(i, 1)[0], r: 0, kind });
  };
  while (S.owed.ball > 0 && open.length){ S.owed.ball--; take('ball', 5); }
  while (S.owed.gold > 0 && open.length){ S.owed.gold--; take('gold', 2); }
}

function step(){
  if (!Tiers.fieldDescends(S.tier, S.depth)) return;
  look.descend(S.rows);
  S.rows.forEach(b => b.r++);
  S.drops.forEach(p => p.r++);
  // A marker that reaches the line is gone. Without this they descend past the
  // canvas forever and the list grows for the whole run.
  S.drops = S.drops.filter(p => cyOf(p.r) < FLOOR + CELL);
}

// A figure spans the visible field, so it is as tall as the field can show.
const FORM_OPTS = {
  ladder: CONFIG.board.ladder,
  // A figure is as tall as the field can show at its own width, so it grows in
  // both directions at once and always arrives as a whole shape.
  heightFor: (cols) => Math.max(3, Math.round((FLOOR - TOP) / (W / cols))),
  gap: 1,
};

// What the readout calls the thing currently drawing the field. Each mode
// names its own.
function figureName(){
  return S.field ? S.field.label(S.depth) : 'drift';
}

const xOf = c => ORIGIN + c * CELL;              // left edge of a world column
const cx = c => xOf(c) + CELL / 2;               // its centre
const cyOf = r => TOP + r * CELL + CELL / 2;

// --- turn cycle -------------------------------------------------------------

function fire(){
  if (S.firing || S.dead) return;
  const dx = S.aim.x - S.origin, dy = S.aim.y - (FLOOR - R);
  const len = Math.hypot(dx, dy);
  if (len < 12 || -dy / len < MIN_AIM_Y) return;   // shots flatter than the configured angle are refused
  S.dir = { x: dx / len, y: dy / len };
  S.firing = true; S.queue = S.balls; S.fireT = 0; S.nextOrigin = null;
  store.mark();
  juice.launch(S.origin, FLOOR - R, S.dir.x, S.dir.y);
}

function endTurn(){
  S.firing = false;
  if (S.nextOrigin != null) S.origin = S.nextOrigin;
  step();
  S.depth++;
  addRow();
  // lose when a block crosses the swarm line
  if (S.rows.some(b => cyOf(b.r) + CELL / 2 >= FLOOR)) return die();
  store.mark();
  paintShop();
}

function die(){
  S.dead = true;
  recordBest();
  store.mark();
  board.finish({ tier: S.tier, depth: S.depth, swarm: S.balls, essence: S.gold, doctrine: 'none' });
  document.getElementById('overdepth').textContent = S.depth;
  document.getElementById('overballs').textContent = S.balls;
  document.getElementById('over').classList.add('on');
}

// --- simulation -------------------------------------------------------------

function sim(){
  if (S.firing){
    S.fireT++;
    const gap = Math.max(1, Math.round(CONFIG.swarm.launchGap - S.balls / CONFIG.swarm.launchCrowd));
    if (S.queue > 0 && S.fireT % gap === 0){
      S.live.push({ x: S.origin, y: FLOOR - R, vx: S.dir.x * SPEED, vy: S.dir.y * SPEED });
      S.queue--;
    }
  }

  for (let i = S.live.length - 1; i >= 0; i--){
    const b = S.live[i];
    juice.trail(b.x, b.y, b.vx, b.vy);
    // substep so fast balls cannot tunnel through a block
    for (let s = 0; s < SUBSTEPS; s++){
      b.x += b.vx / SUBSTEPS; b.y += b.vy / SUBSTEPS;
      if (b.x < R){ b.x = R; b.vx = Math.abs(b.vx); }
      if (b.x > W - R){ b.x = W - R; b.vx = -Math.abs(b.vx); }
      if (b.y < TOP + R){ b.y = TOP + R; b.vy = Math.abs(b.vy); }
      hitBlocks(b);
    }
    // pickups
    for (let j = S.drops.length - 1; j >= 0; j--){
      const p = S.drops[j];
      if (Math.hypot(b.x - cx(p.c), b.y - cyOf(p.r)) < CELL * 0.32){
        if (p.kind === 'ball'){
          S.balls += 1;
          juice.pickup(cx(p.c), cyOf(p.r), 'ball', 1);
        } else {
          const n = CONFIG.economy.windfallBase + S.depth;
          S.gold += n;
          juice.pickup(cx(p.c), cyOf(p.r), 'gold', n);
        }
        S.drops.splice(j, 1);
      }
    }
    if (b.y > FLOOR - R){
      if (S.nextOrigin == null) S.nextOrigin = Math.max(R, Math.min(W - R, b.x));
      look.splash(b.x, 1);
      S.live.splice(i, 1);
    }
  }

  if (S.firing && S.queue === 0 && S.live.length === 0) endTurn();
}

function hitBlocks(b){
  for (let i = S.rows.length - 1; i >= 0; i--){
    const bl = S.rows[i];
    // Insets are a share of the cell rather than a fixed three pixels, so a
    // block keeps its proportions as the view pulls back and the gutter does
    // not swallow the block at the far end of the ladder.
    const pad = CELL * 0.046;
    const bx = xOf(bl.c) + pad, by = TOP + bl.r * CELL + pad;
    const bw = CELL - pad * 2, bh = CELL - pad * 2;
    if (b.x + R < bx || b.x - R > bx + bw || b.y + R < by || b.y - R > by + bh) continue;

    const ox = Math.min(b.x + R - bx, bx + bw - (b.x - R));
    const oy = Math.min(b.y + R - by, by + bh - (b.y - R));

    // An axis the ball is already leaving must not be reflected. Without this
    // the substep after a resolution reads as a fresh contact, flips the ball
    // back and displaces it INTO the block it was escaping.
    const mx = bx + bw / 2, my = by + bh / 2;
    const awayX = (b.x <= mx && b.vx < 0) || (b.x >= mx && b.vx > 0);
    const awayY = (b.y <= my && b.vy < 0) || (b.y >= my && b.vy > 0);
    if (awayX && awayY) continue;

    // Choose the axis by TIME to clear, not by depth. Depth alone picks the
    // shallower overlap even when the ball is barely moving along it - which is
    // how a near-vertical ball in the six-pixel gutter between two columns had
    // its negligible horizontal speed flipped and carried straight on through
    // the block, for as long as the block had health to spend.
    const sx = Math.abs(b.vx), sy = Math.abs(b.vy);
    const tx = (!awayX && sx > 1e-6) ? ox / sx : Infinity;
    const ty = (!awayY && sy > 1e-6) ? oy / sy : Infinity;
    if (tx === Infinity && ty === Infinity) continue;

    if (tx <= ty){ b.vx = -b.vx; b.x += b.vx > 0 ? ox : -ox; }
    else         { b.vy = -b.vy; b.y += b.vy > 0 ? oy : -oy; }

    const nx = b.vx, ny = b.vy;
    const m = look.materialFor(bl.max).mat;
    const shade = `hsl(${m.h} ${m.s}% ${m.l + 14}%)`;   // the block's own material, lifted so debris reads against the field
    bl.hp -= S.power;
    juice.hit(b.x, b.y, S.power, nx, ny);
    if (bl.hp <= 0){
      juice.destroy(bx + bw / 2, by + bh / 2, shade, nx, ny);
      S.rows.splice(i, 1);
      S.gold += Math.max(1, Math.round(bl.max * CONFIG.economy.blockShare)) + S.gain;
    }
    return;
  }
}

// --- render -----------------------------------------------------------------

function draw(){
  look.setLattice(COLS, CELL, ORIGIN);
  look.update(1 / 60);
  look.setDepth(S.depth);
  look.setSwarm(S.balls);
  look.setRegime(S.field.signature(S.depth));

  juice.begin(X);

  look.background(X);
  look.horizon(X, S.rows);
  look.blocks(X, S.rows);
  look.pickups(X, S.drops);

  if (S.aiming && !S.firing && !S.dead){
    const dx = S.aim.x - S.origin, dy = S.aim.y - (FLOOR - R), len = Math.hypot(dx, dy);
    if (len > 12 && -dy / len >= MIN_AIM_Y) look.aim(X, S.origin, FLOOR - R, dx / len, dy / len, len);
  }

  look.bodies(X, S.live, R);
  look.launcher(X, S.origin, FLOOR - R);
  look.swarmBand(X);

  juice.swarm(S.balls);
  juice.draw(X);
  juice.end(X);

  look.foreground(X);
  if (CONFIG.feel.onboarding) teach.draw(X);
}

// --- shop -------------------------------------------------------------------
// Essence is the economy seed. Blocks and pickups pay it out; it buys the
// things that would otherwise be a grind. Buying past tedium is the loop.

function lowestRowSize(){
  let lo = -1; S.rows.forEach(b => lo = Math.max(lo, b.r));
  return S.rows.filter(b => b.r === lo).length;
}

// What each offer DOES. The list itself, its names, its prices and its order
// live in config.js; this only says what buying one changes.
const EFFECTS = {
  ball:  o => { S.balls += o.amount; },
  power: o => { S.power += o.amount; },
  gain:  o => { S.gain  += o.amount; },
  clear: () => {
    let lo = -1; S.rows.forEach(b => lo = Math.max(lo, b.r));
    S.rows = S.rows.filter(b => b.r !== lo);
  },
};

// Clearing a row is priced by how much of the field it removes, so a wide row
// costs more than a thin one. Everything else is priced straight off its entry.
const PRICING = {
  clear: (o, d) => Math.round(offerCost(o, d) * Math.max(1, lowestRowSize()) / 2),
};

const OFFERS = CONFIG.economy.offers
  .filter(o => EFFECTS[o.id])
  .map(o => ({
    id: o.id, name: o.name, desc: o.desc,
    cost: d => (PRICING[o.id] ? PRICING[o.id](o, d) : offerCost(o, d)),
    buy: () => EFFECTS[o.id](o),
  }));

function paintShop(){
  const el = document.getElementById('shop');
  el.classList.add('on');
  el.innerHTML = '';
  OFFERS.forEach(o => {
    const c = o.cost(S.depth);
    const b = document.createElement('button');
    b.className = 'buy';
    b.innerHTML = `${o.name} &middot; ${c}<small>${o.desc}</small>`;
    b.disabled = S.gold < c || S.firing;
    b.onclick = () => { if (S.gold >= c){ S.gold -= c; o.buy(); store.mark(); paintShop(); } };
    el.appendChild(b);
  });
}

// --- persistence ------------------------------------------------------------

const board = createLeaderboard({ defaultTier: CONFIG.difficulty.defaultTier });

const store = createSave({
  key: storageKey('run'),
  // Only a field that can be asked for a row by depth has a fingerprint. One
  // that deals a sequence is checked by replaying it instead.
  fingerprint: () => (S && S.field && typeof S.field.rowFor === 'function')
    ? fieldFingerprint(d => S.field.rowFor(d), [1, 7, 23, 61]) : null,
  capture: () => ({
    mode: S.mode,
    seed: S.seed, depth: S.depth, balls: S.balls, gold: S.gold, dealt: S.dealt,
    owed: { ball: S.owed.ball, gold: S.owed.gold },
    power: S.power, gain: S.gain, origin: S.origin, dead: S.dead,
    rows: S.rows.map(b => ({ c: b.c, r: b.r, hp: b.hp, max: b.max })),
    drops: S.drops.map(p => ({ c: p.c, r: p.r, kind: p.kind })),
    live: S.live.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy })),
    firing: S.firing, queue: S.queue, dir: S.dir || null,
  }),
  restore: (v) => {
    if (!v || typeof v !== 'object') return;
    // A saved run is played on the field it was started on, whatever the menu
    // happens to be pointing at now.
    MODE = normaliseMode(v.mode);
    S.mode = MODE;
    S.seed = v.seed >>> 0;
    S.field = createField(S.mode, S.seed, { cols: CONFIG.board.cols, formation: FORM_OPTS });
    S.form = S.field.key === 'fractal' ? S.field.source : null;
    // A field that deals a sequence has no way to be asked for row N, so it is
    // restored by replaying it up to where the run had got to.
    S.dealt = v.dealt | 0;
    if (S.form) for (let i = 0; i < S.dealt; i++) S.form.nextRow();
    // The view is wherever the field says it is, and arrives there rather than
    // easing across from the starting width.
    retarget(S.field.width());
    CELL = cellT; ORIGIN = originT;
    S.depth = v.depth | 0; S.balls = v.balls | 0; S.gold = v.gold | 0;
    S.owed = { ball: (v.owed && v.owed.ball) | 0, gold: (v.owed && v.owed.gold) | 0 };
    S.power = v.power || CONFIG.swarm.startingPower; S.gain = v.gain || CONFIG.swarm.startingGain;
    S.origin = typeof v.origin === 'number' ? v.origin : W / 2;
    S.rows = Array.isArray(v.rows) ? v.rows.slice() : [];
    S.drops = Array.isArray(v.drops) ? v.drops.slice() : [];
    S.live = Array.isArray(v.live) ? v.live.slice() : [];
    S.firing = !!v.firing; S.queue = v.queue | 0; S.dir = v.dir || null;
    S.dead = !!v.dead;
    juice.clear();
    if (S.dead) die(); else document.getElementById('over').classList.remove('on');
    paintShop();
  },
});

// --- input ------------------------------------------------------------------

function pos(e){
  const r = C.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x: (p.clientX - r.left) * (W / r.width), y: (p.clientY - r.top) * (H / r.height) };
}
const onDown = e => { if (S.firing || S.dead || paused) return; S.aiming = true; S.aim = pos(e); e.preventDefault(); };
const onMove = e => { if (!S.aiming) return; S.aim = pos(e); e.preventDefault(); };
const onUp   = e => { if (!S.aiming) return; S.aiming = false; fire(); e.preventDefault(); };

C.addEventListener('mousedown', onDown); addEventListener('mousemove', onMove); addEventListener('mouseup', onUp);
C.addEventListener('touchstart', onDown, {passive:false});
C.addEventListener('touchmove', onMove, {passive:false});
C.addEventListener('touchend', onUp, {passive:false});

// --- the mode screen --------------------------------------------------------
//
// One place to choose what a run is: which field it descends through and how
// hard it is. It is also where a run goes when it ends, so a player never has
// to reload the page to try the other one.

const tierSel = document.getElementById('tier');
// Every tier is selectable while this is a prototype. The ladder is designed
// to be earned one rung at a time and that gating is not enforced yet.
Tiers.unlockedTiers(Tiers.emptyProgress(), { unlockAll: CONFIG.difficulty.unlockAll }).forEach(t => {
  const o = document.createElement('option');
  o.value = t.id; o.textContent = t.name + ' \u00b7 ' + t.tell;
  if (t.id === TIER) o.selected = true;
  tierSel.appendChild(o);
});
tierSel.onchange = () => {
  TIER = tierSel.value;
  try { localStorage.setItem(storageKey('tier'), TIER); } catch (e) {}
  paintMenu();
  startRun(MODE);
};

// Deepest run per field per difficulty. Kept here rather than on the
// leaderboard because it answers a different question: not who is best, but
// whether this player has tried this mode yet.
const bestKey = (mode, tier) => storageKey('best.' + mode + '.' + tier);
function bestDepth(mode, tier){
  try {
    const v = parseInt(localStorage.getItem(bestKey(mode, tier)), 10);
    return Number.isFinite(v) && v > 0 ? v : 0;
  } catch (e) { return 0; }
}
function recordBest(){
  if (!S || !S.mode) return;
  try {
    if (S.depth > bestDepth(S.mode, S.tier)) {
      localStorage.setItem(bestKey(S.mode, S.tier), String(S.depth));
    }
  } catch (e) {}
}

let paused = false;
const menuEl  = () => document.getElementById('menu');
const isMenuOpen = () => menuEl().classList.contains('on');
function openMenu(){ paused = true; paintMenu(); menuEl().classList.add('on'); }
function closeMenu(){ paused = false; menuEl().classList.remove('on'); }

function paintMenu(){
  const t = CONFIG.text;
  const list = document.getElementById('modelist');
  list.innerHTML = '';
  MODE_IDS.forEach(id => {
    const m = modeOf(id) || { id, name: id, tell: '', blurb: '' };
    const best = bestDepth(id, TIER);
    const b = document.createElement('button');
    b.className = 'mode' + (id === MODE ? ' playing' : '');
    b.innerHTML =
      '<span class="head">'
      + '<span><span class="nm">' + m.name + '</span> <span class="tell">' + m.tell + '</span></span>'
      + '<span class="best">' + (best ? t.menuBestLabel + ' ' + best : t.menuNoBest) + '</span>'
      + '</span>'
      + '<span class="blurb">' + m.blurb + '</span>';
    b.onclick = () => startRun(id);
    list.appendChild(b);
  });
  // Only offer to go back to a run there is something to go back to.
  const live = !!S && !S.dead && S.depth > 1;
  document.getElementById('resume').classList.toggle('on', live);
}

/** Begin a run on a given field. Remembered, so a reload comes back here. */
function startRun(id){
  MODE = normaliseMode(id);
  try { localStorage.setItem(storageKey('mode'), MODE); } catch (e) {}
  document.getElementById('over').classList.remove('on');
  fresh();
  closeMenu();
}

addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  teach.skip();
  if (isMenuOpen()) closeMenu(); else openMenu();
});

document.getElementById('reset').onclick = restart;
document.getElementById('again').onclick = restart;
document.getElementById('modes').onclick = openMenu;
document.getElementById('overmodes').onclick = () => {
  document.getElementById('over').classList.remove('on');
  openMenu();
};
document.getElementById('resume').onclick = closeMenu;
function restart(){ document.getElementById('over').classList.remove('on'); closeMenu(); fresh(); }

// --- loop -------------------------------------------------------------------

function hud(){
  document.getElementById('lvl').textContent = S.depth;
  document.getElementById('balls').textContent = S.balls;
  document.getElementById('gold').textContent = S.gold;
  document.getElementById('rule').textContent = figureName();
  document.getElementById('hint').textContent = S.firing
    ? CONFIG.text.hintFiring
    : CONFIG.text.hintIdle;
}

let shopT = 0, last = 0;
function tick(now){
  const dt = last ? (now - last) / 1000 : 1 / 60;
  last = now;
  juice.update(dt);
  easeView(dt);
  if (!S.dead && !paused){ sim(); if (CONFIG.feel.onboarding) teach.update(dt, S); }
  draw(); hud();
  if (++shopT % 12 === 0 && !S.dead) paintShop();   // keep buy buttons in sync
  requestAnimationFrame(tick);
}

fresh();
const resumed = store.load();
store.start();
// A player with a run in progress is dropped back into it; anyone else is
// asked what they want to play.
if (!(resumed && resumed.ok && resumed.found)) openMenu();
tick();

// The personal best sits in the footer. It works with no server configured.
(function showBest(){
  const b = board.best(TIER);
  if (b && b.depth > 1) document.getElementById('hint').dataset.best = String(b.depth);
})();
</script>
</body>
