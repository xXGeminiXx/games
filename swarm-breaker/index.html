// list to stay right, each option is tested at boot: it is dealt one rank
// against a scratch copy of the stats and kept only if everything it moved is
// something the loop reads below. Add the reading and the option deals itself.

const DELIVERS = new Set([
  'flat',        // damage added to every hit
  'mult',        // damage multiplied
  'pressure',    // damage from the size of the swarm
  'sunder',      // damage against blocks still near full health
  'requisition', // damage from what the run has spent
  'growth',      // the swarm grows a share of itself every turn
  'spoils',      // swarm per block broken
  'nesting',     // a swarm marker is worth a share of the swarm
  'yieldBonus',  // more material per block
  'corner',      // more material the larger the swarm
  'slots',       // a wider hand
  'freeRerolls', // redeals that cost nothing
  'duty',        // a discount on the doctrine you are deepest in
  'dominant',    // which doctrine that is - read only
]);

/** The ids this game can honour, worked out by dealing each option one rank
 *  against a scratch copy of the stats and seeing what it moved. */
function deliverable(){
  const probe = Powers.createState({ seed: 1 });
  const base = probe.derived;
  const same = (a, b) => (a && typeof a === 'object' && 'm' in a)
    ? (b && a.m === b.m && a.e === b.e) : a === b;
  const ok = new Set();
  for (const def of Powers.POWER_LIST){
    // An option that hands something over the moment it is taken is only dealt
    // if all it hands over is swarm, which the loop mirrors straight back.
    if (def.onTake && def.id !== 'conscript') continue;
    let keep = true;
    if (typeof def.effect === 'function'){
      const scratch = Object.assign({}, base);
      try { def.effect(scratch, 1, probe); } catch (e) { keep = false; }
      if (keep) for (const k in scratch) if (!same(scratch[k], base[k]) && !DELIVERS.has(k)) { keep = false; break; }
    }
    if (keep) ok.add(def.id);
  }
  return ok;
}

// The pool is narrowed for THIS game's states only. Every option keeps the
// rule it was written with; one more is added in front of it, and it answers
// yes for anyone who does not ask to be narrowed.
const HAND_POOL = deliverable();
for (const def of Powers.POWER_LIST){
  if (def.hostGated) continue;
  const own = def.req;
  def.hostGated = true;
  def.req = (s) => {
    if (s && s.hostPool && !s.hostPool.has(def.id)) return false;
    return own ? own(s) : true;
  };
}

/** The hand, with anything this game cannot deliver taken out of it. The
 *  filter also drops the echoes a very long run mints, because those are made
 *  from the whole table of effects rather than the narrowed one. */
function handNow(){
  if (!S.pow) return null;
  const hand = Powers.offer(S.pow, S.depth);
  hand.slots = hand.slots.filter(s => HAND_POOL.has(s.id));
  return hand;
}

/** Damage one body deals on a clean impact, with everything the hand has
 *  added to it. Without a single power this is exactly S.power. */
function hitPower(){
  if (!S.pow || !S.pow.derived) return S.power;
  const d = S.pow.derived;
  const flat = Powers.B.toNumber(d.flat) - Powers.TUNING.baseDamage;
  const mult = Powers.B.toNumber(d.mult);
  let p = (S.power + (flat > 0 ? flat : 0)) * (mult > 0 ? mult : 1);
  if (d.pressure > 0) p *= 1 + d.pressure * Math.max(0, Math.log10(S.balls + 10));
  if (d.requisition > 0) p *= 1 + d.requisition * Math.max(0, Math.log10(Powers.B.toNumber(S.pow.meta.spent) + 10));
  return p;
}

/** The extra damage a block takes for being close to full health. */
function sunderMult(bl){
  const d = S.pow && S.pow.derived;
  if (!d || !(d.sunder > 0) || !(bl.max > 0)) return 1;
  return 1 + d.sunder * Math.max(0, Math.min(1, bl.hp / bl.max));
}

/** Swarm the hand adds for a block breaking, banked as a fraction so a small
 *  share of a ball is never lost or rounded up into a free one. */
let spoilsPool = 0;
function spoilsFor(){
  const d = S.pow && S.pow.derived;
  if (!d || !(d.spoils > 0)) return;
  spoilsPool += d.spoils;
  const whole = Math.floor(spoilsPool);
  if (whole >= 1){ spoilsPool -= whole; S.balls += whole; }
}

/** What a swarm marker is worth. One ball, or a share of the swarm. */
function markerBalls(){
  const d = S.pow && S.pow.derived;
  if (!d || !(d.nesting > 0)) return 1;
  return Math.max(1, Math.floor(S.balls * d.nesting));
}

/** The swarm grows at the end of a turn, if anything in the hand grows it. */
function growSwarm(){
  const d = S.pow && S.pow.derived;
  if (!d || !(d.growth > 0)) return;
  S.balls += Math.floor(S.balls * d.growth);
}

/** The hand is priced in the run's cash, so powers and the market spend the
 *  same pool. This keeps the two in step around every read and every buy. */
function syncPowers(){
  if (!S.pow || !S.econ) return;
  S.pow.depth = S.depth;
  S.pow.swarm = Powers.B.of(S.balls);
  S.pow.essence = Powers.B.of(cash());
}

/** The hand as plain data. What is left out is rebuilt on load: the flattened
 *  stats, the cached deal, and the pool this game narrows the deal to. */
function powSave(){
  const { derived, offerCache, hostPool, ...rest } = S.pow;
  return JSON.parse(JSON.stringify(rest));
}

function powLoad(saved){
  const st = Powers.createState({
    seed: saved && saved.seed != null ? saved.seed : S.seed,
    swarm: S.balls, essence: 0,
  });
  if (saved) Object.assign(st, saved);
  st.hostPool = HAND_POOL;
  Powers.recompute(st);
  return st;
}

/** Take from the run's own cash, and answer whether it was there. */
function spendCash(n){
  if (!S.econ) return false;
  const want = Powers.B.toNumber(n);
  if (!(cash() >= want)) return false;
  S.econ.essence = Economy.sub(S.econ.essence, Economy.L(want));
  S.econ.stats.essenceSpent = Economy.add(S.econ.stats.essenceSpent, Economy.L(want));
  return true;
}

/** Take raw material for the material rail, cheapest first, and answer whether
 *  there was enough of it. A power bought this way costs no cash at all. */
function spendMaterial(units){
  if (!S.econ) return false;
  let need = Powers.B.toNumber(units);
  if (!(need > 0)) return true;
  let have = 0;
  for (const m of Economy.MATERIALS) have += Economy.toNum(S.econ.held[m.id]);
  if (have < need) return false;
  for (const m of Economy.MATERIALS){
    if (need <= 0) break;
    const got = Economy.toNum(S.econ.held[m.id]);
    if (!(got > 0)) continue;
    const take = Math.min(got, need);
    S.econ.held[m.id] = Economy.sub(S.econ.held[m.id], Economy.L(take));
    need -= take;
  }
  return true;
}

// --- the record across runs -------------------------------------------------
//
// It counts runs, keeps the deepest each difficulty has been taken, and hands
// the readout the best depth to sit beside the current one. It changes nothing
// about how a run plays, which is the whole reason it is allowed to persist.

let meta = { profile: null, run: null };
const metaKey = storageKey('meta');

function metaLoad(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(metaKey) || 'null'); } catch (e) {}
  meta.profile = saved ? Meta.load(saved) : Meta.create();
  // Every difficulty is selectable from the first run, so the record opens
  // every rung too rather than gating what the menu already offers.
  if (CONFIG.difficulty.unlockAll) Meta.unlockAll(meta.profile);
}

function metaSave(){
  if (!meta.profile) return;
  try { localStorage.setItem(metaKey, JSON.stringify(Meta.save(meta.profile))); } catch (e) {}
}

function metaBegin(){
  if (QUIET || !meta.profile) return;
  const r = Meta.beginRun(meta.profile, { tier: S.tier, seed: S.seed });
  meta.run = r && r.ok ? r : null;
  // Written down when the run ENDS. A run counts once it has a result, and
  // starting one has nothing to say yet.
}

function metaObserve(){
  if (QUIET || !meta.run) return;
  Meta.observe(meta.profile, meta.run, { depth: S.depth, essence: cash(), blocks: S.broken || 0 });
}

function metaEnd(){
  if (QUIET || !meta.run) return;
  Meta.endRun(meta.profile, meta.run, { depth: S.depth, essence: cash(), blocks: S.broken || 0 });
  meta.run = null;
  metaSave();
}

metaLoad();

/** The deepest this difficulty has ever been taken. */
function metaReach(){
  return meta.profile ? (meta.profile.reach[S.tier] | 0) : 0;
}

// --- the deck ---------------------------------------------------------------
//
// Presentation only. A page that cannot host it - the headless harness, for
// one - still gets a complete game; it just gets no desk to trade on.

const ui = makeDeck();
function makeDeck(){
  try {
    return createUI({
      mount: document.getElementById('shop'),
      headerMount: false,
      maxWidth: 520,
      material: {
        slag: CONFIG.palette.tithe, ferrite: CONFIG.palette.dim,
        quartz: CONFIG.palette.swarm, cinder: CONFIG.palette.hot,
        alloy: CONFIG.palette.trade, lens: CONFIG.palette.force,
        core: CONFIG.palette.essence,
      },
      data: {
        history: (id, n) => Economy.history(S.econ, id, n),
        sellPreview: (id, qty) => Economy.sellPreview(S.econ, id, qty),
        buyPreview: (id, qty) => Economy.buyPreview(S.econ, id, qty),
        maxAffordable: (id) => Economy.maxAffordable(S.econ, id),
        consignPreview: (id, qty, term) => Economy.consignPreview(S.econ, id, qty, term),
        plan: (id, qty, turns) => Economy.planSale(S.econ, id, qty, turns),
        forecast: (n) => Economy.forecast(S.econ, n),
      },
      on: {
        sell:    ({ id, qty })       => act('s_' + id, units(qty)),
        buy:     ({ id, qty })       => act('b_' + id, units(qty)),
        craft:   ({ id, times })     => act('c_' + id, Math.max(1, times | 0)),
        consign: ({ id, qty, term }) => act('f_' + id + '_' + (term | 0), units(qty)),
        upgrade: ({ id, cover })     => act((cover ? 'k_' : 'u_') + id, 1),
        power:   ({ id, rail })      => act((rail === 'material' ? 'm_' : 'p_') + id, 1),
        reroll:  ()                  => act('pr', 1),
        restart: ()                  => restart(),
      },
    });
  } catch (e) {
    return null;
  }
}

/** A quantity as whole units, which is what a run writes down and a replay
 *  reads back. Nothing is ever sold in fractions of a unit. */
function units(qty){
  const n = Math.floor(Economy.toNum(qty));
  return Math.max(1, Math.min(1e9, Number.isFinite(n) ? n : 1e9));
}

// A press the player made: carried out, then saved and redrawn.
let logBroken = false;
const LOG_ID = /^[a-z][a-z0-9_-]{0,15}$/;

function act(id, n){
  const did = purchase(id, n);
  if (did){ mark(); paintShop(); }
  return did;
}

/**
 * Carry out `n` of a press and answer how many actually happened.
 *
 * Every press goes through here, live and on replay, so the two cannot drift.
 * Each one is applied in turn rather than multiplied, because a press changes
 * what the next of it costs - a sale moves the price of the next sale, and
 * clearing a row changes the row underneath it.
 */
function purchase(id, n){
  if (!S || !S.econ) return 0;
  const did = press(id, n);
  // The press is written into the run's log as it happens, so a replay makes
  // the same presses in the same order and arrives at the same market. An id
  // the log cannot carry is still carried out; what it costs is the run's
  // claim, which is dropped rather than posted wrong.
  if (did && rec){
    if (LOG_ID.test(id)) rec.buy(id, did);
    else logBroken = true;
  }
  return did;
}

function press(id, n){
  const times = Math.max(0, n | 0);
  const cut = id.indexOf('_');
  const verb = cut < 0 ? id : id.slice(0, cut);
  const rest = cut < 0 ? '' : id.slice(cut + 1);
  S.econ.depth = S.depth;

  if (verb === 's'){
    const r = Economy.sell(S.econ, rest, times);
    return r && r.ok ? times : 0;
  }
  if (verb === 'b'){
    const r = Economy.buy(S.econ, rest, times);
    return r && r.ok ? times : 0;
  }
  if (verb === 'c'){
    const r = Economy.craft(S.econ, rest, times);
    return r && r.ok ? times : 0;
  }
  if (verb === 'f'){
    const at = rest.lastIndexOf('_');
    if (at < 0) return 0;
    const r = Economy.consign(S.econ, rest.slice(0, at), times, Number(rest.slice(at + 1)) | 0);
    return r && r.ok ? times : 0;
  }
  if (verb === 'u' || verb === 'k'){
    let done = 0;
    for (let i = 0; i < times; i++){
      const r = verb === 'k' ? Economy.purchaseWithCover(S.econ, rest) : Economy.purchase(S.econ, rest);
      if (!r || !r.ok) break;
      applyEffect(r.effect);
      done++;
    }
    return done;
  }
  if (verb === 'p' || verb === 'm'){
    if (!S.pow) return 0;
    syncPowers();
    const hand = handNow();
    const slot = hand && hand.slots.find(s => s.id === rest);
    if (!slot || slot.maxed) return 0;
    if (verb === 'p'){
      if (!spendCash(slot.cost)) return 0;
      const r = Powers.apply(S.pow, rest, { rail: 'free' });
      if (!r.ok) return 0;
      S.pow.meta.spent = Powers.B.add(S.pow.meta.spent, slot.cost);
    } else {
      if (!spendMaterial(slot.costMaterial)) return 0;
      const r = Powers.apply(S.pow, rest, { rail: 'material' });
      if (!r.ok) return 0;
    }
    // Anything the option handed over as swarm lands in the run's own count.
    S.balls = Math.max(1, Math.round(Powers.B.toNumber(S.pow.swarm)));
    return 1;
  }
  if (id === 'pr'){
    if (!S.pow) return 0;
    let done = 0;
    for (let i = 0; i < times; i++){
      syncPowers();
      const c = Powers.rerollCost(S.pow, S.depth);
      const free = Powers.B.toNumber(c) <= 0;
      if (!free && !spendCash(c)) break;
      const r = Powers.reroll(S.pow);
      if (!r.ok) break;
      if (!free) S.pow.meta.spent = Powers.B.add(S.pow.meta.spent, c);
      done++;
    }
    return done;
  }
  return 0;
}

/** Awards, in the shape the desk lists them. */
function featRows(){
  return awards.report().map(a => ({
    id: a.id, name: a.name, desc: a.note,
    earned: a.won, progress: a.progress,
  }));
}

/** The board, if a run has already fetched one. */
function boardPanels(){
  if (!boardRows.length) return null;
  return [{
    id: 'depth', name: 'deepest runs',
    rows: boardRows.slice(0, 10).map((e, i) => ({
      rank: i + 1, name: e.name || 'someone', value: e.depth,
      you: !!(myPlayerId && e.player === myPlayerId),
    })),
  }];
}

function paintShop(){
  if (QUIET || !ui || !S || !S.econ) return;
  S.econ.depth = S.depth;
  syncPowers();
  const reach = metaReach();
  ui.update({
    run: {
      depth: S.depth, reach: reach > S.depth ? reach : null,
      swarm: S.balls, essence: cash(), essenceText: cashText(),
      damage: hitPower(),
    },
    market: Economy.report(S.econ),
    powers: S.pow ? { offer: handNow(), codex: Powers.codex(S.pow) } : null,
    feats: featRows(),
    boards: boardPanels(),
  });
  ui.setPhase(S.dead ? 'over' : (S.firing ? 'firing' : 'aim'));
}

/** What the market said about the turn that just finished. */
function digestTurn(){
  if (!ui || QUIET) return;
  const rolled = {};
  for (const g of turnHarvest){
    rolled[g.id] = rolled[g.id] ? Economy.add(rolled[g.id], g.qty) : g.qty;
  }
  const materials = Object.keys(rolled).map(id => ({ id, qty: rolled[id], text: Economy.fmt(rolled[id]) }));
  ui.digest(materials.length ? { depth: S.depth, blocks: S.turnKills || 0, materials } : null);
  turnHarvest = [];
}

// Anything the market opened up, said once and one at a time. Three of them
// arriving together buries the thing the player was about to press, so they
// queue and each one goes away on its own.
let saidReveals = null;
const revealQueue = [];
const REVEAL_LIFE = 14000;

function announceReveals(){
  if (!ui || QUIET || !S.econ) return;
  const now = Economy.reveal(S.econ).unlocked;
  if (!saidReveals){ saidReveals = new Set(now); return; }
  for (const id of now){
    if (saidReveals.has(id)) continue;
    saidReveals.add(id);
    const r = Economy.REVEALS.find(x => x.id === id);
    if (r) revealQueue.push(r);
  }
  const r = revealQueue.shift();
  if (!r) return;
  // One at a time. The desk is what a turn is spent on and three stacked
  // notices push it off the bottom of a short window.
  ui.clearNotices();
  ui.announce({ key: 'rev:' + r.id, kind: 'market', title: r.title, body: r.blurb, ttl: REVEAL_LIFE });
}

// --- persistence ------------------------------------------------------------
//
// A SAVE WRITTEN BY AN OLDER BUILD OF THE GAME.
//
// The shape of a run changes as the game does, and a player who has one in
// progress when a new build lands should not be handed a half-understood
// version of it. There are two halves to that and they are separate.
//
// The first is that a change we KNOW about is migrated, not discarded, so an
// in-progress run survives an update. Each step below says what the shape
// gained and fills it in; unknown fields are carried through untouched, so a
// save can round-trip through an older build without losing what that build
// never heard of.
//
// The second is that a change we do NOT know about - a save from a build newer
// than this one, or one no chain of steps can bring up to date - is refused
// rather than half-loaded. See restore().
//
// AND NOTHING ELSE THE PLAYER HAS IS TOUCHED EITHER WAY. Awards, deepest runs,
// the chosen field and the chosen difficulty are all in their own storage keys
// and none of them is versioned with the run, so the worst an update can ever
// cost is the run that happened to be open.

// Schema 2: a marker in a field that does not descend carries how many turns it
// has left, and a run counts the boards it has cleared to nothing.
registerMigration(1, 2, (data) => {
  if (!data || typeof data !== 'object') return data;
  const drops = Array.isArray(data.drops)
    ? data.drops.map(p => (p && p.t === undefined ? { ...p, t: CONFIG.bloom.markerTurns } : p))
    : data.drops;
  return {
    ...data,
    drops,
    clears: data.clears | 0,
    streak: data.streak | 0,
  };
});

// Schema 3: a run carries a market, a hand of powers, and the depth every
// block on the field arrived at. A run saved before any of that had loose cash
// and nothing to spend it on, so it comes back with an empty market at the
// depth it had reached and keeps everything else it was doing.
registerMigration(2, 3, (data) => {
  if (!data || typeof data !== 'object') return data;
  const { gold, gain, ...rest } = data;
  const rows = Array.isArray(data.rows)
    ? data.rows.map(b => (b && b.d === undefined ? { ...b, d: data.depth | 0 || 1 } : b))
    : data.rows;
  return { ...rest, rows, econ: null, pow: null };
});

const board = createLeaderboard({
  defaultTier: CONFIG.difficulty.defaultTier,
  endpoint: (CONFIG.boards && CONFIG.boards.endpoint) || '',
  allowedHosts: (CONFIG.boards && CONFIG.boards.allowedHosts) || undefined,
});

// The one thing that survives a run. Nothing in here changes how the game
// plays - see src/awards.js for why that is the point.
const awards = createAwards({ key: storageKey('awards') });

/** What this run has done, in the shape the award tracks read. */
function runStats(){
  return {
    depth: S.depth, swarm: S.balls, essence: cash(), power: S.power,
    streak: S.streak || 0, clears: S.clears || 0, clearsBefore: S.clearsBefore || 0,
    winsBefore: S.winsBefore || 0, won: !!S.won,
    kinds: S.kindsSeen || [], mode: S.mode,
  };
}

/** An award, announced the same way everything else is: once, over the field,
 *  gone in a second and a half. Never a dialog and never a thing to dismiss. */
function earned(a){
  // The name alone is a phrase with no referent - the note is the only thing
  // that says which number was crossed to win it.
  moment(a.name, CONFIG.awards.wonTitle + ' \u00b7 ' + a.note, CONFIG.palette.trade);
}

/** Fold the run in and announce anything new. Safe to call at any moment: the
 *  history only ever takes maximums and unions, so checking twice cannot double
 *  count and checking early cannot lose anything. */
// A replayed run is not a run anybody played, so it earns nothing.
function checkAwards(){ if (QUIET) return; awards.check(runStats(), earned); }

const store = createSave({
  key: storageKey('run'),
  // Only a field that can be asked for a row by depth has a fingerprint. One
  // that deals a sequence is checked by replaying it instead.
  fingerprint: () => (S && S.field && typeof S.field.rowFor === 'function')
    ? fieldFingerprint(d => S.field.rowFor(d), [1, 7, 23, 61]) : null,
  capture: () => ({
    mode: S.mode, endless: S.endless, won: S.won,
    seed: S.seed, depth: S.depth, balls: S.balls, dealt: S.dealt, broken: S.broken | 0,
    owed: { ball: S.owed.ball, gold: S.owed.gold },
    // The market and the hand are the run, as much as the field is. Both are
    // plain data by the time they get here.
    econ: S.econ ? Economy.save(S.econ) : null,
    pow: S.pow ? powSave() : null,
    power: S.power, origin: S.origin, dead: S.dead,
    clears: S.clears | 0, streak: S.streak | 0, kindsSeen: (S.kindsSeen || []).slice(),
    // A picture block keeps the row it was cut from and the id of its piece,
    // or it comes back faceless.
    rows: S.rows.map(b => ({ c: b.c, r: b.r, hp: b.hp, max: b.max, k: b.k, R: b.R, id: b.id, d: b.d })),
    drops: S.drops.map(p => ({ c: p.c, r: p.r, kind: p.kind, t: p.t })),
    // A sprayed body belongs to the turn it was thrown in, and a save is taken
    // between turns, so only the swarm is worth writing down.
    live: S.live.filter(b => !b.temp).map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy })),
    firing: S.firing, queue: S.queue, dir: S.dir || null,
  }),
  restore: (v, report) => {
    if (!v || typeof v !== 'object') return;
    // A save this build cannot bring fully up to date is not loaded. The bytes
    // are already set aside by the loader, so a build that does understand them
    // can still have them; what this refuses to do is restore a run out of a
    // shape it only half recognises. Merely DAMAGED saves are still loaded - a
    // slightly wrong run beats no run - which is why this asks about the
    // version rather than about `degraded`.
    if (report && (report.future || report.version !== currentSchema())) return;
    // A picture run saved before its blocks were pieces has cells with no
    // outline to look up. It is left where it is rather than half restored.
    if (normaliseMode(v.mode) === 'fractal' && Array.isArray(v.rows)
        && v.rows.some(b => !b || b.id === undefined)) return;
    // A saved run is played on the field it was started on, whatever the menu
    // happens to be pointing at now.
    MODE = normaliseMode(v.mode);
    S.mode = MODE;
    S.seed = v.seed >>> 0;
    S.field = createField(S.mode, S.seed, { cols: CONFIG.board.cols, formation: FORM_OPTS });
    S.form = S.field.dealsSequence ? S.field.source : null;
    S.kinds = createBlockKinds(S.seed, { lattice: S.field.lattice !== false });
    // A field that deals a sequence has no way to be asked for row N, so it is
    // restored by replaying it up to where the run had got to.
    S.dealt = v.dealt | 0;
    if (S.form) {
      for (let i = 0; i < S.dealt; i++) S.form.nextRow();
      if (typeof S.form.resync === 'function') S.form.resync();
    }
    ROWS_TURN = 1;
    bindField();
    // The view is wherever the field says it is, and arrives there rather than
    // easing across from the starting width.
    retarget(S.field.width());
    CELL = cellT; ORIGIN = originT;
    S.endless = !!v.endless; S.won = !!v.won;
    S.depth = v.depth | 0; S.balls = v.balls | 0; S.broken = v.broken | 0;
    S.econ = v.econ
      ? Economy.load(v.econ, { hpAt: (d) => Math.max(1, Tiers.healthNumber(S.tier, d)) })
      : Economy.create({ depth: S.depth, hpAt: (d) => Math.max(1, Tiers.healthNumber(S.tier, d)) });
    S.pow = powLoad(v.pow);
    S.owed = { ball: (v.owed && v.owed.ball) | 0, gold: (v.owed && v.owed.gold) | 0 };
    S.power = v.power || CONFIG.swarm.startingPower;
    S.origin = typeof v.origin === 'number' ? v.origin : W / 2;
    S.rows = Array.isArray(v.rows) ? v.rows.slice() : [];
    // A piece is handed back to the field it was cut from; one the replayed
    // field does not know is dropped rather than left with no shape. A kind's
    // colour is not saved, so it is looked up again.
    for (const b of S.rows){
      if (b.id !== undefined && S.field.bind && !S.field.bind(b)) b.dead = true;
      if (b.k){ const kd = S.kinds.byId(b.k); if (kd && kd.tint) b.tint = kd.tint; }
    }
    S.rows = S.rows.filter(b => !b.dead);
    S.drops = Array.isArray(v.drops) ? v.drops.slice() : [];
    S.clears = v.clears | 0; S.streak = v.streak | 0;
    S.kindsSeen = Array.isArray(v.kindsSeen) ? v.kindsSeen.slice() : [];
    S.live = Array.isArray(v.live) ? v.live.slice() : [];
    S.firing = !!v.firing; S.queue = v.queue | 0; S.dir = v.dir || null;
    S.dead = !!v.dead;
    juice.clear();
    if (S.dead) die(); else document.getElementById('over').classList.remove('on');
    saidReveals = null;
    announceReveals();
    paintShop();
  },
});

// --- input ------------------------------------------------------------------

function pos(e){
  const r = C.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x: (p.clientX - r.left) * (W / r.width), y: (p.clientY - r.top) * (H / r.height) };
}
const onDown = e => { if (S.firing || S.dead || paused) return; S.aiming = true; S.aim = pos(e); e.preventDefault(); };
const onMove = e => { if (!S.aiming) return; S.aim = pos(e); e.preventDefault(); };
const onUp   = e => { if (!S.aiming) return; S.aiming = false; fire(); e.preventDefault(); };

C.addEventListener('mousedown', onDown); addEventListener('mousemove', onMove); addEventListener('mouseup', onUp);
C.addEventListener('touchstart', onDown, {passive:false});
C.addEventListener('touchmove', onMove, {passive:false});
C.addEventListener('touchend', onUp, {passive:false});

// --- the mode screen --------------------------------------------------------
//
// One place to choose what a run is: which field it descends through and how
// hard it is. It is also where a run goes when it ends, so a player never has
// to reload the page to try the other one.

const tierSel = document.getElementById('tier');
// Every tier is selectable while this is a prototype. The ladder is designed
// to be earned one rung at a time and that gating is not enforced yet.
Tiers.unlockedTiers(Tiers.emptyProgress(), { unlockAll: CONFIG.difficulty.unlockAll }).forEach(t => {
  const o = document.createElement('option');
  o.value = t.id; o.textContent = t.name + ' \u00b7 ' + t.tell;
  if (t.id === TIER) o.selected = true;
  tierSel.appendChild(o);
});
tierSel.onchange = () => {
  TIER = tierSel.value;
  try { localStorage.setItem(storageKey('tier'), TIER); } catch (e) {}
  paintMenu();
  startRun(MODE);
};

// Deepest run per field per difficulty. Kept here rather than on the
// leaderboard because it answers a different question: not who is best, but
// whether this player has tried this mode yet.
const bestKey = (mode, tier) => storageKey('best.' + mode + '.' + tier);
function bestDepth(mode, tier){
  try {
    const v = parseInt(localStorage.getItem(bestKey(mode, tier)), 10);
    return Number.isFinite(v) && v > 0 ? v : 0;
  } catch (e) { return 0; }
}
function recordBest(){
  if (!S || !S.mode) return;
  try {
    if (S.depth > bestDepth(S.mode, S.tier)) {
      localStorage.setItem(bestKey(S.mode, S.tier), String(S.depth));
    }
  } catch (e) {}
}

let paused = false;
const menuEl  = () => document.getElementById('menu');
const isMenuOpen = () => menuEl().classList.contains('on');
function openMenu(){ paused = true; paintMenu(); menuEl().classList.add('on'); }
function closeMenu(){ paused = false; menuEl().classList.remove('on'); }

function paintMenu(){
  const t = CONFIG.text;
  const list = document.getElementById('modelist');
  list.innerHTML = '';
  MODE_IDS.forEach(id => {
    const m = modeOf(id) || { id, name: id, tell: '', blurb: '' };
    // A mode can be playable without being offered - kept so a save started
    // on it still runs, not so a menu grows a row nobody asked for.
    if (m.hidden) return;
    const best = bestDepth(id, TIER);
    const b = document.createElement('button');
    b.className = 'mode' + (id === MODE ? ' playing' : '');
    b.innerHTML =
      '<span class="head">'
      + '<span><span class="nm">' + m.name + '</span> <span class="tell">' + m.tell + '</span></span>'
      + '<span class="best">' + (best ? t.menuBestLabel + ' ' + best : t.menuNoBest) + '</span>'
      + '</span>'
      + '<span class="blurb">' + m.blurb + '</span>';
    b.onclick = () => startRun(id);
    list.appendChild(b);
  });
  paintDaily(list);
  paintBoard();
  // Only offer to go back to a run there is something to go back to.
  const live = !!S && !S.dead && S.depth > 1;
  document.getElementById('resume').classList.toggle('on', live);
  paintAwards();
}

// The only thing that survives a run, shown where a player is already deciding
// what to do next. Everything is listed, won or not, because a list that hides
// what has not been done yet is a list that cannot be aimed at - and each
// unearned one carries how far along it is, so it reads as a distance rather
// than as a locked door.
function paintAwards(){
  const el = document.getElementById('awlist');
  if (!el) return;
  const rows = awards.report();
  const won = rows.filter(r => r.won).length;
  const count = document.getElementById('awcount');
  if (count) count.textContent = won ? won + ' / ' + rows.length : CONFIG.awards.none;
  const title = document.getElementById('awtitle');
  if (title) title.textContent = CONFIG.awards.heading;
  el.innerHTML = '';
  for (const a of rows){
    const d = document.createElement('div');
    d.className = 'aw' + (a.won ? ' won' : '');
    const pct = Math.round(a.progress * 100);
    d.innerHTML = '<b>' + a.name + '</b>' + a.note
      + '<span class="bar"><i style="width:' + pct + '%"></i></span>';
    el.appendChild(d);
  }
}

/** Begin a run on a given field. Remembered, so a reload comes back here. */
// ---------------------------------------------------------------------------
// THE BOARD, IN THE MENU
//
// Three states per row and nothing else. UNCHECKED is not a suspicion, it is
// the ordinary state of a row nobody has looked at yet. CHECKED BY N means
// that many other players replayed the run in their own browsers and reached
// the same result. DOES NOT REPLAY means somebody did not, and the row keeps
// its place, its depth and its order - because the likely reason is an older
// build, not a lie.
//
// Every state is a WORD as well as a colour. Nothing here is announced by a
// sound, and nothing is announced by colour alone.
// ---------------------------------------------------------------------------

let boardRows = [];
let myPlayerId = '';

function boardScope(){
  const st = board.status();
  if (!st.configured) return CONFIG.text.boardLocal || 'your runs on this device';
  return st.crew ? (CONFIG.text.boardCrew || 'crew ') + st.crew : (CONFIG.text.boardOpen || 'everyone');
}

/**
 * Rows to draw. With a board configured these are the shared ones; with none,
 * this device's own runs, which need no server and are the whole feature for
 * anybody who never sets one up.
 */
function boardEntries(){
  const st = board.status();
  const rows = st.configured ? board.board(TIER) : board.personal(TIER, 10);
  return Array.isArray(rows) ? rows : [];
}

function paintBoard(){
  const list = document.getElementById('bdlist');
  if (!list) return;

  const nameSave = document.getElementById('bdnamesave');
  const nameInput = document.getElementById('bdnameinput');
  if (nameSave && nameInput && !nameSave.__wired){
    nameSave.__wired = 1;
    const keep = () => {
      const v = nameInput.value.trim();
      if (!v) return;
      board.setName(v);
      paintBoard();
    };
    nameSave.addEventListener('click', keep);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); keep(); } });
  }

  document.getElementById('bdscope').textContent = boardScope();
  const consent = board.consent();
  const wrap = document.getElementById('bdname');
  const needsName = consent.reason === 'no-name';
  if (wrap) wrap.hidden = !needsName;
  document.getElementById('bdnote').textContent = needsName
    ? (CONFIG.text.boardNameAsk || 'Pick a name and your runs go on the board. It is only a label; nothing else is sent.')
    : (CONFIG.text.boardNote || 'A run can be replayed by anyone. Rows say whether anybody has.');
  list.innerHTML = '';

  boardRows = boardEntries();
  if (!boardRows.length){
    const p = document.createElement('p');
    p.id = 'bdempty';
    p.textContent = CONFIG.text.boardEmpty || 'No runs yet. Finish one and it lands here.';
    list.appendChild(p);
    return;
  }

  boardRows.forEach((e, i) => {
    const state = entryState(e);
    const row = document.createElement('div');
    row.className = 'bdrow' + (myPlayerId && e.playerId === myPlayerId ? ' mine' : '');
    row.title = stateNote(e);

    const rk = document.createElement('span');
    rk.className = 'rk'; rk.textContent = String(i + 1);

    const who = document.createElement('span');
    who.className = 'who'; who.textContent = e.name || (CONFIG.text.boardYou || 'you');

    const dp = document.createElement('span');
    dp.className = 'dp'; dp.textContent = (CONFIG.text.menuBestLabel || 'depth') + ' ' + (e.depth | 0);

    const st = document.createElement('span');
    st.className = 'st' + (state === STATE.witnessed ? ' checked' : state === STATE.mismatch ? ' differs' : '');
    st.textContent = stateLabel(e, CONFIG.text.boardStates || {});

    row.append(rk, who, dp, st);
    list.appendChild(row);
  });

  const check = document.getElementById('bdcheck');
  if (check) check.hidden = !board.status().configured;
}

/**
 * Replay the top rows that this device has not checked and post what it found.
 *
 * THE PEERS DO THE PROCESSING. The server never replays anything - it has ten
 * milliseconds of CPU and a replay is seconds - so verification is other
 * players' browsers doing a few seconds of work while they read the board.
 * A run is never its own witness, so this skips this device's own rows.
 */
async function checkBoard(){
  const btn = document.getElementById('bdcheck');
  if (btn) { btn.disabled = true; btn.textContent = CONFIG.text.boardChecking || 'replaying...'; }
  let done = 0;
  try {
    myPlayerId = await board.playerId();
    for (const e of boardRows.slice(0, 5)){
      if (!e.hasLog || !e.runHash || !e.playerId || e.playerId === myPlayerId) continue;
      const log = await board.runLog(TIER, { playerId: e.playerId });
      if (!log) continue;
      const r = replayRun({ log });
      if (!r.ok) continue;
      await board.witness(TIER, e, r.hash === e.runHash ? 'match' : 'mismatch');
      done++;
    }
    await board.refresh(TIER, { force: true });
  } catch (err) {
    // A board that cannot be reached is not an error the player has to act on.
  }
  if (btn) { btn.disabled = false; btn.textContent = CONFIG.text.boardCheck || 'check the top runs'; }
  paintBoard();
  return done;
}

/**
 * THE DAY'S RUN. One row under the modes.
 *
 * There is no timer on it, nothing expires, and nothing is lost by ignoring it
 * for a week. It is a field everybody who plays today descends, so a depth on
 * it means something next to somebody else's, and that is the entire feature.
 */
function paintDaily(list){
  const t = CONFIG.text;
  const day = utcToday();
  const best = dailyBest(day, TIER);
  const b = document.createElement('button');
  b.className = 'mode daily' + (DAILY === day ? ' playing' : '');
  b.innerHTML =
    '<span class="head">'
    + '<span><span class="nm">' + (t.dailyName || "today's field") + '</span> '
    + '<span class="tell">' + day + '</span></span>'
    + '<span class="best">' + (best ? (t.menuBestLabel || 'best depth') + ' ' + best : (t.menuNoBest || '')) + '</span>'
    + '</span>'
    + '<span class="blurb">' + (t.dailyBlurb || 'The same field for everyone, every day. No timer, nothing to miss.') + '</span>';
  b.onclick = () => startRun(DEFAULT_MODE, { daily: true });
  list.appendChild(b);
}

// The personal board keeps one best per day, so yesterday's is still there
// tomorrow and a day that was missed is simply absent.
const dailyKey = (day, tier) => storageKey('daily.' + day + '.' + tier);
function dailyBest(day, tier){
  try {
    const v = parseInt(localStorage.getItem(dailyKey(day, tier)), 10);
    return Number.isFinite(v) && v > 0 ? v : 0;
  } catch (e) { return 0; }
}
function recordDailyBest(){
  if (!S || !S.daily) return;
  try {
    if (S.depth > dailyBest(S.daily, S.tier)) {
      localStorage.setItem(dailyKey(S.daily, S.tier), String(S.depth));
    }
  } catch (e) {}
}

function startRun(id, opts){
  // THE DAY'S RUN PINS THE FIELD, NOT THE PLAYER'S TIME.
  // The mode is pinned too: a seed alone does not make two runs comparable if
  // one of them is descending a different kind of field. The tier is left
  // alone, because the boards are already kept per tier.
  DAILY = (opts && opts.daily) ? utcToday() : null;
  if (DAILY) id = DEFAULT_MODE;
  MODE = normaliseMode(id);
  try { localStorage.setItem(storageKey('mode'), MODE); } catch (e) {}
  document.getElementById('over').classList.remove('on');
  fresh();
  closeMenu();
}

addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  teach.skip();
  if (isMenuOpen()) closeMenu(); else openMenu();
});

document.getElementById('reset').onclick = restart;
document.getElementById('again').onclick = restart;
document.getElementById('modes').onclick = openMenu;
document.getElementById('overmodes').onclick = () => {
  document.getElementById('over').classList.remove('on');
  openMenu();
};
document.getElementById('resume').onclick = closeMenu;
(() => {
  const b = document.getElementById('bdcheck');
  if (b) b.onclick = () => { checkBoard(); };
})();

function restart(){ document.getElementById('over').classList.remove('on'); closeMenu(); fresh(); }

// ---------------------------------------------------------------------------
// REPLAY
//
// The same simulation, driven from a written down run instead of from a
// finger. This is what makes a board entry checkable: anybody looking at the
// board can run this over somebody else's log in their own browser and see
// whether they reach the same result.
//
// It is the SAME CODE. fresh(), purchase(), fireDir(), sim() and endTurn() are
// the functions the live game uses, called in the order the log records. There
// is no second engine to drift away from the first, which is the only way a
// replay can prove anything at all.
//
// What it borrows it puts back. Every module level thing the game keeps
// between turns is saved, swapped for the replay's own, and restored in a
// finally - so a witness check running over somebody else's run cannot
// disturb the run the player is in the middle of.
// ---------------------------------------------------------------------------

/** Everything a replay must not do for real, made silent by reflection so a
 *  method added to juice later is stubbed without anyone remembering to come
 *  back here. Non-function properties are kept as they are. */
function silence(real){
  const out = {};
  for (const k in real) out[k] = typeof real[k] === 'function' ? (() => {}) : real[k];
  return out;
}

/**
 * Replay a written down run and answer what it reached.
 *
 * @returns {{ok:boolean, reason?:string, depth:number, swarm:number,
 *            essence:number, doctrine:string, hash:string, turns:number,
 *            kills:number[]}}
 */
function replayRun(input){
  const log = input && input.log ? input.log : input;
  const bad = validateLog(log);
  if (bad) return { ok: false, reason: bad };

  // A replay is bounded. A log is somebody else's data, and a witness check
  // runs in a tab a player is trying to read a board in.
  const budget = Math.max(1000, (input && input.stepBudget) | 0 || 6000000);
  let steps = 0;

  const saved = {
    S, MODE, TIER, DAILY, ROWS_TURN, COLS, CELL, ORIGIN, cellT, originT,
    cellIndex, indexDirty, rec, QUIET, juice, turnKills,
  };
  let result;
  try {
    QUIET = true;
    juice = silence(saved.juice);
    MODE = normaliseMode(log.mode);
    TIER = log.tier;
    DAILY = log.daily || null;
    fresh();
    // fresh() derives the seed from the clock unless the run was a daily. A
    // replay is neither: it is told the seed, so the field is rebuilt from
    // the number the run actually used.
    if (S.seed !== (log.seed >>> 0)) {
      S.seed = log.seed >>> 0;
      DAILY = log.daily || null;
      rebuildFrom(S.seed);
    }

    let over = false;
    for (const t of log.turns){
      for (const [id, n] of (t.b || [])) purchase(id, n);
      // The view the shot was aimed against, restored before the shot rather
      // than eased into: the ease runs on wall time and a replay has none.
      CELL = t.v[0]; ORIGIN = t.v[1];
      if (!fireDir(t.d[0], t.d[1])) { over = true; break; }
      while (S.firing){
        if (++steps > budget) return { ok: false, reason: 'the replay ran past its step budget' };
        sim();
      }
      if (S.dead) { over = true; break; }
    }

    result = {
      ok: true,
      depth: S.depth, swarm: S.balls, essence: runWorth(), doctrine: 'none',
      turns: log.turns.length, kills: turnKills.slice(), steps, ended: over,
      hash: runHashOf({ depth: S.depth, swarm: S.balls, essence: runWorth(), doctrine: 'none', kills: turnKills }),
    };
  } finally {
    S = saved.S; MODE = saved.MODE; TIER = saved.TIER; DAILY = saved.DAILY;
    ROWS_TURN = saved.ROWS_TURN; COLS = saved.COLS; CELL = saved.CELL; ORIGIN = saved.ORIGIN;
    cellT = saved.cellT; originT = saved.originT;
    cellIndex = saved.cellIndex; indexDirty = saved.indexDirty;
    rec = saved.rec; QUIET = saved.QUIET; juice = saved.juice;
    turnKills = saved.turnKills;
  }
  return result;
}

/** Rebuild the field and the block kinds from a seed the run is being told,
 *  which is what a replay does and a save restore already did. */
function rebuildFrom(seed){
  S.field = createField(S.mode, seed, { cols: CONFIG.board.cols, formation: FORM_OPTS });
  S.form = S.field.dealsSequence ? S.field.source : null;
  S.kinds = createBlockKinds(seed, { lattice: S.field.lattice !== false });
  S.rows = []; S.drops = []; S.live = []; S.dealt = 0; S.depth = 1;
  S.balls = Tiers.tierOf(S.tier).supply.start; S.broken = 0;
  S.econ = Economy.create({ depth: 1, hpAt: (d) => Math.max(1, Tiers.healthNumber(S.tier, d)) });
  S.pow = Powers.createState({ seed, swarm: S.balls, essence: 0 });
  S.pow.hostPool = HAND_POOL;
  spoilsPool = 0;
  S.owed = { ball: 0, gold: 0 };
  S.power = CONFIG.swarm.startingPower;
  S.origin = W / 2; S.nextOrigin = null; S.dead = false;
  S.endless = false; S.won = false; S.clears = 0; S.streak = 0; S.turnKills = 0;
  ROWS_TURN = 1;
  turnKills = [];
  bindField();
  retarget(S.field.widens ? latticeAt(0) : CONFIG.board.cols);
  CELL = cellT; ORIGIN = originT;
  addRow(); step(); addRow();
}

/** What this run is claiming, for the board. Computed from the run as it was
 *  played, never from a replay of it: if the two ever disagree that is a real
 *  mismatch and the whole point is that somebody gets to see it. */
function runClaim(){
  if (!rec || logBroken) return null;
  const log = rec.log();
  return {
    log,
    runHash: runHashOf({ depth: S.depth, swarm: S.balls, essence: runWorth(), doctrine: 'none', kills: turnKills }),
    build: String(CONFIG.dev.build),
    daily: S.daily || null,
  };
}

// --- loop -------------------------------------------------------------------

// The personal best sits in the footer, beside how many runs it took. Both
// come from the record, which is the only thing that survives a run.
let bestWorn = null;
function paintBest(){
  const el = document.getElementById('best');
  if (!el || !S) return;
  const runs = meta.profile ? (meta.profile.runs | 0) : 0;
  // Reading the deepest run means parsing what is in storage, and this is
  // called every frame, so it only happens when one of its inputs has moved.
  const key = S.tier + ':' + runs + ':' + metaReach();
  if (key === bestWorn) return;
  bestWorn = key;
  const deep = Math.max(metaReach(), (board.best(S.tier) || {}).depth | 0);
  if (!(deep > 1)) { el.textContent = ''; return; }
  const label = CONFIG.text.menuBestLabel || 'best depth';
  el.textContent = runs > 1 ? `${label} ${deep} over ${runs} runs` : `${label} ${deep}`;
}

// The fourth figure across the top belongs to the FIELD, and each one says
// whichever thing about itself decides the run. A descending field names the
// generator drawing it, because what is coming next is the only open question.
// A field that fills already shows what is coming; how much room is left is
// what a player cannot see at a glance, so it says that instead, and turns hot
// as the board closes.
function hud(){
  document.getElementById('lvl').textContent = S.depth;
  document.getElementById('balls').textContent = S.balls;
  document.getElementById('gold').textContent = cashText();

  const say = S.field.arrival.readout(view());
  const rule = document.getElementById('rule');
  rule.textContent = say ? say.value : figureName();
  rule.className = (say && say.pressure >= CONFIG.bloom.warnAt) ? 'hotv' : '';
  const lbl = document.getElementById('lbl-pattern');
  if (lbl) lbl.textContent = say ? CONFIG.text.stats.fill : CONFIG.text.stats.pattern;

  document.getElementById('hint').textContent = S.firing
    ? CONFIG.text.hintFiring
    : CONFIG.text.hintIdle;
  paintBest();
}

// HOW MANY SIMULATION STEPS THIS FRAME.
//
// Nothing in this game is allowed to be waiting. A turn with three hundred
// bodies in it breaks that rule on its own: every one of them has to leave the
// field before the turn can close, and at one step a frame that is most of a
// minute spent watching a result that was decided in the first second.
//
// So the simulation runs faster and the bodies never do. Speed, radius,
// substeps and every collision are untouched, and a turn plays out exactly as
// it would have - there are simply more of its steps inside each frame. Raising
// the speed instead would change every bounce and let fast bodies tunnel.
//
// It ramps on two things. A large swarm earns it immediately, because the wait
// is proportional to the count. And ANY turn that has run long earns it
// whatever the reason, which is what catches the last body rattling in a corner
// while the player waits on it.
function turnSteps(){
  if (!S.firing) return 1;
  const c = CONFIG.swarm;
  const bySwarm = Math.max(0, S.balls - c.hasteFrom) / Math.max(1, c.hasteSwarm);
  const byTime  = Math.max(0, S.fireT - c.hasteAfter) / Math.max(1, c.hasteRamp);
  return Math.max(1, Math.min(Math.max(1, c.hasteMax | 0), Math.round(1 + bySwarm + byTime)));
}

let shopT = 0, last = 0;
// THE PAGE TAKES THE COLOUR OF THE FIELD.
//
// The canvas is drawn at a hue that belongs to whatever is being played and
// drifts as a run passes from one generator to the next. The page around it is
// CSS and learns none of that on its own, so the frame stays one flat ground
// while the picture inside it changes - which reads as two images butted
// together rather than one. The field decides the colours; this only puts them
// where the page can see them, and only when they have actually moved.
let shellWorn = null;
function paintShell(){
  // A field that paints its own picture says what it is drawn on; the rest
  // are washed at the regime's hue and say nothing.
  const v = look.shell(S.field && S.field.ground);
  if (!v || v === shellWorn) return;
  shellWorn = v;
  // The headless harness supplies just enough document to boot the game, so
  // every surface reached for out here has to be optional.
  const root = document.documentElement && document.documentElement.style;
  if (!root || typeof root.setProperty !== 'function') return;
  for (const k in v) root.setProperty(k, v[k]);
}

function tick(now){
  const dt = last ? (now - last) / 1000 : 1 / 60;
  last = now;
  juice.update(dt);
  easeView(dt);
  updateMoments(dt);
  // Presentation only, so it burns down on wall time and keeps going while the
  // menu is open rather than freezing half drawn.
  if (ARRIVAL_FLASH > 0){
    for (const b of S.rows) if (b.pop) b.pop = Math.max(0, b.pop - dt / ARRIVAL_FLASH);
  }
  if (!S.dead && !paused){
    // A turn runs at more than one simulation step a frame once it has earned
    // it. Same physics, same result, less of the player's life spent watching
    // an outcome that was decided in the first second. See turnSteps().
    const n = turnSteps();
    for (let k = 0; k < n; k++){ sim(); if (!S.firing) break; }
    if (CONFIG.feel.onboarding) teach.update(dt, S);
    // A field that has work to do ahead of itself - the next picture to cut -
    // does a few milliseconds of it in each quiet frame, so the turn that
    // first needs it never pays for it.
    if (!S.firing && S.field.prepare) S.field.prepare(PREPARE_MS);
  }
  draw(); hud(); paintShell();
  // Prices, stock and what is affordable all move while a turn runs.
  if (++shopT % 20 === 0 && !S.dead && !S.firing) paintShop();
  requestAnimationFrame(tick);
}

fresh();
const resumed = store.load();
store.start();
// A handle for tools that drive the page: the live run and the view.
if (typeof window !== 'undefined') window.game = {
  get state(){ return S; }, get cell(){ return CELL; }, get origin(){ return ORIGIN; },
  // The verification surface. `replay` is what a witness runs over somebody
  // else's log; `claim` is what this run would post; `fire` and `buy` are how
  // a driver plays a run without a pointer.
  replay: replayRun,
  claim: runClaim,
  get log(){ return rec ? rec.log() : null; },
  fire: (x, y) => fireDir(x, y),
  buy: (id, n) => act(id, n),
  step: () => sim(),
  // The desk, so a driver can read what the player is reading: the market as
  // it is quoted right now, the hand as it is dealt, and the record so far.
  get market(){ return S.econ ? Economy.report(S.econ) : null; },
  get hand(){ return handNow(); },
  get record(){ return meta.profile ? Meta.report(meta.profile) : null; },
  save: () => store.flush(),
  board,
};
// A player with a run in progress is dropped back into it; anyone else is
// asked what they want to play.
if (!(resumed && resumed.ok && resumed.found)) openMenu();
tick();

</script>
</body>
</html>
