<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foxfire</title>
<style>
  /* Every colour on this page is a custom property put here from the palette
     in config.js, so a colour is written in one file and read in the other.
     No value below is a literal. */
  *{box-sizing:border-box}
  /* The page grows as the organism does, and everything not on it yet is
     hidden. Said here because a rule below that gives an element a display of
     its own would otherwise put it back on the page. */
  [hidden]{display:none !important}
  /* Every size on this page is in rem, so the whole interface follows the
     size the reader has set in the browser rather than a number chosen here.
     Nothing is set in small capitals: they take away the ascenders and
     descenders a word is recognised by, which is the last thing a small
     label can spare. */
  html{font-size:100%}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--loam);color:var(--ink)}
  body{
    font:1.125rem/1.55 "Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
    font-variant-numeric:tabular-nums lining-nums;
    -webkit-text-size-adjust:100%;
  }

  /* The floor: the whole window, behind everything. */
  #floor{position:fixed;inset:0;z-index:0}
  #floor canvas{display:block;width:100%;height:100%;cursor:crosshair}

  /* The specimen label, pinned to the top left of the floor: the figures a
     player checks constantly, so they are set at reading size, the words in
     front of them are quieter than the figures, and a long line wraps onto
     the next rather than being cut off. */
  #label{
    position:absolute;left:1.1rem;top:1rem;max-width:min(62vw,36rem);
    background:var(--paper);color:var(--ink);border:1px solid var(--rule);
    padding:.5rem .85rem .55rem;font-size:1.0625rem;line-height:1.5;pointer-events:none;
  }
  #label p{margin:0}
  /* A figure and the word in front of it stay together; a line that runs out
     of room breaks between them, never through one. */
  #label p>span{display:inline-block;white-space:nowrap}
  #label #title{font-weight:600;margin-right:.15em}
  #label i{font-style:normal;color:var(--faded);font-size:.9em}
  #label span span{margin-left:.3em;font-weight:600}
  #label #st-level,#label #st-area,#label #st-minerals,#label #st-tips{margin-left:.85em}
  /* The rate carries its unit rather than a word in front of it. */
  #label #st-income{margin-left:.5em}
  #label #st-income i{margin-left:0;font-weight:400}
  #label #sugar{color:var(--sugar)}
  #label #income{color:var(--moss)}
  #label #minerals{color:var(--mineral)}

  /* The chain under the figures: where the sugar comes from, and what happens
     to the minerals between the ground and the trees. It is the whole of how
     the game works, so it is on the label rather than three panels down. */
  #label p.chain{margin-top:.15rem;font-size:.95em}
  #label p.chain>i{margin-right:.15em}
  #label p.chain>span{margin-right:.85em}
  #label p.chain>span:last-child{margin-right:0}
  #label p.chain>span>b{margin-left:.3em;font-weight:600}
  #label #st-source>span>b{color:var(--sugar)}
  #label #st-minerals>span>b{color:var(--mineral)}
  #label #min-lost>b{color:var(--rust-ink)}

  /* The journal: cream paper down the right, scrolling inside itself. It is
     wide enough for the longest line it holds to sit on one line. */
  #journal{
    position:fixed;top:0;right:0;bottom:0;width:clamp(27rem,32vw,34rem);z-index:2;
    background:var(--paper);color:var(--ink);border-left:1px solid var(--rule);
    overflow-y:auto;overflow-x:hidden;overflow-wrap:break-word;
    padding:1rem 1.15rem 1.75rem;
  }
  #tagline{margin:0 0 .8rem;font-style:italic;font-size:1rem;color:var(--faded)}

  /* The compass. One line at the top of the journal naming the thing most
     worth doing next and the figures behind it. It sits on its own tone of
     paper with a rule down its left edge, because it is the one thing on the
     page that is not a record of what happened. */
  #next{
    margin:0 0 1.1rem;padding:.5rem .75rem;font-size:1.0625rem;line-height:1.45;
    background:var(--paper-deep);border-left:3px solid var(--rust-ink);color:var(--ink);
  }
  #next:empty{display:none}
  /* The move the line names, as a button on the line. The control it stands
     in for can be most of a column below, and the line scrolls off the top of
     the window on the way to it. */
  #next .line{display:block}
  #next button.go{
    margin-top:.5rem;border-color:var(--rust-ink);color:var(--rust-ink);
    background:var(--paper);font-weight:600;
  }
  #next button.go:hover:not(:disabled){background:var(--paper-deep)}

  /* What happened while nobody was here. It stands above the compass because
     it is the first thing a player wants on coming back, and the entries it
     used to live among are at the foot of the page. It goes as soon as
     anything is pressed. */
  #away{
    margin:0 0 1.1rem;padding:.5rem .75rem;font-size:1.0625rem;line-height:1.45;
    background:var(--paper-deep);border-left:3px solid var(--moss);color:var(--ink);
  }
  .panel{margin:0 0 1.15rem}
  .panel:last-of-type{margin-bottom:0}
  h2{
    font-size:1.2rem;font-weight:600;letter-spacing:.01em;
    color:var(--ink);margin:0 0 .45rem;padding-bottom:.2rem;border-bottom:1px solid var(--rule);
  }
  p{margin:0}
  .note{color:var(--faded);font-size:1rem;margin-top:.35rem}

  /* Paper labels. */
  button{
    font:inherit;font-size:1.0625rem;line-height:1.35;color:var(--ink);background:var(--paper);
    border:1px solid var(--rule);border-color:color-mix(in srgb,var(--ink) 60%,transparent);
    padding:.2rem .65rem;min-height:1.9rem;cursor:pointer;border-radius:1px;
  }
  button:hover:not(:disabled),button:active:not(:disabled){background:var(--paper-deep)}
  button:disabled{color:var(--faded);cursor:default}
  /* A label that cannot be pressed has to read as one. The few buttons that
     carry an ink of their own are written by id, which beats the plain
     disabled rule above, so a Go beyond priced out of reach used to be drawn
     in exactly the ink of one that could be pressed. */
  #beyond:disabled,#fruit:disabled,#aim-clear:disabled,#next button.go:disabled{
    color:var(--faded);border-color:var(--rule);
  }
  button b{font-weight:500}
  button i{font-style:normal;color:var(--faded);margin-left:.45rem;font-size:.92em}
  button:disabled i{color:var(--faded)}
  .acts{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:0 0 .35rem}

  /* The entries: oldest at the top, the newest one at the foot of the page. */
  #log{max-height:min(31vh,22rem);overflow-y:auto;overflow-x:hidden;padding-right:.35rem}
  #log p{margin:0 0 .5rem}
  #log p:last-child{margin-bottom:0}
  #log .mark{font-style:normal;font-weight:600;color:var(--faded);margin-right:.3em}

  /* The hand. */
  #hand{display:flex;flex-wrap:wrap;align-items:baseline;gap:.6rem}
  #handline{color:var(--faded);font-size:1rem}
  #tipline{color:var(--faded);font-size:1rem}
  #aimline{color:var(--faded);font-size:1rem;margin-top:.35rem}
  #aim-clear{border-color:var(--rust-ink);color:var(--rust-ink)}

  /* The trees ledger. One block a kind rather than a row: a name, what there
     is of it, the figures, the two decisions, and the note. Nothing is in a
     column that could be cut off, and a block that will not fit on one line
     wraps onto the next. */
  .tree{padding:.5rem 0 .55rem;border-bottom:1px solid var(--rule)}
  .tree:last-of-type{border-bottom:0}
  .tree .thead{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .6rem}
  .tree .name{font-weight:600}
  .tree .count{color:var(--faded);font-size:1rem}
  /* The kind paying most for the next mineral, marked on its own head so the
     decision the share ticks make does not have to be worked out. */
  .tree .best{color:var(--rust-ink);font-size:1rem;font-weight:600}
  .tree .figs{display:flex;flex-wrap:wrap;gap:0 1.1rem;margin-top:.15rem}
  .tree .fig i{font-style:normal;color:var(--faded);font-size:.95rem;margin-right:.35em}
  .tree .fig b{font-weight:600}
  .tree .fig.sent b{color:var(--mineral)}
  .tree .fig.got b{color:var(--sugar)}
  .tree .fig.rate b{font-weight:700}
  .tree .fig.rate.cold b{color:var(--faded);font-weight:400}
  .tree .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.1rem;margin-top:.35rem}
  .tree .share{display:flex;align-items:center;gap:.35rem}
  .tree .share i{font-style:normal;color:var(--faded);font-size:.95rem}
  .tree .pols{display:flex;flex-wrap:wrap;gap:.4rem}
  /* The share: five ticks, filled up to the weight, clicked to set it. A tick
     was nine tenths of a rem square, which is fourteen pixels of target for
     the decision the compass names more often than any other. */
  button.tick{
    width:1.5rem;height:1.5rem;padding:0;min-height:0;margin:0;border-radius:0;
    border:1px solid var(--ink);background:var(--paper);
  }
  button.tick.on{background:var(--ink)}
  .tree .share{gap:.3rem}
  .tree .pols button.on{border-color:var(--rust-ink);color:var(--rust-ink)}
  /* The note under each kind: when it pays best, what a grown tree is worth
     felled against kept, what feeding buys. */
  .tree .note{color:var(--faded);font-size:1rem;line-height:1.4;margin-top:.3rem}
  .tree .note em.mark{font-style:normal;font-weight:600;margin-right:.4em}
  #treesnote{color:var(--faded);font-size:1rem;margin-top:.35rem}
  /* The switch that hands the split over. It sits above the kinds because the
     answer to "which of these do I send to" is that nothing here has to be
     touched at all. */
  #trees-auto{margin-bottom:.7rem}

  /* The year: one ruled line, four marks, and the point we are at. */
  #season-name{font-weight:600}
  #season-left{color:var(--faded);font-size:1rem;margin-left:.6rem}
  #season-track{position:relative;height:.7rem;margin-top:.5rem}
  #season-track::before{content:"";position:absolute;left:0;right:0;top:.35rem;height:1px;background:var(--rule)}
  #season-track .mk{position:absolute;top:.15rem;width:1px;height:.45rem;background:var(--rule)}
  #season-track .mk:nth-of-type(1){left:0}
  #season-track .mk:nth-of-type(2){left:25%}
  #season-track .mk:nth-of-type(3){left:50%}
  #season-track .mk:nth-of-type(4){left:75%}
  #season-bar{
    position:absolute;top:0;left:0;width:0;height:0;margin-left:-.25rem;
    border-left:.25rem solid transparent;border-right:.25rem solid transparent;border-top:.4rem solid var(--ink);
  }
  .season-2 #season-name{color:var(--rust-ink)}
  .season-2 #season-bar{border-top-color:var(--rust-ink)}

  /* Reach. How much of this scale the threads are in, and the mark on it
     where enough has been reached to fold the whole level away. A share of
     something finite is the one figure here worth a bar rather than a
     sentence. */
  #reach-bar{
    position:relative;height:.55rem;margin:0 0 .5rem;
    background:var(--paper-deep);border:1px solid var(--rule);
  }
  #reach-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--moss)}
  #reach-mark{position:absolute;top:-.15rem;bottom:-.15rem;width:2px;background:var(--rust-ink)}
  #reachline,#beyondline,#belowline{color:var(--faded);font-size:1rem;margin:0 0 .35rem}
  #beyondline:empty,#belowline:empty{margin:0}
  #beyond{border-color:var(--rust-ink);color:var(--rust-ink)}

  /* Traits and what the spore carries: a label, what it does, how far it has
     gone. On a column this narrow the sentence sits under its own label. */
  .rrow{
    display:grid;grid-template-columns:1fr auto;grid-template-areas:"name lv" "line line";
    gap:.1rem .6rem;align-items:baseline;margin:0 0 .7rem;
  }
  .rrow button.rite{grid-area:name;justify-self:start;max-width:100%;text-align:left}
  .rrow .lv{grid-area:lv;color:var(--faded);font-size:1rem}
  .rrow .line{grid-area:line;color:var(--faded);font-size:1rem;line-height:1.4}
  #genome{margin-top:.15rem}
  /* Traits are ordered by what can still be bought, cheapest first, with the
     finished ones at the foot. The rows are made once and kept, so the order
     is set on them rather than by moving them about. */
  #traits{display:flex;flex-direction:column}

  /* Instinct: the same rows as the traits, each label switching a habit on or
     off, and under them the share of the sugar instinct leaves alone. */
  .rrow button.rite.on{border-color:var(--rust-ink);color:var(--rust-ink)}
  #instinct-reserve{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin-top:.2rem}
  #instinct-reserve span{color:var(--faded);font-size:1rem}
  #instinct-reserve button{font-size:1rem;padding:.1rem .55rem}
  #instinct-reserve button.on{border-color:var(--rust-ink);color:var(--rust-ink)}

  /* Fruiting. */
  #spores-note{color:var(--faded);font-size:1rem;margin-bottom:.5rem}
  #spores-held{color:var(--moss);font-size:1rem;margin-top:.5rem}
  #fruit{border-color:var(--moss);color:var(--moss)}

  /* The desk drawer. */
  #tools{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;margin-top:1.2rem;padding-top:.7rem;border-top:1px solid var(--rule)}
  #tools button{font-size:1rem;padding:.15rem .6rem}
  #saved{margin-left:auto;color:var(--faded);font-size:1rem}

  /* A phone: the floor keeps the top third and the journal slides up over the
     rest of it. Nothing is beside anything, so nothing can be cut off. */
  @media (max-width:760px){
    #journal{top:40vh;left:0;right:0;width:auto;border-left:0;border-top:1px solid var(--rule);padding:.85rem .9rem 1.4rem}
    #label{left:.7rem;top:.7rem;max-width:calc(100% - 1.4rem)}
    #log{max-height:min(26vh,16rem)}
    /* Five lines of label over a strip of floor leaves no floor. The chain is
       the same story the compass and the tips line tell in the journal, and on
       a narrow window the journal is where there is room for it. */
    #label p.chain{display:none}
  }
  @media (max-height:620px){
    #log{max-height:11rem}
    .panel{margin-bottom:.8rem}
  }
</style>
<!-- plays:start -->
<script>
(function () {
  // Counts one play, once, and then stays quiet. See games-plays/README.md for
  // what is stored on the other end, which is a total and nothing else.
  var END = 'https://games-plays.xxgeminixx.workers.dev', GAME = 'foxfire';
  if (!END || !window.fetch) return;

  // A build being served off this machine is a build being worked on. Counting
  // it would mean the numbers are mostly whoever made the game.
  var h = location.hostname;
  if (!h || h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || location.protocol === 'file:') return;
  if (location.search.indexOf('nocount') >= 0) return;

  // Without storage there is no way to tell a first play from a fifth, and a
  // counter that cannot tell would count every reload. Undercounting by the
  // browsers that block storage is a wrong number; counting every reload is a
  // meaningless one, so this browser is simply not counted.
  var KEY = '__plays', all;
  try {
    all = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (!all || typeof all !== 'object') all = {};
    localStorage.setItem(KEY, JSON.stringify(all));
  } catch (e) { return; }

  var me = all[GAME] || (all[GAME] = {});
  var day = new Date().toISOString().slice(0, 10);
  var carried = Number(me.owed) || 0;   // seconds played on earlier visits, never reported
  var played = 0;                       // seconds this page has been watched
  var touched = false;                  // somebody has actually done something
  var sending = false;

  var HOLD = 10;        // seconds of real attention before a play is a play
  var RETRY = 60;       // and how long to wait before asking again if that failed
  var TOPUP = 120;      // seconds worth carrying home at the end of a visit
  var HOUR = 3600000;

  // Every game on this site shares one key, and a game can be open in two tabs
  // at once - an idle game is meant to be left open. A page that writes the
  // whole object back writes what it read when it loaded, which erases what
  // another tab recorded in the meantime. Erasing a game's record makes its
  // next play look like a new player, so the headline number is the one that
  // inflates. Take the freshest record for this game, and never move it back.
  function sync() {
    var now;
    try { now = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { now = null; }
    if (!now || typeof now !== 'object') now = {};
    var kept = now[GAME] || {};
    if (kept.day && (!me.day || kept.day > me.day)) me.day = kept.day;
    if (kept.back) me.back = 1;
    if (kept.top && (!me.top || kept.top > me.top)) me.top = kept.top;
    now[GAME] = me;
    all = now;
    return now;
  }

  function save() {
    try { var now = sync(); me.owed = carried + played; localStorage.setItem(KEY, JSON.stringify(now)); } catch (e) {}
  }

  function post(body, beacon) {
    var text = JSON.stringify(body);
    // text/plain is a content type the browser is allowed to send without
    // asking the server for permission first, so one request does the job.
    if (beacon && navigator.sendBeacon) {
      try { return navigator.sendBeacon(END + '/api/play', new Blob([text], { type: 'text/plain' })); } catch (e) { return false; }
    }
    return fetch(END + '/api/play', {
      method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: text, keepalive: true
    });
  }

  // The play itself: sent once per day, carrying whatever time was never
  // reported before it.
  function report() {
    sync();                                // another tab may have already done it
    if (sending || me.day === day) return;
    sending = true;
    var owed = carried + played;
    var body = {
      game: GAME,
      session: true,
      first: !me.day,                                 // this browser has never played it
      returning: Boolean(me.day && !me.back),         // played before, and this is the first day back
      seconds: owed
    };
    post(body).then(function (r) {
      sending = false;
      if (!r || !r.ok) return;                        // try again on the next visit
      if (body.returning) me.back = 1;
      me.day = day;
      carried -= owed;                                // exactly what was reported, no more
      save();
    }).catch(function () { sending = false; });
  }

  // Time played after the day's report, handed over when the page goes away.
  // The clock is cleared before the request rather than after, because this
  // one cannot be confirmed: losing a few minutes is a smaller lie than
  // counting them twice.
  function topup() {
    sync();
    var owed = carried + played;
    if (owed < TOPUP || me.day !== day) return;
    if (me.top && Date.now() - me.top < HOUR) return;
    me.top = Date.now();
    carried -= owed;
    save();
    post({ game: GAME, session: false, first: false, returning: false, seconds: owed }, true);
  }

  var mark = 0;
  setInterval(function () {
    if (document.hidden) return;
    played++;
    // A report that failed is worth trying again, but not every second: a
    // counter must never turn one unreachable server into a request per
    // second per open tab.
    if (touched && played >= HOLD && (played - HOLD) % RETRY === 0) report();
    if (++mark >= 15) { mark = 0; save(); }
  }, 1000);

  var note = function () { touched = true; };
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (t) {
    addEventListener(t, note, { once: true, passive: true, capture: true });
  });
  addEventListener('pagehide', topup);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { save(); topup(); } });
})();
</script>
<!-- plays:end -->
<!-- build-watch:start -->
<meta name="build" content="8c52f986bd89">
<script>
(function () {
  var meta = document.querySelector('meta[name="build"]');
  var mine = meta && meta.getAttribute('content');
  if (!mine || !window.fetch) return;
  var every = 300000;          // re-ask every five minutes while the tab is open
  var checking = false;

  function reload(to) {
    // A plain reload can be answered from cache, so the new build is asked for
    // by a URL the cache has not seen. Whatever the player already had on the
    // address bar is kept; only a previous build stamp is replaced.
    var q = new URLSearchParams(location.search);
    q.set('b', to);
    location.replace(location.pathname + '?' + q.toString() + location.hash);
  }

  function check() {
    if (checking || document.hidden) return;
    checking = true;
    fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        checking = false;
        if (!j || !j.build || j.build === mine) return;
        // One reload per build. If the page comes back still stamped with the
        // old id the files were not really replaced, and reloading again would
        // only spin.
        try {
          if (sessionStorage.getItem('build-watch') === j.build) return;
          sessionStorage.setItem('build-watch', j.build);
        } catch (e) { /* private mode: fall through and reload once */ }
        reload(j.build);
      })
      .catch(function () { checking = false; });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, every);
  setTimeout(check, 15000);
})();
</script>
<!-- build-watch:end -->

<body>
<div id="floor">
  <canvas id="v"></canvas>
  <div id="label">
    <p><b id="title"></b><span id="st-level" hidden><i id="lbl-level"></i><span id="level"></span></span><span id="st-area" hidden><i id="lbl-area"></i><span id="area"></span></span></p>
    <p><span id="st-sugar"><i id="lbl-sugar"></i><span id="sugar">0</span></span><span id="st-income" hidden><span id="income"></span><i id="lbl-income"></i></span><span id="st-tips" hidden><i id="lbl-tips"></i><span id="tips"></span></span></p>
    <p class="chain" id="st-source" hidden><i id="lbl-source"></i><span id="src-wood"></span><span id="src-trade"></span><span id="src-below"></span></p>
    <p class="chain" id="st-minerals" hidden><i id="lbl-minerals"></i><span id="minerals"></span><span id="min-carried"></span><span id="min-lost"></span></p>
  </div>
</div>

<aside id="journal">
  <p id="tagline"></p>

  <p id="away" hidden></p>

  <p id="next"></p>

  <section class="panel" id="hand-panel">
    <div id="hand"><button id="reach"></button><span id="handline"></span></div>
  </section>

  <section class="panel" id="tips-panel" hidden>
    <h2 id="p-tips"></h2>
    <div class="acts"><button id="buy-tip"></button><button id="buy-tips-max"></button><button id="aim-clear" hidden></button></div>
    <p id="tipline"></p>
    <p id="aimline"></p>
  </section>

  <section class="panel" id="reach-panel" hidden>
    <h2 id="p-reach"></h2>
    <p id="reachline"></p>
    <div id="reach-bar"><span id="reach-fill"></span><i id="reach-mark"></i></div>
    <div class="acts"><button id="extend"></button><button id="beyond" hidden></button></div>
    <p id="beyondline"></p>
    <p id="belowline" hidden></p>
  </section>

  <section class="panel" id="trees-panel" hidden>
    <h2 id="p-trees"></h2>
    <div id="trees-auto" class="rrow"></div>
    <div id="trees"></div>
    <p id="treesnote"></p>
  </section>

  <section class="panel" id="season-panel" hidden>
    <h2 id="p-season"></h2>
    <p><span id="season-name"></span><span id="season-left"></span></p>
    <div id="season-track"><i class="mk"></i><i class="mk"></i><i class="mk"></i><i class="mk"></i><span id="season-bar"></span></div>
  </section>

  <section class="panel" id="traits-panel" hidden>
    <h2 id="p-traits"></h2>
    <div id="traits"></div>
  </section>

  <section class="panel" id="instinct-panel" hidden>
    <h2 id="p-instinct"></h2>
    <div id="instinct"></div>
    <div id="instinct-reserve"></div>
  </section>

  <section class="panel" id="spores-panel" hidden>
    <h2 id="p-spores"></h2>
    <p id="spores-note"></p>
    <button id="fruit" hidden></button>
    <p id="spores-held"></p>
    <h2 id="p-genome" hidden></h2>
    <div id="genome" hidden></div>
  </section>

  <section class="panel" id="entries-panel">
    <h2 id="fieldhint"></h2>
    <div id="log"></div>
  </section>

  <div id="tools">
    <button id="export"></button>
    <button id="import"></button>
    <button id="reset"></button>
    <span id="saved"></span>
  </div>
</aside>

<script type="module">
// ---------------------------------------------------------------------------
// Foxfire. One spore on a dead log; then the forest.
//
// This file only wires the page to the game. Everything the game is lives in
// src/, every number lives in config.js, and every sentence lives in
// content.js.
// ---------------------------------------------------------------------------
import { CONFIG, applyIdentity } from './config.js?v=17';
import { createGame } from './src/game.js?v=17';

applyIdentity(document);

const game = createGame({
  doc: document,
  win: window,
  canvas: document.getElementById('v'),
  cfg: CONFIG,
  storage: window.localStorage,
});

// The drawer: a save that can leave, a save that can arrive, and a clean slate.
document.getElementById('export').addEventListener('click', () => {
  const str = game.exportSave();
  const done = (ok) => game.ui.savedNote(ok ? CONFIG.text.saveCopied : CONFIG.text.saveCopyThis + str.slice(0, 24) + '...');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(str).then(() => done(true), () => { window.prompt(CONFIG.text.savePrompt, str); done(false); });
  } else {
    window.prompt(CONFIG.text.savePrompt, str);
    done(false);
  }
});
document.getElementById('import').addEventListener('click', () => {
  const str = window.prompt(CONFIG.text.savePaste);
  if (!str) return;
  try { game.importSave(str); } catch (e) { game.ui.savedNote(String(e.message || e)); }
});

// Two presses to do anything that cannot be undone.
const armed = (id, sure, plain, fn) => {
  let on = false;
  const b = document.getElementById(id);
  b.addEventListener('click', () => {
    if (!on) { on = true; b.textContent = sure; setTimeout(() => { on = false; b.textContent = plain; }, 4000); return; }
    fn();
  });
};
armed('reset', CONFIG.text.resetSure, CONFIG.text.reset, () => game.reset());
armed('fruit', CONFIG.text.fruitSure, CONFIG.text.fruit, () => game.fruit());

game.start();
window.foxfire = game;
</script>
</body>
</html>
