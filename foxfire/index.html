<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foxfire</title>
<style>
  /* Every colour on this page is a custom property put here from the palette
     in config.js, so a colour is written in one file and read in the other.
     No value below is a literal. */
  *{box-sizing:border-box}
  /* The page grows as the organism does, and everything not on it yet is
     hidden. Said here because a rule below that gives an element a display of
     its own would otherwise put it back on the page. */
  [hidden]{display:none !important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--loam);color:var(--ink)}
  body{
    font:14px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
    font-variant-numeric:tabular-nums lining-nums;
    -webkit-text-size-adjust:100%;
  }

  /* The floor: the whole window, behind everything. */
  #floor{position:fixed;inset:0;z-index:0}
  #floor canvas{display:block;width:100%;height:100%}

  /* The specimen label, pinned to the top left of the floor: two lines of
     small text on paper, the way a tag is tied to a pressed specimen. */
  #label{
    position:absolute;left:18px;top:16px;max-width:min(56vw,460px);
    background:var(--paper);color:var(--ink);border:1px solid var(--rule);
    padding:6px 11px 7px;font-size:12px;line-height:1.4;pointer-events:none;
  }
  #label p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #label #title{font-weight:600;letter-spacing:.01em}
  #label i{font-style:normal;font-variant:small-caps;letter-spacing:.03em;color:var(--faded)}
  #label span span{margin-left:.28em}
  #label #st-level,#label #st-area,#label #st-minerals,#label #st-tips{margin-left:.7em}
  /* The rate carries its unit rather than a word in front of it. */
  #label #st-income{margin-left:.45em}
  #label #st-income i{margin-left:0}
  #label #sugar{color:var(--sugar)}
  #label #income{color:var(--moss)}
  #label #minerals{color:var(--mineral)}

  /* The journal: cream paper down the right, scrolling inside itself. */
  #journal{
    position:fixed;top:0;right:0;bottom:0;width:400px;z-index:2;
    background:var(--paper);color:var(--ink);border-left:1px solid var(--rule);
    overflow-y:auto;overflow-x:hidden;overflow-wrap:break-word;
    padding:15px 18px 26px;
  }
  #tagline{margin:0 0 12px;font-style:italic;font-size:12.5px;color:var(--faded)}
  .panel{margin:0 0 16px}
  .panel:last-of-type{margin-bottom:0}
  h2{
    font-size:13.5px;font-weight:600;font-variant:small-caps;letter-spacing:.05em;
    color:var(--ink);margin:0 0 6px;padding-bottom:3px;border-bottom:1px solid var(--rule);
  }
  p{margin:0}
  .note{color:var(--faded);font-size:12.5px;margin-top:5px}

  /* Paper labels. */
  button{
    font:inherit;font-size:13px;line-height:1.35;color:var(--ink);background:var(--paper);
    border:1px solid var(--rule);border-color:color-mix(in srgb,var(--ink) 60%,transparent);
    padding:2px 9px;cursor:pointer;border-radius:1px;
  }
  button:hover:not(:disabled),button:active:not(:disabled){background:var(--paper-deep)}
  button:disabled{color:var(--faded);cursor:default}
  button b{font-weight:500}
  button i{font-style:normal;font-variant:small-caps;letter-spacing:.03em;color:var(--faded);margin-left:7px;font-size:12px}
  button:disabled i{color:var(--faded)}
  .acts{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:0 0 5px}

  /* The entries: oldest at the top, the newest one at the foot of the page. */
  #log{max-height:min(31vh,300px);overflow-y:auto;overflow-x:hidden;padding-right:5px}
  #log p{margin:0 0 7px}
  #log p:last-child{margin-bottom:0}
  #log .mark{font-style:normal;font-variant:small-caps;letter-spacing:.04em;color:var(--faded);margin-right:.3em}

  /* The hand. */
  #hand{display:flex;align-items:baseline;gap:10px}
  #handline{color:var(--faded);font-size:12.5px}
  #tipline{color:var(--faded);font-size:12.5px}

  /* The trees ledger. */
  #trees-panel{overflow-x:auto}
  #trees{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}
  #trees th{
    font-size:10.5px;font-weight:600;font-variant:small-caps;letter-spacing:.04em;color:var(--faded);
    text-align:left;padding:2px 3px 3px 0;background:var(--paper-deep);border-bottom:1px solid var(--rule);
    white-space:nowrap;overflow:hidden;
  }
  #trees th:first-child{padding-left:4px}
  #trees th:nth-child(1){width:94px} #trees th:nth-child(2){width:40px} #trees th:nth-child(3){width:44px}
  #trees th:nth-child(4){width:44px} #trees th:nth-child(5){width:38px} #trees th:nth-child(6){width:46px}
  #trees th:nth-child(7){width:58px}
  /* The figures line up on their right, the way a ledger's do, which is also
     what keeps one column's heading off the next one's. */
  #trees th:nth-child(n+2):nth-child(-n+5),#trees td.size,#trees td.sent,#trees td.got,#trees td.rate{
    text-align:right;padding-right:7px;
  }
  #trees td{
    padding:4px 3px 4px 0;vertical-align:top;border-bottom:1px solid var(--rule);
    overflow:hidden;white-space:nowrap;font-size:11.5px;
  }
  #trees td.kind{padding-left:4px}
  #trees td.kind b{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis}
  #trees td.kind small{display:block;color:var(--faded);font-size:10px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
  #trees td.sent{color:var(--mineral)} #trees td.got{color:var(--sugar)}
  #trees td.rate{font-weight:700}
  #trees td.rate.cold{color:var(--faded);font-weight:400}
  /* The share: five ticks, filled up to the weight, clicked to set it. */
  #trees td.weight button.tick{
    width:7px;height:7px;padding:0;margin:2px 2px 0 0;border-radius:0;
    border:1px solid var(--ink);background:var(--paper);vertical-align:middle;
  }
  #trees td.weight button.tick.on{background:var(--ink)}
  #trees td.policy button{
    display:block;font-size:10.5px;font-variant:small-caps;letter-spacing:.03em;
    padding:0 5px;margin:0 0 3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  }
  #trees td.policy button.on{border-color:var(--rust);color:var(--rust)}
  #treesnote{color:var(--faded);font-size:12.5px;margin-top:5px}

  /* The year: one ruled line, four marks, and the point we are at. */
  #season-name{font-variant:small-caps;letter-spacing:.05em;font-size:14px}
  #season-left{color:var(--faded);font-size:12.5px;margin-left:8px}
  #season-track{position:relative;height:10px;margin-top:7px}
  #season-track::before{content:"";position:absolute;left:0;right:0;top:5px;height:1px;background:var(--rule)}
  #season-track .mk{position:absolute;top:2px;width:1px;height:7px;background:var(--rule)}
  #season-track .mk:nth-of-type(1){left:0}
  #season-track .mk:nth-of-type(2){left:25%}
  #season-track .mk:nth-of-type(3){left:50%}
  #season-track .mk:nth-of-type(4){left:75%}
  #season-bar{
    position:absolute;top:0;left:0;width:0;height:0;margin-left:-4px;
    border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--ink);
  }
  .season-2 #season-name,.season-2 #season-bar{color:var(--rust)}
  .season-2 #season-bar{border-top-color:var(--rust)}

  /* Reach. */
  #reachline,#beyondline,#belowline{color:var(--faded);font-size:12.5px;margin:0 0 5px}
  #beyondline:empty,#belowline:empty{margin:0}
  #beyond{border-color:var(--rust);color:var(--rust)}

  /* Traits and what the spore carries: a label, what it does, how far it has
     gone. On a column this narrow the sentence sits under its own label. */
  .rrow{
    display:grid;grid-template-columns:1fr auto;grid-template-areas:"name lv" "line line";
    gap:1px 8px;align-items:baseline;margin:0 0 9px;
  }
  .rrow button.rite{grid-area:name;justify-self:start;max-width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow .lv{grid-area:lv;color:var(--faded);font-size:11px;font-variant:small-caps;letter-spacing:.04em}
  .rrow .line{grid-area:line;color:var(--faded);font-size:12.5px;line-height:1.35}
  #genome{margin-top:2px}

  /* Fruiting. */
  #spores-note{color:var(--faded);font-size:12.5px;margin-bottom:7px}
  #spores-held{color:var(--moss);font-size:12.5px;margin-top:7px}
  #fruit{border-color:var(--moss);color:var(--moss)}

  /* The desk drawer. */
  #tools{display:flex;align-items:center;gap:7px;margin-top:18px;padding-top:10px;border-top:1px solid var(--rule)}
  #tools button{font-size:12px;font-variant:small-caps;letter-spacing:.03em;padding:1px 8px}
  #saved{margin-left:auto;color:var(--faded);font-size:12px}

  /* A phone: the floor keeps the top third and the journal slides up over the
     rest of it. Nothing is beside anything, so nothing can be cut off. */
  @media (max-width:760px){
    #journal{top:34vh;left:0;right:0;width:auto;border-left:0;border-top:1px solid var(--rule);padding:13px 14px 22px}
    #label{left:11px;top:11px;max-width:calc(100% - 22px)}
    #log{max-height:min(26vh,220px)}
    #trees th:nth-child(n){width:auto}
    #trees{table-layout:auto;min-width:340px}
  }
  @media (max-height:620px){
    #log{max-height:150px}
    .panel{margin-bottom:12px}
  }
</style>
</head>
<body>
<div id="floor">
  <canvas id="v"></canvas>
  <div id="label">
    <p><b id="title"></b><span id="st-level" hidden><i id="lbl-level"></i><span id="level"></span></span><span id="st-area" hidden><i id="lbl-area"></i><span id="area"></span></span></p>
    <p><span id="st-sugar"><i id="lbl-sugar"></i><span id="sugar">0</span></span><span id="st-income" hidden><span id="income"></span><i id="lbl-income"></i></span><span id="st-minerals" hidden><i id="lbl-minerals"></i><span id="minerals"></span></span><span id="st-tips" hidden><i id="lbl-tips"></i><span id="tips"></span></span></p>
  </div>
</div>

<aside id="journal">
  <p id="tagline"></p>

  <section class="panel" id="entries-panel">
    <h2 id="fieldhint"></h2>
    <div id="log"></div>
  </section>

  <section class="panel" id="hand-panel">
    <div id="hand"><button id="reach"></button><span id="handline"></span></div>
  </section>

  <section class="panel" id="tips-panel" hidden>
    <h2 id="p-tips"></h2>
    <div class="acts"><button id="buy-tip"></button><button id="buy-tips-max"></button></div>
    <p id="tipline"></p>
  </section>

  <section class="panel" id="trees-panel" hidden>
    <h2 id="p-trees"></h2>
    <table id="trees"></table>
    <p id="treesnote"></p>
  </section>

  <section class="panel" id="season-panel" hidden>
    <h2 id="p-season"></h2>
    <p><span id="season-name"></span><span id="season-left"></span></p>
    <div id="season-track"><i class="mk"></i><i class="mk"></i><i class="mk"></i><i class="mk"></i><span id="season-bar"></span></div>
  </section>

  <section class="panel" id="reach-panel" hidden>
    <h2 id="p-reach"></h2>
    <p id="reachline"></p>
    <div class="acts"><button id="extend"></button><button id="beyond" hidden></button></div>
    <p id="beyondline"></p>
    <p id="belowline" hidden></p>
  </section>

  <section class="panel" id="traits-panel" hidden>
    <h2 id="p-traits"></h2>
    <div id="traits"></div>
  </section>

  <section class="panel" id="spores-panel" hidden>
    <h2 id="p-spores"></h2>
    <p id="spores-note"></p>
    <button id="fruit" hidden></button>
    <p id="spores-held"></p>
    <h2 id="p-genome" hidden></h2>
    <div id="genome" hidden></div>
  </section>

  <div id="tools">
    <button id="export"></button>
    <button id="import"></button>
    <button id="reset"></button>
    <span id="saved"></span>
  </div>
</aside>

<script type="module">
// ---------------------------------------------------------------------------
// Foxfire. One spore on a dead log; then the forest.
//
// This file only wires the page to the game. Everything the game is lives in
// src/, every number lives in config.js, and every sentence lives in
// content.js.
// ---------------------------------------------------------------------------
import { CONFIG, applyIdentity } from './config.js?v=4';
import { createGame } from './src/game.js?v=4';

applyIdentity(document);

const game = createGame({
  doc: document,
  win: window,
  canvas: document.getElementById('v'),
  cfg: CONFIG,
  storage: window.localStorage,
});

// The drawer: a save that can leave, a save that can arrive, and a clean slate.
document.getElementById('export').addEventListener('click', () => {
  const str = game.exportSave();
  const done = (ok) => game.ui.savedNote(ok ? CONFIG.text.saveCopied : CONFIG.text.saveCopyThis + str.slice(0, 24) + '...');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(str).then(() => done(true), () => { window.prompt(CONFIG.text.savePrompt, str); done(false); });
  } else {
    window.prompt(CONFIG.text.savePrompt, str);
    done(false);
  }
});
document.getElementById('import').addEventListener('click', () => {
  const str = window.prompt(CONFIG.text.savePaste);
  if (!str) return;
  try { game.importSave(str); } catch (e) { game.ui.savedNote(String(e.message || e)); }
});

// Two presses to do anything that cannot be undone.
const armed = (id, sure, plain, fn) => {
  let on = false;
  const b = document.getElementById(id);
  b.addEventListener('click', () => {
    if (!on) { on = true; b.textContent = sure; setTimeout(() => { on = false; b.textContent = plain; }, 4000); return; }
    fn();
  });
};
armed('reset', CONFIG.text.resetSure, CONFIG.text.reset, () => game.reset());
armed('fruit', CONFIG.text.fruitSure, CONFIG.text.fruit, () => game.fruit());

game.start();
window.foxfire = game;
</script>
</body>
</html>
