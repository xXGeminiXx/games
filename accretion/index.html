<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accretion</title>
<style>
  /* Colours arrive from config.js as custom properties; the values here are
     only what the page shows before that file has run. */
  :root{--void:#04050a; --ink:#c8cede; --figure:#e6ebf5; --label:#5d6579; --quiet:#4a5164}
  html,body{height:100%;margin:0;background:var(--void);overflow:hidden}
  body{
    font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--ink); -webkit-user-select:none; user-select:none;
  }
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
  #hud{
    position:fixed; left:30px; top:74px; pointer-events:none;
    font-variant-numeric:tabular-nums; letter-spacing:.02em;
  }
  #hud b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--figure)}
  #hud span{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--label)}
  #hud #fluxrow{margin-top:10px}
  #hud #fluxrow b{font-size:16px;display:inline-block;margin-right:8px}
  #hud #fluxrow i{font-style:normal;font-size:10px;color:var(--quiet);margin-left:8px}
  #note{
    position:fixed; left:30px; bottom:30px; color:var(--quiet); font-size:11px;
    pointer-events:none;
  }
  /* A run that fills its field cannot be clicked any further, and every other
     way out of it was a console command. This is the way out, kept as quiet as
     the prompt above it so it is there without asking to be pressed. */
  #again{
    position:fixed; left:30px; bottom:52px;
    background:none; border:0; padding:0;
    color:var(--label); font:inherit; font-size:10px;
    text-transform:uppercase; letter-spacing:.11em; cursor:pointer;
  }
  #again:hover, #again:focus-visible{color:var(--figure); outline:none}
  /* The research window: at most six rows, in the same gutter as the mass. */
  #board{position:fixed; left:30px; top:178px; width:280px; font-size:11px; line-height:1.35}
  #board #era{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--label);margin-bottom:8px}
  #board .node,#board .law{padding:5px 8px 6px;margin:0 0 4px -8px;border-left:1px solid transparent;opacity:.55}
  #board .node.can{opacity:1;cursor:pointer;border-left-color:var(--label)}
  #board .node.can:hover{background:rgba(200,206,222,.06)}
  #board .node.wanted{border-left-color:var(--figure)}
  #board .node.wanted .name{color:var(--figure)}
  #board .node.shut{opacity:.3}
  #board .law{opacity:.85}
  #board .head{display:flex;justify-content:space-between;gap:12px}
  #board .name{color:var(--ink)}
  #board .cost{color:var(--label);font-variant-numeric:tabular-nums}
  #board .line{color:var(--quiet);font-size:10px;margin-top:1px}
  #board input[type=range]{width:100%;margin:4px 0 0;accent-color:var(--label);height:12px}
  /* The ending. Centred, quiet, and it waits. */
  #ending{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; color:var(--ink); background:rgba(4,5,10,.55);
    font-size:12px; line-height:1.9;
  }
  #ending .title{font-size:18px;letter-spacing:.08em;color:var(--figure);margin-bottom:14px}
  #ending .line{color:var(--label)}
  #ending .again{margin-top:26px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--label);padding-bottom:2px}
  #ending .again:hover{color:var(--figure)}
</style>

<script>
(function () {
  var meta = document.querySelector('meta[name="build"]');
  var mine = meta && meta.getAttribute('content');
  if (!mine || !window.fetch) return;
  var every = 300000;          // re-ask every five minutes while the tab is open
  var checking = false;

  function reload(to) {
    // A plain reload can be answered from cache, so the new build is asked for
    // by a URL the cache has not seen. Whatever the player already had on the
    // address bar is kept; only a previous build stamp is replaced.
    var q = new URLSearchParams(location.search);
    q.set('b', to);
    location.replace(location.pathname + '?' + q.toString() + location.hash);
  }

  function check() {
    if (checking || document.hidden) return;
    checking = true;
    fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        checking = false;
        if (!j || !j.build || j.build === mine) return;
        // One reload per build. If the page comes back still stamped with the
        // old id the files were not really replaced, and reloading again would
        // only spin.
        try {
          if (sessionStorage.getItem('build-watch') === j.build) return;
          sessionStorage.setItem('build-watch', j.build);
        } catch (e) { /* private mode: fall through and reload once */ }
        reload(j.build);
      })
      .catch(function () { checking = false; });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, every);
  setTimeout(check, 15000);
})();
</script>

<body>
<canvas id="v"></canvas>
<div id="hud"><b id="mass">0</b><span id="masslabel">bound mass</span>
  <div id="fluxrow"><b id="flux">0</b><span id="fluxlabel">flux</span><i id="fluxrate"></i></div></div>
<div id="board"><div id="era"></div><div id="nodes"></div><div id="laws"></div></div>
<div id="ending"></div>
<div id="note">click the void</div>
<button id="again" type="button">start over</button>

<script type="module">
// ---------------------------------------------------------------------------
// Accretion.
//
// A blank field. A click puts something in it. A second thing pulls on the
// first, and nothing after that is scripted: what forms, forms because the
// field says so.
//
// This is the composition root: it wires the simulation to the renderer,
// decides what a click is worth, translates what the field reports into what
// the view can draw, and names things the first time they happen.
// ---------------------------------------------------------------------------

import { CONFIG, simOptions, applyIdentity, storageKey } from './config.js';
import { createSim, restoreSim, magToString, EVENT, KIND, KIND_NAME, AGG_FIRST, FLAG_AGGREGATE, FLAG_GAS, STAGE, FATE } from './src/sim.js';
import { createRenderer, createSimAdapter, setSpectrum, CONFIG as VIEW } from './src/render.js';
import * as Stellar from './src/stellar.js';
import { createGame } from './src/game.js';

// Name, prompts and colours all arrive from config.js, so the markup above
// never has to be edited to rename or recolour anything.
applyIdentity(document);

const canvas = document.getElementById('v');

// The renderer keeps its own numbers. The few a player might want to turn live
// in config.js like everything else, so they are handed over before it starts
// rather than being edited in two places.
VIEW.zoomPerWheelNotch   = CONFIG.camera.zoomStep;
VIEW.wheelPixelsPerNotch = CONFIG.camera.wheelPixelsPerNotch;
VIEW.frameFill           = CONFIG.camera.frameFill;
VIEW.zoomTauExpand       = CONFIG.camera.pullBackSeconds;
VIEW.zoomTauContract     = CONFIG.camera.closeInSeconds;
VIEW.zoomMaxRate         = CONFIG.camera.maxDecadesPerSecond;
VIEW.followTau           = CONFIG.camera.followSeconds;
VIEW.panLimitScreens     = CONFIG.camera.panLimitScreens;

// WHAT MATTER LOOKS LIKE, handed over BEFORE the renderer exists.
//
// The colour ramp and every sprite in the atlas are baked from these, so they
// have to be in place before the first one is built. setSpectrum is the way in
// for exactly that reason: writing to VIEW alone would change the numbers and
// leave the baked copies behind, which looks like nothing happening at all.
setSpectrum({
  coldestK:        CONFIG.matter.coldest,
  hottestK:        CONFIG.matter.hottest,
  glowFromK:       CONFIG.matter.glowFrom,
  glowFullK:       CONFIG.matter.glowFull,
  reflectance:     CONFIG.matter.reflectance,
  coronaCold:      CONFIG.matter.corona,
  coronaReachCold: CONFIG.matter.coronaReach,
  coreGlowCold:    CONFIG.matter.coreGlow,
  surfaceCold:     CONFIG.matter.surface,
  detailMinPx:     CONFIG.matter.detailMinPx,
  detailBodies:    CONFIG.matter.detailBodies,
  detailPatches:   CONFIG.matter.detailPatches,
  detailAlpha:     CONFIG.matter.detailAlpha,
});

// The field. `let`, because closing a universe and beginning again builds a
// new one, and so does taking a saved run on at boot.
let sim = createSim(simOptions());
const view = createRenderer(canvas, {});

// WHAT COLOUR A THING IS, AND HOW BRIGHT.
//
// Cold matter takes its colour from a table - grains, rock, worlds - lifted a
// little by its own heat, so a violently accreting body runs hotter than a
// settled one. Everything from a brown dwarf up is physics: a star's colour
// and brightness follow from its mass alone, a giant is red, a white dwarf is
// born blue-white and cools, a neutron star is hotter than the ramp resolves,
// and gas thrown off a dying star cools as it spreads. One function decides
// each, and the event bridge below asks the same one, so a flash is always
// the colour of the thing it came from.
// Gas remembers which death threw it: a supernova's shell is shocked and
// glows, a shed envelope or a collapse's last puff is cool and dim.
const gasIsHot = (b) => b.fate === STAGE.SUPERNOVA || b.fate === STAGE.DETONATION;

const solarOf = (b) => {
  if (!b) return 0;
  if (b.solar !== undefined) return b.solar;
  const m = b.m !== undefined ? b.m : b.mass;
  return Stellar.solar(Math.log2(Math.max(m || 1e-12, 1e-12)) + (b.expMass || 0));
};

function temperatureOf(heat, kind, b) {
  if (b && (b.gas || b.isGas)) {
    return Stellar.gasTemperature(b.phase !== undefined ? b.phase : (b.burn || 0), gasIsHot(b));
  }
  switch (kind) {
    case KIND.BROWN_DWARF: return Stellar.BROWN_DWARF_TEMPERATURE;
    case KIND.STAR: return Stellar.mainSequence(solarOf(b)).T;
    case KIND.GIANT_STAR: return Stellar.giantTemperature(solarOf(b), CONFIG.stellar);
    case KIND.WHITE_DWARF: return Stellar.whiteDwarfTemperature(b ? (b.phase !== undefined ? b.phase : b.burn) : 0);
    case KIND.NEUTRON_STAR: return Stellar.NEUTRON_STAR_TEMPERATURE;
    default: {
      const table = CONFIG.matter.temperature;
      const base = table[kind] !== undefined ? table[kind] : table[0];
      const lift = 1 + CONFIG.matter.heatLift *
        Math.min(1, Math.log10(1 + Math.max(0, heat)) / 12);
      return base * lift;
    }
  }
}

function luminosityOf(heat, kind, b) {
  const M = CONFIG.matter;
  if (b && (b.gas || b.isGas)) {
    const age = b.phase !== undefined ? b.phase : (b.burn || 0);
    // Cooling, and thinning to nothing over the last stretch of its life.
    const life = CONFIG.stellar.gasLifeSeconds;
    const fade = Math.min(1, Math.max(0, (life - age) / (life * 0.3)));
    // Bright enough to register beside the star that threw it - a shell drawn
    // at a few percent of its star's brightness is a shell nobody sees - and
    // shocked gas far brighter than merely shed gas.
    return (gasIsHot(b) ? 0.14 + 0.5 * Math.exp(-age / 12) : 0.06 + 0.16 * Math.exp(-age / 12)) * fade;
  }
  const starLum = (L) => Math.min(M.starLumCeiling, Math.max(M.starLumFloor, Math.pow(L, M.starLumExponent)));
  switch (kind) {
    case KIND.STAR: return starLum(Stellar.mainSequence(solarOf(b)).L);
    case KIND.GIANT_STAR: return Math.max(0.9, starLum(Stellar.giantLuminosity(solarOf(b))));
    case KIND.WHITE_DWARF: return Stellar.remnantLuminosity('white dwarf', b ? (b.phase !== undefined ? b.phase : b.burn) : 0);
    case KIND.NEUTRON_STAR: return Stellar.remnantLuminosity('neutron star', 0);
    default: {
      const table = M.luminosity;
      return table[kind] !== undefined ? table[kind] : table[0];
    }
  }
}

const adapt = createSimAdapter({
  // WHAT AN AGGREGATE IS, by the simulation's own flag and threshold rather
  // than by the adapter's defaults, so the agreement is structural and cannot
  // drift the first time the kind list changes.
  flagAggregate: FLAG_AGGREGATE,
  aggFirstKind: AGG_FIRST,
  flagGas: FLAG_GAS,
  temperature: temperatureOf,
  luminosity: luminosityOf,
});

// Deterministic scatter. Identical inputs have to produce an identical
// universe, so nothing here draws a random number - every variation is a hash
// of which click it was and which body within it.
function hash2(a, b) {
  let h = (Math.imul(a | 0, 0x27d4eb2f) ^ Math.imul(b | 0, 0x165667b1)) >>> 0;
  h = Math.imul(h ^ (h >>> 15), 0x2545f491) >>> 0;
  return ((h ^ (h >>> 13)) >>> 0) / 4294967296;
}

// A click is a seed, not a placement: mass arrives with a little scatter and a
// little momentum, so two clicks in the same place still make a system rather
// than a stack.
//
// THE SCATTER IS MEASURED IN PIXELS, NOT WORLD UNITS. It used to be a
// world-space radius that GREW with the number of clicks, so by the fiftieth
// click mass was arriving a long way from the cursor. A few pixels converted
// through the live projection is right at every scale and always lands under
// the cursor, which is the only thing a click has to promise.
let clicks = 0;
function seedAt(sx, sy) {
  const w = view.screenToWorld(sx, sy);
  if (!w) return;
  seedWorld(w.x, w.y, { clicked: true });
}

/**
 * A click's worth of matter at a world point. The click and the infall law
 * both come through here, so what falls in on its own is exactly what a
 * click would have put there.
 */
function seedWorld(wx, wy, opts) {
  if (game.closing) return;
  const seed = CONFIG.seeding;
  const vp = view.getViewport();
  const perUnit = vp && vp.pxPerUnit > 0 ? vp.pxPerUnit : 1;

  // What a click is worth: a share of what is already there, floored at the
  // base - see seeding.clickShare for why a flat contribution could not work
  // against an exponential ladder.
  const st = sim.stats ? sim.stats() : null;
  const held = st && st.totalMass ? st.totalMass.m * Math.pow(10, st.totalMass.e) : 0;
  if (held >= seed.massCeiling) { say(CONFIG.text.promptFull, CONFIG.text.captionSeconds); return; }
  // Said once, the first time a run comes within reach of its ceiling. The
  // field keeps taking clicks after this; the line only exists so the wall is
  // not the first anyone hears of it.
  if (!saidNearFull && held >= seed.massCeiling * seed.ceilingWarnAt) {
    saidNearFull = true;
    say(CONFIG.text.promptNearFull, CONFIG.text.captionSeconds);
  }
  // The share is decided in ABSOLUTE units - the ladder and the ceiling live
  // there - but addBody takes the field's own CODE units, which the ledger
  // re-centres as the run grows. The conversion is asked of the field, which
  // owns the ledger.
  const perAbs = Math.max(seed.massPerBody,
                          (held * seed.clickShare) / Math.max(1, seed.bodiesPerClick));
  const per = sim.codeMassFromAbsolute(perAbs);
  const floor = sim.codeMassFromAbsolute(seed.massPerBody * 0.1);

  // Far enough apart to BE apart: a few pixels on screen so the click reads as
  // a scatter, and never closer than a few radii of whatever is being placed.
  const bodyR = sim.radiusForMass(per);
  const spread = Math.min(seed.spreadMaxPixels / perUnit,
                          Math.max(seed.spreadPixels / perUnit, bodyR * seed.spreadRadii));

  // WHAT A CLICK IS, LATE IN A RUN. Once a click's share of the field is
  // more than a star's worth of matter, it does not arrive as a star: nothing
  // that heavy arrives as anything but a cloud. It comes in as gas, which
  // cools, and either gathers into a star of its own or is captured by one
  // that is already there. That is star formation, and it is also what stops
  // a late field filling with instant stars three at a time.
  const asCloud = Math.log2(perAbs) >= Stellar.IGNITION_LOG2;

  // THE ORBIT LAW. Matter that arrives with sideways motion about the
  // heaviest thing near it makes a system instead of a pile. The share is
  // the player's dial; without the law it is zero and seeds fall straight in.
  const share = game.orbitShare();
  let ovx = 0, ovy = 0;
  if (share > 0) {
    const rv = sim.getRenderView();
    let bi = -1, bm = -1;
    for (let i = 0; i < rv.count; i++) if (rv.mass[i] > bm && !(rv.flags[i] & FLAG_GAS)) { bm = rv.mass[i]; bi = i; }
    if (bi >= 0) {
      const dx = wx - rv.px[bi], dy = wy - rv.py[bi];
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d > rv.radius[bi] * 1.5) {
        const v = Math.sqrt(bm / d) * share;    // circular speed, G = 1
        ovx = rv.vx[bi] - dy / d * v; ovy = rv.vy[bi] + dx / d * v;
      }
    }
  }

  const step = 6.2831853 / Math.max(1, seed.bodiesPerClick);
  for (let k = 0; k < seed.bodiesPerClick; k++) {
    // The golden angle keeps successive clicks from landing on the same spokes.
    const jitter = (hash2(clicks, k) - 0.5) * step * seed.angleJitter;
    const a = (clicks * 2.3999632 + k * step + jitter) % 6.2831853;
    const near = 0.6 + 0.4 * hash2(clicks ^ 0x9e37, k);
    const vary = 1 + (hash2(clicks, k ^ 0x5bf0) - 0.5) * 2 * seed.massJitter;
    sim.addBody({
      x: wx + Math.cos(a) * spread * near,
      y: wy + Math.sin(a) * spread * near,
      vx: ovx + Math.cos(a + 1.5708) * seed.launchSpeed,
      vy: ovy + Math.sin(a + 1.5708) * seed.launchSpeed,
      mass: Math.max(floor, per * vary),
      kind: asCloud ? KIND.DUST : undefined,
      gas: asCloud,
    });
  }
  clicks++;
  game.noteSeed();
  if (opts && opts.clicked) {
    if (clicks === 1) say(CONFIG.text.promptSecond, 0);
    else if (clicks === seed.promptFadesAt) say(CONFIG.text.promptDone, 0);
  }
}

/**
 * A whole cloud at a world point: the star-formation law's arrival. Each body
 * carries a share of the field's mass, as a click would, and a share of its
 * REPRESENTED population, so what the field stands for compounds the way
 * what it weighs does. It arrives as gas: it cools, and it ignites.
 */
function seedCloud(wx, wy, n, pop) {
  if (game.closing) return;
  const seed = CONFIG.seeding;
  const st = sim.stats();
  const held = st.totalMass ? st.totalMass.m * Math.pow(10, st.totalMass.e) : 0;
  if (held >= seed.massCeiling) return;
  const perAbs = Math.max(seed.massPerBody, (held * seed.clickShare) / Math.max(1, n));
  const per = sim.codeMassFromAbsolute(perAbs);
  const ext = st.extent ? st.extent.m * Math.pow(10, st.extent.e) : 0;
  const extCode = ext / Math.pow(2, st.ledger.expLen);
  const radius = Math.max(sim.radiusForMass(per) * 6 * Math.sqrt(n), extCode * CONFIG.game.cloudRadius);
  sim.addCloud({
    n, x: wx, y: wy, radius, mass: per, spin: 0.7, sigma: 0,
    kind: KIND.DUST, gas: true, pop: Math.max(1, pop), seed: (clicks * 2654435761) >>> 0,
  });
  clicks++;
  game.noteSeed();
}

canvas.addEventListener('pointerdown', e => seedAt(e.clientX, e.clientY));
addEventListener('resize', () => view.resize());
// NO WHEEL HANDLER HERE. The renderer binds its own, anchored at the cursor,
// and a second one on the window meant every notch was applied twice.

// THE LINE ALONG THE BOTTOM. It says what the field just did for the first
// time, and then goes quiet. A duration of 0 keeps a line until the next.
const note = document.getElementById('note');
let noteUntil = 0;
function say(text, seconds) {
  note.textContent = text || '';
  noteUntil = seconds > 0 ? performance.now() + seconds * 1000 : 0;
}
const seen = new Set();
// Said once per run, not once per click: the ceiling is approached over many
// of them, and a warning repeated every time would bury the line that says
// what the field just did.
let saidNearFull = false;
function discover(key, fallback) {
  if (seen.has(key)) return;
  seen.add(key);
  const words = CONFIG.text.discoveries[key];
  say(CONFIG.matter.discoveryPrefix + (words === undefined ? (fallback || key) : words),
      CONFIG.text.captionSeconds);
}

// WHAT THE FIELD DID, IN WORDS THE RENDERER KNOWS.
//
// The field reports what happened as integer codes and names the BODY it
// happened to; the renderer switches on names and needs the PLACE. This looks
// the body up and hands over both, and it decides which events are worth
// light at all: a rock meeting a rock is silent, a star swallowing something
// flares, a supernova is the one flash in the game that is earned, and a
// direct collapse is drawn on the star itself rather than announced.
function dress(e) {
  let name = null;
  switch (e.type) {
    case EVENT.MERGE: name = 'merge'; break;
    case EVENT.CONDENSE: name = 'birth'; break;
    case EVENT.COLLAPSE: name = 'collapse'; break;
    case EVENT.KIND_CHANGE: if (e.kind === KIND.STAR) name = 'ignite'; break;
    case EVENT.EJECT:
      if (e.stage === STAGE.SUPERNOVA) name = 'supernova';
      else if (e.stage === STAGE.NEBULA) name = 'nebula';
      else if (e.stage === STAGE.DETONATION) name = 'detonation';
      break;
    default: break;
  }
  if (!name) return e;
  const b = sim.getBody(e.id);
  if (!b) return e;
  const out = { type: name, x: b.x, y: b.y, r: b.radius, T: temperatureOf(b.heat, b.kind, b) };
  if (name === 'merge') {
    // How hard it landed, and whether anything in it was shining.
    out.energy = Math.max(0.2, Math.min(4, 1 + (e.absorbed || 0) * 0.35));
    out.hot = b.kind >= KIND.BROWN_DWARF && b.kind < AGG_FIRST && !b.isGas;
  }
  return out;
}

// NAMING THINGS. Every first happening is said once along the bottom: each
// rung of the ladder, first light, the swelling, each way of dying and each
// thing left behind.
function witness(e) {
  switch (e.type) {
    case EVENT.BLOCKED:
      // The field has earned a kind it may not take. That is the game's
      // business: the node lights on the board, and buying it is the unlock.
      break;
    case EVENT.KIND_CHANGE: {
      if (e.kind === KIND.STAR) {
        const b = sim.getBody(e.id);
        discover(b && b.isGas === false && e.from === KIND.BROWN_DWARF ? 'star' : 'star');
      } else if (e.kind === KIND.GIANT_STAR) {
        const b = sim.getBody(e.id);
        discover(b && Stellar.isSupergiant(b.solar, CONFIG.stellar) ? 'red supergiant' : 'red giant');
      } else if (e.kind < KIND.STAR) {
        discover(KIND_NAME[e.kind]);
      }
      break;
    }
    case EVENT.DEATH:
      if (e.stage === STAGE.NEBULA) discover('planetary nebula');
      else if (e.stage === STAGE.SUPERNOVA) discover('supernova');
      else if (e.stage === STAGE.COLLAPSE) discover('collapse');
      else if (e.stage === STAGE.DETONATION) discover('detonation');
      break;
    case EVENT.REMNANT:
      if (e.kind >= 0) discover(KIND_NAME[e.kind]);
      break;
    default: break;
  }
}

// THE GAME AROUND THE FIELD: flux, the board, the laws, the ending, the save.
const game = createGame({
  CONFIG, KIND, KIND_NAME, EVENT, STAGE,
  getSim: () => sim,
  seedWorld, seedCloud, say, discover,
  doc: document,
  storage: (typeof localStorage !== 'undefined') ? localStorage : null,
  storageKey,
  onNewRun() {
    // A new universe: a fresh field under the same laws of physics. What was
    // learned is kept by the game; nothing else crosses.
    sim = createSim(simOptions());
    clicks = 0;
    seen.clear();
    say(CONFIG.text.promptFirst, 0);
  },
  onClose() {
    // The universe becomes one point and is gone. The renderer already has
    // this move - it is what plays when the run crosses an order of magnitude
    // - and here it plays once more over everything, and then the field is
    // emptied behind it.
    const vp = view.getViewport();
    view.emit({ type: 'stratum', x: vp ? vp.cx : 0, y: vp ? vp.cy : 0, name: '' });
    setTimeout(() => {
      const rv = sim.getRenderView();
      const ids = [];
      for (let i = 0; i < rv.count; i++) ids.push(rv.idOfSlot[i]);
      for (const id of ids) sim.removeBody(id);
    }, CONFIG.game.closeSeconds * 1000);
  },
});

// A run is written to storage every few seconds, which loses whatever
// happened since the last one if the page goes away in between. Write it once
// more whenever the page is being put aside - closed, navigated away from, or
// hidden by switching tabs - so what is on screen is what comes back.
// pagehide is the one that fires reliably when a phone browser discards a
// backgrounded tab; the others cover the ordinary cases.
function saveNow() { try { game.save(true); } catch (e) { /* a blocked store is not worth an error here */ } }
window.addEventListener('pagehide', saveNow);
window.addEventListener('beforeunload', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });


// A saved run is taken on before the first frame, so a reload is a resume.
{
  const rec = game.load();
  if (rec) {
    try {
      sim = restoreSim(rec.sim, simOptions());
      clicks = rec.seeds | 0;
      game.adopt(rec);
      say('', 0);
    } catch (e) {
      sim = createSim(simOptions());
    }
  }
}

const fmt = document.getElementById('mass');
let last = 0;

function frame(now) {
  const dt = last ? Math.min(CONFIG.field.maxStepSeconds, (now - last) / 1000) : 1 / 60;
  last = now;

  const vp = view.getViewport();
  if (vp) sim.setView({ cx: vp.cx, cy: vp.cy, pxPerUnit: vp.pxPerUnit, w: vp.w, h: vp.h });

  sim.step(dt);

  // Events are how the field tells the view that something happened - a merge,
  // an ignition, a death, a crossing into a new order of magnitude.
  const events = sim.drainEvents();
  for (let i = 0; i < events.length; i++) { view.emit(dress(events[i])); witness(events[i]); game.onEvent(events[i]); }

  const s = sim.stats();
  game.tick(dt, now, s);

  // The renderer frames on the extent of the field. It arrives as a magnitude
  // pair, and without it the camera has nothing to size itself against.
  let extent = 0;
  if (s && s.extent) {
    const e = s.extent.m * Math.pow(10, s.extent.e);
    if (Number.isFinite(e) && e > 0) extent = e;
  }

  // What a world unit is in metres, for the span the view prints and the
  // scale it names. Code units re-centre as the run grows, so the exponent
  // follows the ledger.
  const exp = Math.log10(CONFIG.field.metersPerUnit) + (s ? s.ledger.expLen : 0) * Math.log10(2);
  const world = adapt(sim.getRenderView(), { t: now / 1000, events, extent, exp });
  view.renderFrame(world, now);

  if (s && s.totalMass) fmt.textContent = magToString(s.totalMass, 2);
  if (noteUntil && now >= noteUntil) { note.textContent = ''; noteUntil = 0; }

  requestAnimationFrame(frame);
}

// The live objects, for tuning from the console the way the config layer
// allows from the address bar. Nothing in the game reads this.
if (typeof window !== 'undefined') {
  window.accretion = {
    get sim() { return sim; }, view, adapt, seedAt, seedWorld, game, Stellar, KIND, STAGE, FATE, CONFIG,
    // Forget the saved run and start over: accretion.reset() in the console.
    reset() { game.forget(); location.reload(); },
  };
}

// Starting over throws the run away, so it asks first - and it asks in the
// page rather than through the console, because a field that will take no more
// leaves a player with nothing else to press.
// The test harness runs this page against a DOM that has only the few nodes a
// field needs, so the control may not be there at all.
const againEl = document.getElementById('again');
if (againEl) againEl.addEventListener('click', () => {
  const w = document.defaultView;
  if (w && w.confirm && !w.confirm(CONFIG.text.confirmAgain)) return;
  game.forget();
  location.reload();
});

// The renderer can drive itself, but the field has to step first, so frames
// are driven from here. Calling start() as well would paint twice per frame,
// and with additive blending a second pass simply blows the exposure out.
requestAnimationFrame(frame);
</script>
</body>
</html>
